[technology-description]
the-cave-shelter-interior-expansion=Расширяет основную строительную площадку убежища до __1__×__2__ клеток и добавляет отдельную техническую полосу шириной 10 клеток со всех четырёх сторон, не перемещая закреплённое центральное ядро.
the-cave-shelter-battery-upgrade=Устанавливает или улучшает батарею убежища до __1__ МДж с максимальной скоростью внутренней зарядки __2__ МВт и внешней отдачи __3__ МВт.
the-cave-shelter-shield-upgrade=Укрепляет неподвижное Пещерное убежище до __1__ ОЗ и даёт авторемонт __2__ ОЗ/с. Автоматический ремонт начинается через 10 секунд после последнего попадания.
the-cave-shelter-shield-health=Прочность щита убежища: __1__ ОЗ
the-cave-shelter-shield-repair=Авторемонт: __1__ ОЗ/с
the-cave-shelter-attack-distance=Перемещает будущие входы вражеских туннелей на __1__ чанков от убежища; генерация и конвертация местности достигает __2__ чанков.
the-cave-shelter-garden=Открывает или расширяет Садовый этаж, этап __1__: закреплённое зелёное ядро, внутренняя вода и расширяемая почва для юмако и желейника.
the-cave-shelter-garden-effect=Садовый этаж, этап __1__

