[entity-description]
the-cave-shelter=Неподвижная главная цель начинает с 5 000 ОЗ. Исследования щита убежища повышают запас до 35 000 ОЗ и добавляют отложенный автоматический ремонт. Получает урон только от вражеской силы. Нельзя добыть, переместить, снести, скопировать в чертёж или ремонтировать вручную либо роботами.
the-cave-shelter-substation=Закреплённая главная внутренняя подстанция с прямой зоной питания 36×36 и дальностью провода 36 клеток. Она питает ядро убежища, заряжает батарею и передаёт ту же электрическую сеть к соединителю сада.
the-cave-shelter-hidden-battery=Устаревший скрытый мост батареи убежища, сохранённый только для безопасной миграции старых сохранений.
the-cave-shelter-battery-interior-charger=Одностороннее внутреннее зарядное устройство скриптовой батареи убежища. Оно потребляет энергию только внутри убежища и не может питать эту сеть.
the-cave-shelter-battery-output-reserve=Односторонний выходной резерв на 0,25 секунды для скриптовой батареи убежища. Питает машины и заряжает внешние аккумуляторы совместно с внешними генераторами. Внешняя энергия не может заряжать батарею убежища.
the-cave-shelter-fluid-input=Одностороннее соединение для жидкости от внешнего входа убежища к обоим внутренним портам ВХОД.
the-cave-shelter-fluid-output=Одностороннее соединение для жидкости от обоих внутренних портов ВЫХОД к внешнему выходу убежища.
the-cave-shelter-garden-substation=Закреплённый соединитель Садового этажа с дальностью провода 36 клеток и прямой зоной питания только в пределах защищённой площадки 2×2. Для питания машин подключайте электрические столбы.

