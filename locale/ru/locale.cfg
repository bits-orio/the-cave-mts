panel-text=ЭНЕРГОСИСТЕМА БАТАРЕИ ГЛАВНОГО ПОЕЗДА\n\nЭНЕРГИЯ: Производите электричество в любой части поезда.\nПРОВОДКА: Соедините эту сеть видимыми электрическими опорами с Главной подстанцией батареи поезда.\nИНТЕРЬЕР: Подключённая сеть питает машины внутри поезда.\nЗАРЯДКА: Только доступная мощность этой внутренней сети может заряжать батарею поезда.\nАККУМУЛЯТОРЫ: Построенные игроком аккумуляторы остаются обычной частью своей локальной сети и никогда не становятся хранилищем батареи поезда.\nСАД: Эта же Главная подстанция питает закреплённую подстанцию в локомотивном саду.\nСНАРУЖИ: Установите электрическую опору внутри жёлтого 10-клеточного квадрата «ЗОНА ПИТАНИЯ» вокруг Главного локомотива. Батарея поезда не подключается к опорам за пределами квадрата.\nОДНОСТОРОННИЙ ВЫХОД: Батарея поезда питает машины и заряжает внешние аккумуляторы совместно с внешними генераторами. Внешняя энергия никогда не может заряжать батарею поезда.\nОТОБРАЖЕНИЕ РЕЗЕРВА: Скрытый резерв передачи на 0,25 секунды обеспечен энергией батареи поезда. Это не построенный игроком аккумулятор.\nДРУГИЕ ЛОКОМОТИВЫ: Дополнительные локомотивы не получают закреплённую подстанцию.\nВАЖНО: Электричество не передаётся между вагонами автоматически.

