current-value=Текущее значение: __1__
mineral-cave-values=Железо __1__ · Медь __2__ · Уголь __3__
server-title=ИНФОРМАЦИЯ О СЕРВЕРЕ
server-welcome=Добро пожаловать в The Cave. Копайте наружу, открывайте новые залы, стройте защищённую подземную фабрику и готовьтесь перед входом в более глубокие и опасные регионы.
server-map-title=ТЕКУЩАЯ КАРТА
server-map-body=Время работы: __1__ ч __2__ мин\nИгроки онлайн: __3__ / __4__\nКарта, исследования, команды и все стартовые настройки являются общими для сервера.
server-profile-title=ТЕКУЩИЙ ПРОФИЛЬ МИРА
server-profile-body=Всё на Наувисе: __1__\nОбщая сложность: __2__\nПодземное освещение: __3__
server-safety-title=ВАЖНО
server-safety-body=Стартовые настройки блокируются после загрузки прототипов Factorio. Это меню показывает активную конфигурацию, но ничего не изменяет. Делайте резервную копию важных сохранений перед обновлением модов или изменением стартовых настроек.
category-overview=Обзор
category-exploration=Пещеры и исследование
category-resources=Ресурсы и копание
category-space-age=Регионы Space Age
category-missions=Миссии и особые зоны
category-combat=Бой и экономика
category-trains=Интерьеры поездов
category-cavetorio=CAVETORIO
category-research=Исследования и улучшения
category-machines=Машины и логистика
category-quality-life=Удобство и сетевая игра
overview-core-title=ОСНОВНОЙ ЦИКЛ THE CAVE
overview-core-body=Мир начинается под слоем сплошной породы. Добывайте её напрямую, чтобы открывать местность и детерминированные находки, а затем превращайте каждый зал в часть связанной подземной фабрики. Исследование, производство, наука и оборона развиваются вместе.
overview-depth-title=ЧЕТЫРЕ УРОВНЯ ГЛУБИНЫ
overview-depth-body=Расстояние от центра определяет лёгкую, среднюю, сложную и кошмарную зоны. Средняя начинается на 300 клетках, сложная на 700, кошмарная на 1000. Глубина усиливает врагов и открывает более опасные комнаты и ценные награды.
overview-config-title=НАСТРАИВАЕМЫЙ СЦЕНАРИЙ
overview-config-body=The Cave содержит множество независимых стартовых, общих и персональных параметров. Поддерживаются базовая игра и Space Age, обычные планеты или Всё на Наувисе, Интерьеры поездов, CAVETORIO, режимы испытаний и встроенные системы.
explore-dig-title=КОПАНИЕ И ОТКРЫТИЯ
explore-dig-body=Добывайте сплошную породу напрямую, чтобы открывать пещеру. Копание может обнаружить обычную местность, заданный зал, засаду, ресурсы или сокровища. Обвалы можно полностью отключить либо включить с исходной структурной опасностью и исследованием подпорок.
explore-rooms-title=ПЕЩЕРНЫЕ ЗАЛЫ
explore-rooms-body=Встречаются ресурсные залы, сокровищницы, вражеские гнёзда, охраняемые области и региональные находки. В зале гнёзд находится одно гнездо кусак, одно гнездо плевак и одно бронированное гнездо; опасность зависит от глубины.
explore-darkness-title=НАШЕСТВИЕ ИЗ ТЬМЫ
explore-darkness-body=За пределами безопасной области 5×5 чанков оставайтесь в пределах 12 клеток от работающей малой лампы или 30 клеток от фонарного столба. Через 30 секунд без защиты рядом начинают появляться враги. Транспорт и защищённые интерьеры сбрасывают таймер.
explore-treasure-title=СОКРОВИЩА И ГАРАНТИРОВАННАЯ НЕФТЬ
explore-treasure-body=Сокровища улучшаются с глубиной и могут содержать материалы, экипировку, боеприпасы и монеты. Стартовое месторождение нефти гарантировано примерно в 80–100 клетках от появления и скрыто, пока копание не приблизится на шесть клеток.
resources-veins-title=СМЕШАННЫЕ РЕСУРСНЫЕ ЖИЛЫ
resources-veins-body=The Cave может создавать непрерывные смешанные жилы вместо отдельных стандартных залежей. Размер, богатство и размеры стаков имеют отдельные настройки, а Защита залежей предотвращает случайное уничтожение ценных ресурсов.
resources-digging-title=РЕЖИМ КОПАНИЯ
resources-digging-body=Дополнительный режим убирает обычные залежи и делает добычу породы главным источником ресурсов. Hardcore даёт 0,5× награды, а Копание I–IV — 1×, 2×, 3× или 4×. Нефть и небольшие стартовые залежи для прогресса сохраняются.
resources-missing-title=ОТСУТСТВУЮЩАЯ ЗАЛЕЖЬ
resources-missing-body=Это испытание скрытно убирает с карты один базовый вид природной руды. Недостающий ресурс добывается при копании, меняя логистику без прямого объявления ответа.
resources-tools-title=ИНСТРУМЕНТЫ РЕСУРСОВ
resources-tools-body=Фильтр буров позволяет выбрать буры и ограничить их одним ресурсом. Удалитель ресурсов при наличии доступа навсегда удаляет выбранные ресурсы с лимитом безопасности 10 000 объектов и возможностью доступа только администраторам.
space-mode-title=ВСЁ НА НАУВИСЕ
space-mode-body=При включении со Space Age все четыре обнаружения планет завершаются, а планетарный прогресс объединяется в одной пещере: север/верх — Аквило, юг/низ — Глеба, восток/право — Фульгора, запад/лево — Вулкан. Космическая наука исследуется с тремя планетарными и химическими пакетами и производится на поверхности пещеры. При отключении официальные исследования, космическая наука, планеты и обычные межпланетные путешествия остаются без изменений.
space-mode-advancing-body=Наступающий обвал заменяет обычную радиальную схему планет. Все игровые зоны находятся впереди на севере / вверху; путь на юг / вниз навсегда закрыт. Поскольку все четыре обнаружения планет завершены в начале игры, каждое семейство зон Space Age доступно для будущих ещё не назначенных северных зон. Между соседними планетарными зонами всегда находится одна или две восстановительные зоны Наувиса.
space-vulcanus-title=РЕГИОН ВУЛКАНА — ЗАПАД / ЛЕВО
space-vulcanus-advancing-title=СЕМЕЙСТВО ЗОН ВУЛКАНА — НА СЕВЕР
space-vulcanus-body=Вулканические пещеры дают лаву, кальцит, вольфрам, уголь, сернокислотные гейзеры, вулканические камни и комнаты прогресса. Ресурсы прямо под движущимся Разрушителем сохраняются. Подходящие входы в урановые, железные, медные и угольные пещеры могут открываться отдельно в безопасных боковых камерах, а обычные, вражеские, сокровищные и прогрессионные комнаты при проходе Разрушителя подавляются. Локальная закрытая граница не позволяет сегментам находящегося рядом Разрушителя исчезать на территории вне карты. Составы Интерьеров поездов и неприсоединённые части поезда игнорируют только урон Разрушителя; весь остальной урон действует как обычно.
space-gleba-title=РЕГИОН ГЛЕБЫ — ЮГ / НИЗ
space-gleba-advancing-title=СЕМЕЙСТВО ЗОН ГЛЕБЫ — НА СЕВЕР
space-gleba-body=Органические пещеры содержат строматолиты, юмако, желеягоды, болота, воду, плоты с яйцами и пентаподов. Региональные комнаты поддерживают биологическую производственную цепочку Глебы.
space-fulgora-title=РЕГИОН ФУЛЬГОРЫ — ВОСТОК / ПРАВО
space-fulgora-advancing-title=СЕМЕЙСТВО ЗОН ФУЛЬГОРЫ — НА СЕВЕР
space-fulgora-body=Пещеры Фульгоры содержат лом, нефтяной океан, руины, руины хранилищ, фульгорит и активные молнии. Защита от молний и электромагнитный прогресс остаются важными на общей пещерной поверхности.
space-aquilo-title=РЕГИОН АКВИЛО — СЕВЕР / ВЕРХ
space-aquilo-advancing-title=СЕМЕЙСТВО ЗОН АКВИЛО — НА СЕВЕР
space-aquilo-body=Ледяные пещеры дают нефть, литиевый рассол, фторные источники, айсберги и аммиачный океан. Комнаты прогресса дают ресурсы для криогенного развития без скриптового замораживания машин.
mission-uranium-title=УРАНОВЫЕ ПЕЩЕРЫ УТИЛИЗАЦИИ
mission-uranium-body=Начиная со средней глубины подходящие комнаты могут открыть экспедицию вниз. Обычно пещера доступна 30 минут, а тонкие жилы содержат примерно 50% урана и 50% лома The Cave. С активным Bob's Ores новые экспедиции длятся 60 минут и открывают широкие залежи с запасом на клетку в 10 раз больше, включая торий, если он включён. Лом доступен с начала игры без исследований и кислоты. Уран по-прежнему требует исследования добычи урана и серной кислоты; правила добычи тория Bob's не меняются. Начатые экспедиции сохраняют прежний срок. Фиксированного предела расстояния или ресурсов нет.
mission-mineral-title=ЖЕЛЕЗНЫЕ, МЕДНЫЕ И УГОЛЬНЫЕ ПЕЩЕРЫ
mission-mineral-body=Начиная со средней глубины 20% подходящих обычных пустых комнат во всех регионах основной поверхности могут стать одноресурсной минеральной пещерой, не заменяя броски урановых и особых комнат. После пяти открытых пустых комнат гарантировано следующее место, разрешённое хотя бы для одного включённого ресурса. Железо, медь и уголь включаются независимо; включённые типы сохраняют относительные веса детерминированного цикла: 5 железа / 3 меди / 2 угля. Правило 192 клеток действует только для одинакового ресурса, поэтому разные минеральные типы и уран могут находиться рядом. Входы можно находить заранее, но у каждой команды одновременно работает только одна экспедиция в железную, медную или угольную пещеру; первый вход запускает её 30-минутный таймер. Сухая полностью тёмная пещера создаёт не более десяти больших комнат, а вручную прорытые тоннели и чрезвычайно богатые жилы не имеют предела расстояния.
mission-vault-title=РЕЙДЫ В УКРЕПЛЁННЫЕ ХРАНИЛИЩА
mission-vault-body=УКРЕПЛЁННЫЕ КОМНАТЫ\n18 одинаковых комнат размером 250 x 35 клеток.\nЛЕГКО 1–6: зелёный пол, 8 синих тайников, 300 смешанных лёгких врагов, 10 лёгких червей и 6 пулемётных турелей в каждой комнате — 10 минут.\nСРЕДНЕ 7–12: жёлтый пол, 6 жёлтых тайников, 250 смешанных средних врагов, 10 средних червей, 4 пулемётные и 4 лазерные турели — 12 минут.\nСЛОЖНО 13–18: красный пол, 4 красных тайника, 200 больших и чудовищных врагов, 10 больших и чудовищных червей, по 4 пулемётные, лазерные и огнемётные турели — 15 минут.\nКусаки, плеваки, арахниды и бронированные кусаки распределены поровну с округлением. В каждой комнате 12 гнёзд: 4 арахнидов, 4 бронированных кусак, 2 кусак и 2 плевак. Интервалы появления: 2,5 / 4,25 / 6 секунд с обычными ограничениями населения и места. Порождённые гнёздами враги добавляются к начальным.\nДальше от входа опасность растёт. Между гнёздами не менее 20 клеток, между турелями — 15. Огонь вражеских огнемётных турелей не вредит их союзникам; огонь игрока по-прежнему поражает врагов.\nКаждый дополнительный игрок одновременно внутри увеличивает начальное число подвижных врагов на 50%. Число гнёзд, червей и турелей неизменно. Выход игроков не уменьшает достигнутое усиление.\nУничтожьте всех врагов, гнёзда, червей и турели: следующая комната построится и получит новый таймер. Награды в дальнем конце можно забрать позже. Тайники неуязвимы и не вызывают тревогу. Зачищенные комнаты остаются безопасными.\nСиний проход 35 x 595 клеток открыт сразу и недоступен вражеским существам. Между рядами — 35 клеток пустоты. Комнаты открываются по порядку.\nВнутри только ДВА портала: вход/выход наверху и ТОЛЬКО ВЫХОД внизу синего прохода. Оба доступны сразу. Повторный вход всегда ведёт наверх.\nОбщий таймер идёт и снаружи; остаток времени не переносится. После зачистки комнаты 18 оставшееся время продолжает отсчитываться. Выйдите до 00:00: оставшиеся внутри погибнут, пещера закроется навсегда, все оставленные вещи будут потеряны.
mission-special-title=СИСТЕМЫ ОСОБЫХ ЗАЛОВ
mission-special-body=Глубина, регион и настройки могут создавать охраняемые ресурсные комнаты, залы прогресса, вражеские области, сокровищницы и входы в миссии. Результат основан на стабильных данных карты и одинаков для всех участников сети.
combat-enemies-title=ВРАГИ И ЗАСАДЫ
combat-enemies-body=Прямое копание может вызвать контролируемую засаду с перерывом и лимитом ближайших врагов. Типы врагов, население комнат и волны тьмы зависят от эволюции, общей сложности и глубины, включая встроенных бронированных кусак.
combat-blood-title=РУДА — ЭТО КРОВЬ
combat-blood-body=Дополнительный режим превращает отдельные боевые награды в ресурсы и монеты, включая награды за уровни бронированных врагов. Он создаёт агрессивную альтернативную экономику, не заменяя обычное производство.
combat-rockets-title=ХИМИЧЕСКИЕ И ЗАЖИГАТЕЛЬНЫЕ РАКЕТЫ
combat-rockets-body=Химические ракеты объединяют яд и замедление, а зажигательные создают большую горящую область. Они расширяют поздние боевые возможности без отдельного внешнего мода.
combat-market-title=МОНЕТЫ И РЫНОК
combat-market-body=Бои и исследования могут приносить монеты для систем рынка The Cave. Переносные аварийные источники энергии и особые награды помогают восстановлению, не заменяя обычное дерево технологий.
train-interior-title=ПЕРЕНОСНЫЕ ИНТЕРЬЕРЫ ПОЕЗДОВ
train-interior-body=Поддерживаемые локомотивы и вагоны могут содержать постоянные личные фабричные поверхности, путешествующие вместе с составом. Входите в ближайшую часть через Ctrl+Enter или кнопку; обычный Enter на локомотиве сохраняет управление.
train-expansion-title=РОСТ ПОЕЗДА И ЕГО ЧАСТИ
train-expansion-body=Главный поезд начинается с трёх зарегистрированных частей и расширяется до десяти. Интерьеры начинают с размера 40×40, а шесть исследований расширяют их до 60×60, 80×80, 92×100, 92×160, 92×220 и 92×280. Высота центрального перехода соответствует высоте комнаты на каждом уровне: 40, 60, 80, 100, 160, 220 и 280 клеток; с каждой стороны сохраняется по десять синих служебных рядов. Центры комнат вагонов зарезервированы с шагом 96 клеток; максимальная ширина комнаты 92 клетки оставляет четырёхклеточный переход между соседними комнатами. В новых чанках пещеры Наувиса гарантированно появляется следующая заброшенная часть поезда, когда расстояние до всех предыдущих находок составляет не менее 200 клеток; ограничений по уровню глубины и общему числу находок нет. Найденную часть можно присоединить к экспедиции только при наличии свободного места в Главном поезде.
train-power-title=БАТАРЕЯ И ЩИТ
train-power-body=Двадцать уровней батареи дают 2 000–250 000 МДж ёмкости и скорость зарядки 50–1 000 МВт. Десять уровней щита повышают защиту с 5 000 до 35 000 и восстановление до 50 здоровья в секунду.
train-garden-title=САД, КАРТА И СОВМЕСТНАЯ ИГРА
train-garden-body=Системы поезда включают сад, камеру/карту, общий доступ и сетевое голосование. Внутренние поверхности защищены от Нашествия из тьмы и используют стабильное полное освещение.
cavetorio-core-title=ЭКСПЕДИЦИЯ CAVETORIO
cavetorio-core-body=CAVETORIO превращает The Cave в повторяющуюся экспедицию Варп-аванпоста. Главный поезд — ядро миссии, а при варпе в следующую новую пещеру переходит только аванпост и всё внутри него.
cavetorio-outpost-title=РАЗВИТИЕ АВАНПОСТА
cavetorio-outpost-body=Исследования расширяют защищённый аванпост от 25×25 до 200×200, увеличивают время пещеры с 30 до 160 минут и кольцо безопасности с 10 до 80 клеток. Ручной варп позволяет уйти раньше и требует большинства голосов в сети.
cavetorio-waves-title=ВОЛНЫ И ПРАВИЛА ПОТЕРИ
cavetorio-waves-body=Волны усиливаются с варпами: боссы каждые десять волн, отдых каждые пятьдесят и кошмарное давление с варпа 60. Всё снаружи аванпоста бросается; игроки снаружи теряют переносимое снаряжение экспедиции.
research-character-title=РАЗВИТИЕ ПЕРСОНАЖА
research-character-body=35 технологий скорости копания ускоряют ручную добычу. 10 уровней дальности дают суммарно +20 к пяти дистанциям, а ручной подбор предметов клавишей F сохраняет стандартную дальность. 10 уровней пояса добавляют 100 ячеек; исследования также улучшают бег и создание предметов.
research-logistics-title=РАЗВИТИЕ ЛОГИСТИКИ
research-logistics-body=18 уровней вместимости лент повышают поддерживаемый стак до 20. Семь уровней подземных лент добавляют девять клеток, семь уровней подземных труб достигают 45 клеток, а десять уровней подпорок увеличивают поддержку потолка стенами и реакторами с 4 до 14 клеток при активных обвалах.
research-combat-title=БОЙ И ЭКИПИРОВКА
research-combat-body=10 уровней дальности турелей добавляют +15 к поддерживаемым неартиллерийским турелям. Три улучшения сетки дают +2, +4 и +6 к размерам поддерживаемой брони, танков и паукотронов, сохраняя предметы, чертежи и качество.
research-inserter-title=НАСТРОЙКА МАНИПУЛЯТОРОВ
research-inserter-body=Четыре уровня открывают дальние, диагональные и смещённые точки захвата/выгрузки и точное смещение выгрузки. Интерфейс и клавиши сохраняют существующие манипуляторы и требуют соответствующих исследований.
machines-heat-title=ПЕЧИ, БОЙЛЕР И ПЕРЕГРЕВ
machines-heat-body=Дополнительные электрические каменные/стальные печи, продвинутые электропечи и электрический бойлер расширяют производство. Перегрев добавляет настраиваемые улучшения теплоты топлива без внешних модов.
machines-storage-title=СИСТЕМЫ ХРАНЕНИЯ
machines-storage-body=Четыре дополнительных резервуара имеют фиксированные ёмкости 2 000, 8 000, 40 000 и 70 000. 28 промышленных контейнеров представлены в размерах 1×1, 2×2, 4×4 и 6×6, с отдельными исследованиями и настраиваемой вместимостью.
machines-logistics-title=ПОГРУЗЧИКИ И ИНДИКАТОРЫ
machines-logistics-body=Промышленные погрузчики поддерживают компактную высокоскоростную логистику. Индикаторы состояния показывают работу машин, а варианты фильтрующих буров и инструменты выделения помогают со смешанными ресурсами.
machines-early-title=РАННИЕ ПЕЩЕРНЫЕ МАШИНЫ
machines-early-body=The Cave включает дальнюю железную опору, фонарный столб и стартовые системы. Они дают ранние пути энергии, света и строительства.
quality-start-title=БЫСТРЫЙ СТАРТ И НАБОР
quality-start-body=Дополнительные стартовые системы могут выдавать заданные ранние предметы. Быстрый старт даёт компактную модульную броню, реактор 250 кВт, робопорт, аккумуляторы, ускоренный экзоскелет и строительных роботов без ночного видения.
quality-teleport-title=ВСТРОЕННЫЙ ТЕЛЕПОРТ ПО ТОЧКАМ
quality-teleport-body=Откройте Телепорт с панели быстрого доступа Factorio или нажмите Ctrl+T. Для использования окна по-прежнему требуется исследование Телепорт I. Три общих для команды уровня открывают 2, 3 и 4 личные ячейки назначения, не удаляя сохранённые точки. Сохранение стоит 200 электронных схем; каждый Телепорт или возврат стоит 10 улучшенных схем и запускает общую двухминутную перезарядку.
quality-feedback-title=УРОН, РЕМОНТ И ОЧИСТКА
quality-feedback-body=Индикатор урона даёт персональную визуальную обратную связь. Автоматический ремонт инвентаря, радиус/время исчезновения трупов и индикаторы производства уменьшают повторяющееся обслуживание и остаются настраиваемыми.
quality-tools-title=ИНСТРУМЕНТЫ СТРОИТЕЛЬСТВА И ДВИЖЕНИЯ
quality-tools-body=Совместимость Squeak Through, инструменты ресурсов, настраиваемые сундуки и стаки, резервуары, погрузчики и безопасные для чертежей улучшения поддерживают большие подземные фабрики.
quality-multiplayer-title=СЕТЕВАЯ ИГРА И КОМАНДЫ
quality-multiplayer-body=Multi-Team Support может дать каждой команде отдельную силу и поверхность пещеры. Защита тела офлайн-игрока, командный прогресс, детерминированные находки и общее владение миссиями сохраняют стабильность и отображаются в таблице Пещер.
settings-title=ТЕКУЩИЕ НАСТРОЙКИ
settings-read-only=Здесь перечислены значения, загруженные Factorio. Страница доступна только для чтения. Стартовые параметры требуют изменения настроек мода и перезапуска; общие действуют на сервер, персональные — только на вас.
settings-startup=СТАРТОВЫЕ НАСТРОЙКИ (__1__)
settings-map=НАСТРОЙКИ КАРТЫ (__1__)
settings-player=ПЕРСОНАЛЬНЫЕ НАСТРОЙКИ (__1__)
controls-title=УПРАВЛЕНИЕ
controls-intro=Основные действия The Cave. Клавиши можно изменить в Настройки > Управление. Функции с отключённой стартовой настройкой не реагируют.
control-train-title=Войти внутрь поезда
control-train-body=Войти или выйти из интерьера ближайшего локомотива или вагона. Кнопка на панели быстрого доступа выполняет то же действие.
control-teleporter-title=Открыть телепорт
control-teleporter-body=Открывает или закрывает существующее окно точек телепортации. Кнопка на панели быстрого доступа выполняет то же действие.
control-automatic=АВТОМАТИЧЕСКИ
control-garden-title=Портал локомотивного сада
control-garden-body=Встаньте на портал 2x2 для автоматического перехода. Вы появитесь в центре отдельной серой посадочной площадки на другом этаже; клавиша не требуется.
control-corpses-title=Очистить ближайшие трупы
control-corpses-body=Удаляет временные трупы врагов вокруг персонажа в пределах настроенного радиуса. Кнопка на панели быстрого доступа выполняет то же действие.
control-drills-title=Фильтр буров
control-drills-body=Возьмите инструмент, выделите буры и выберите единственный ресурс, который они должны добывать.
control-eraser-title=Удалитель ресурсов
control-eraser-body=Навсегда удаляет выбранные ресурсы, если сервер разрешает доступ. Используйте осторожно: отменить действие невозможно.
control-inserter-rotate-title=Поворот захвата / перезарядка турелей
control-inserter-rotate-body=Ctrl+R поворачивает захват выбранного настраиваемого манипулятора; иначе перезаряжает дружественные пулемётные турели в области 20x20. Кнопка на панели быстрого доступа всегда запускает перезарядку турелей напрямую. Ctrl+Shift+R поворачивает захват против часовой стрелки.
control-inserter-distance-title=Дальность манипулятора
control-inserter-distance-body=F меняет дальность выгрузки, Ctrl+F — дальность захвата. Дополнительные неназначенные клавиши смещения доступны в настройках управления.
caves-title=ПЕЩЕРЫ — __1__ пещер — __2__ игроков онлайн
caves-description=Общая статистика учитывает всех участников каждой пещеры или команды Multi-Team Support. Счёт объединяет Силу, Технологии, Промышленность и стабильный прогресс глубины. Игроки онлайн ранжируются отдельно по монетам в основном инвентаре, от большего к меньшему.
team-statistics-title=СТАТИСТИКА КОМАНД
coin-leaderboard-title=ИГРОКИ ОНЛАЙН — РЕЙТИНГ ПО МОНЕТАМ
