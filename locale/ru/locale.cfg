damage-indicators-override=Открыть окно с закодированной строкой текущих пользовательских настроек индикатора урона. Администраторы могут вставить её в стартовую настройку «Строка серверных настроек», чтобы установить одинаковое отображение индикаторов для всех игроков.

[gui-damage-indicator]
settings-string-title=Серверные настройки индикатора урона
settings-string-help=Скопируйте эту строку в [font=default-bold][color=#FFE6C0]Стартовые[/color][/font] → [font=default-bold]Строка серверных настроек[/font] в настройках модов главного меню, чтобы переопределить пользовательские настройки индикатора урона в игре. Строка использует ваши текущие настройки индикатора. Если вы измените их, повторно выполните команду [color=#FFE6C0]/damage-indicators-override[/color], чтобы обновить строку.
settings-string-close=Закрыть

[damage-indicator-message]
server-override-active=[font=default-dialog-button][[color=#FFE6C0]Индикатор урона[/color]][/font] Пользовательские настройки отображения, кроме «Показывать индикаторы урона», будут переопределены сервером.
server-override-decode-failed=[color=red]Строка серверных настроек недействительна[/color]: значение в поле «Строка серверных настроек» не является допустимой закодированной строкой настроек. Очистите его, создайте новую строку командой [color=#FFE6C0]/damage-indicators-override[/color] и вставьте точный результат в стартовую настройку.\n\n[font=default-bold]Это проблема стартовых настроек. Проверьте настройки модов в главном меню.[/font]\n
server-override-json-failed=[color=red]Строка серверных настроек повреждена[/color]: декодирование прошло успешно, но содержимое не является допустимым JSON. Вероятно, строка была обрезана или частично перезаписана — создайте новую командой [color=#FFE6C0]/damage-indicators-override[/color].\n\n[font=default-bold]Это проблема стартовых настроек. Проверьте настройки модов в главном меню.[/font]\n
server-override-shape-failed=[color=red]Строка серверных настроек имеет неверный формат[/color]: декодированные данные не соответствуют ожидаемой структуре настроек. Обычно это означает, что была вставлена схема или другая посторонняя закодированная строка. Создайте новую командой [color=#FFE6C0]/damage-indicators-override[/color].\n\n[font=default-bold]Это проблема стартовых настроек. Проверьте настройки модов в главном меню.[/font]\n
setting-overridden=[font=default-dialog-button][[color=#FFE6C0]Индикатор урона[/color]][/font] Изменения параметра «__1__» будут переопределены сервером.

