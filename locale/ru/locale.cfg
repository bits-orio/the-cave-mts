[shortcut-description]
the-cave-enter-train-interior-shortcut=Войти внутрь ближайшего локомотива или вагона. Обычная клавиша Enter на локомотиве по-прежнему используется для управления.
the-cave-filter-mining-drills-shortcut=Получить инструмент выделения для фильтрации буров по ресурсу.
the-cave-resource-eraser-shortcut=Получить инструмент выделения, который навсегда удаляет ресурсы в выбранной области.
the-cave-reload-gun-turrets-shortcut=Перезарядить дружественные пулемётные турели в области 20x20 вокруг вас совместимыми магазинами из инвентаря.
the-cave-clean-corpses-shortcut=Удалить ближайшие временные трупы врагов в пределах настроенного радиуса очистки.

