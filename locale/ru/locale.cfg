[the-cave-advancing-collapse]
area-preparation=БЕЗОПАСНАЯ ЗОНА ПОДГОТОВКИ — __1__ | Выведите поезд на СЕВЕР за эту границу до конца отсчёта.
area-recovery=БЕЗОПАСНО — ПЕРЕРЫВ __1__ | Южнее границы враги не появляются. Обвал остановлен.
area-combat=ОПАСНО — ВРАГИ ПОЯВЛЯЮТСЯ ЮЖНЕЕ ЭТОЙ ГРАНИЦЫ | Двигайтесь на СЕВЕР!
start-panel=ЗОНА ПОДГОТОВКИ\nСоберите ресурсы, постройте электростанцию и подготовьте поезд и рельсы.\nДо конца двухчасового отсчёта выведите поезд на СЕВЕР за зелёную границу.\nВо время боя граница становится красной. Южнее неё враги появляются в зоне на всю ширину карты и глубиной пять чанков; обвал движется на север.\nВо время перерыва граница становится зелёной, обвал останавливается, а враги внутри зоны удаляются.
queen-name=Королева наступающего обвала
queen-arrived=Наступающий обвал: королева-строитель (50 000 здоровья) появилась в __1__. Построено гнёзд: __2__. Она не атакует; каждые 30 секунд проверяет открытые места для гнёзд, соблюдая общий лимит 30 и задержку восстановления в две минуты.
queen-test-help=Тест администратора: /the-cave-advancing-queen-test — создать королеву в активной зоне наступающего обвала своей команды или найти живую королеву. Не изменяет волны и обратный отсчёт.
queen-test-inactive=Для теста королевы включите наступающий обвал и дождитесь окончания двухчасового отсчёта.
queen-test-surface=Запустите тест на основной поверхности наступающего обвала своей команды или внутри её поезда.
queen-test-preparing=Открытая зона ещё подготавливается. Подождите несколько секунд и повторите команду.
queen-test-existing=Живая королева наступающего обвала уже находится в __1__. Дополнительная тестовая королева не создана.
queen-test-cap=Достигнут общий лимит 1000 врагов. Освободите одно место и повторите команду.
queen-test-blocked=В прямоугольнике появления врагов нет безопасного места для королевы. Отойдите от зоны или освободите проход и повторите команду.
queen-test-unavailable=Прототип королевы наступающего обвала недоступен.
