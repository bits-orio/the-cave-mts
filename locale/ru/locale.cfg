[technology-description]
the-cave-storage-tank-1x1-technology=Открывает компактный резервуар 1×1. Не открывает переработку нефти.
the-cave-storage-tank-2x2-technology=Открывает резервуар 2×2 с тремя соединениями для труб. Не открывает переработку нефти.
the-cave-storage-tank-3x4-technology=Открывает улучшенный резервуар 3×4 с фиксированной вместимостью 40 000 единиц жидкости.
the-cave-storage-tank-5x5-technology=Открывает большой резервуар 5×5 с фиксированной вместимостью 70 000 единиц жидкости.
the-cave-wind-turbine-1=Открывает ветряную турбину после обработки стали. Каждая турбина этой команды производит 1 МВт.
the-cave-wind-turbine-2=Автоматически повышает мощность всех существующих и будущих ветряных турбин этой команды до 1,5 МВт.
the-cave-wind-turbine-3=Автоматически повышает мощность всех существующих и будущих ветряных турбин этой команды до окончательного максимума 2 МВт.
the-cave-underground-pipe-reach=Увеличивает дальность подземной трубы на +__1__ клеток на этом уровне. Общий бонус: +__2__ клеток. Текущая максимальная дальность: __3__ клеток.
the-cave-underground-pipe-reach-1=Увеличивает дальность подземной трубы на +5 клеток. Общий бонус: +5 клеток. Максимальная дальность: 15 клеток.
the-cave-underground-pipe-reach-2=Увеличивает дальность подземной трубы на +5 клеток. Общий бонус: +10 клеток. Максимальная дальность: 20 клеток.
the-cave-underground-pipe-reach-3=Увеличивает дальность подземной трубы на +5 клеток. Общий бонус: +15 клеток. Максимальная дальность: 25 клеток.
the-cave-underground-pipe-reach-4=Увеличивает дальность подземной трубы на +5 клеток. Общий бонус: +20 клеток. Максимальная дальность: 30 клеток.
the-cave-underground-pipe-reach-5=Увеличивает дальность подземной трубы на +5 клеток. Общий бонус: +25 клеток. Максимальная дальность: 35 клеток.
the-cave-underground-pipe-reach-6=Увеличивает дальность подземной трубы на +5 клеток. Общий бонус: +30 клеток. Максимальная дальность: 40 клеток.
the-cave-underground-pipe-reach-7=Увеличивает дальность подземной трубы на +5 клеток. Общий бонус: +35 клеток. Максимальная дальность: 45 клеток.
the-cave-underground-belt-reach=Увеличивает максимальную дальность размещения всех официальных подземных конвейеров на +__1__ клетку(и) на этом уровне. Общий бонус к дальности: +__2__ клеток.
the-cave-transport-belt-capacity=Увеличивает максимальную вместимость стопок конвейеров и погрузчиков до __1__ предметов. Начиная с уровня 2 твердотопливный, обычный, длинный и быстрый манипуляторы растут пошагово; начиная с уровня 15 массовый и пакетный манипуляторы также получают +1 на каждом уровне.
the-cave-transport-belt-capacity-final=Увеличивает максимальную вместимость стопок конвейеров и погрузчиков до __1__ предметов и повышает вместимость руки твердотопливного, обычного, длинного, быстрого, массового и пакетного манипуляторов до 20 предметов.
the-cave-belt-compression-1=Позволяет конвейерам переносить небольшие уплотнённые стопки предметов, когда Space Age не активен.
the-cave-belt-compression-2=Улучшает уплотнение конвейеров пещеры для более тяжёлой подземной логистики.
the-cave-belt-compression-3=Дополнительно увеличивает вместимость стопок на конвейерах для пещерных маршрутов добычи.
the-cave-belt-compression-4=Высоковместительное уплотнение конвейеров для крупных ресурсных пещер.
the-cave-belt-compression-5=Продвинутое уплотнение конвейеров для поздней подземной логистики.
the-cave-belt-compression-6=Максимальное уплотнение пещерных конвейеров в стиле RedMew.
diggy-dig-speed-exact=Ваши шахтёры учатся быстрее убирать породу: +__1__% к скорости ручной добычи для всей команды. Всего с предыдущими уровнями: +__2__%.
diggy-support-reach-exact=Улучшенные подпорки и укрепления: ВСЕ ваши стены и реакторы сразу после завершения исследования поддерживают потолок на __2__ клеток вокруг вместо __1__. Колонны можно размещать на одну клетку дальше друг от друга.
the-cave-equipment-grid-upgrade=Расширяет сетку снаряжения Модульной брони, Силовой брони, Силовой брони MK2, Танка и Паукотрона на +__1__ по ширине и +__2__ по высоте.
the-cave-underground-belt-reach-1=Увеличивает максимальную дальность размещения всех официальных подземных конвейеров на +2 клетки. Общий бонус к дальности подземных конвейеров: +2 клетки.
the-cave-underground-belt-reach-2=Увеличивает максимальную дальность размещения всех официальных подземных конвейеров на +2 клетки. Общий бонус к дальности подземных конвейеров: +4 клетки.
the-cave-underground-belt-reach-3=Увеличивает максимальную дальность размещения всех официальных подземных конвейеров на +1 клетку. Общий бонус к дальности подземных конвейеров: +5 клеток.
the-cave-underground-belt-reach-4=Увеличивает максимальную дальность размещения всех официальных подземных конвейеров на +1 клетку. Общий бонус к дальности подземных конвейеров: +6 клеток.
the-cave-underground-belt-reach-5=Увеличивает максимальную дальность размещения всех официальных подземных конвейеров на +1 клетку. Общий бонус к дальности подземных конвейеров: +7 клеток.
the-cave-underground-belt-reach-6=Увеличивает максимальную дальность размещения всех официальных подземных конвейеров на +1 клетку. Общий бонус к дальности подземных конвейеров: +8 клеток.
the-cave-underground-belt-reach-7=Увеличивает максимальную дальность размещения всех официальных подземных конвейеров на +1 клетку. Общий бонус к дальности подземных конвейеров: +9 клеток.
the-cave-stack-inserter=Открывает пакетный манипулятор и увеличивает вместимость стопок конвейера до 2. Работает в обычном Factorio у владельцев Space Age, даже когда мод Space Age отключён.

lamp-post=Открывает мощный фонарь для освещения очень большой площади.
advanced-material-processing-3=Открывает второй уровень электрической печи.
advanced-material-processing-4=Открывает третий уровень электрической печи.

