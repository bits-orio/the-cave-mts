rooms-left=[Fortified] Вы вышли. Таймер продолжает идти. Повторный вход ведёт к верхнему порталу.
panel-text=УКРЕПЛЁННОЕ ПОДЗЕМНОЕ ХРАНИЛИЩЕ\n\nВХОД: Уничтожьте всех защитников верхней комнаты, затем нажмите на центральный вход.\nЭНЕРГИЯ: Подключите электричество к закреплённой большой опоре наверху. Она питает лампу у входа внизу.\nВРЕМЯ: Первый успешный вход запускает общий таймер на 30 минут.\nТАЙНИКИ: Личных и общих ограничений на число открытий нет. Открывайте столько, сколько успеете до конца таймера; сбалансированные бюджеты наград продолжают действовать.\nВЗЛОМ: Начните в радиусе 8 клеток и оставайтесь в этом радиусе, пока тайник открывается. Уход дальше или смена поверхности отменяет попытку. Успешная добыча сразу переносится в инвентарь.\nВНИМАНИЕ: Тревога тайника вызывает защитников. За пределами освещённой зоны входа царит полная темнота.\nПОБЕГ: Нажмите на выход внизу до окончания таймера. Оставшиеся игроки погибнут, а их предметы навсегда останутся внутри.
