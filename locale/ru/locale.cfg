mode-info-normal=[font=default-semibold]КЛАССИЧЕСКАЯ СТАЦИОНАРНАЯ ПЕЩЕРА[/font]\n\n• Вручную добывайте сплошную породу, прокладывайте постоянные туннели и находите ресурсы, пещерные комнаты, врагов, сокровища и включённые особые локации.\n• Стройте одну постоянную фабрику вокруг обычной точки появления стороны; обязательной движущейся базы, защищаемого ядра, таймера варпа или наступающего удаления карты нет.\n• Интерьеры поездов, Оборона убежища, CAVETORIO, Обвалы пещеры и Наступающий обвал отключены.\n• Выбранные ниже модификаторы и функции по-прежнему управляют ресурсами, сложностью, освещением, исследованиями, врагами и дополнительными системами.\n\n[font=default-bold]Рекомендуется:[/font] для стандартного свободного прохождения The Cave и первого знакомства с модом.
mode-info-collapse=[font=default-semibold]КЛАССИЧЕСКАЯ ПЕЩЕРА СО СТРУКТУРНОЙ ОПАСНОСТЬЮ[/font]\n\n• Сохраняет обычную стационарную пещеру и правила исследования, но активные обвалы могут уничтожать незащищённые участки.\n• Только действительно запланированный обвал показывает точную опасную область 2×2 с рамкой и обратным отсчётом; предварительных треугольников напряжения нет.\n• Каждый игрок начинает с 2 000 каменных стен. Стены и поддерживаемые реакторы защищают потолок поблизости, но опоры автоматически не размещаются.\n• Исследования подпорок увеличивают радиус защиты с 4 до 14 клеток по мере роста фабрики.\n\n[font=default-bold]Рекомендуется:[/font] тем, кто хочет обычную The Cave с давлением на строительство и разрушительной опасностью среды.
mode-info-digging=[font=default-semibold]ДОБЫЧА ПОРОДЫ СТАНОВИТСЯ ОСНОВНОЙ ЭКОНОМИКОЙ[/font]\n\n• Обычные и смешанные месторождения отключены; настройка размера месторождений игнорируется.\n• Добыча сплошной породы даёт основные базовые ресурсы. Этот режим лобби запускает Копание I со стандартным множителем наград 1×.\n• Нефть не меняется, а крошечные стартовые залежи остаются возле точки появления только для защиты ранней прогрессии.\n• Обычное исследование пещеры, комнаты, враги и включённые функции продолжают работать.\n\n[font=default-bold]Рекомендуется:[/font] тем, кто хочет заменить расширение по рудным полям непрерывными ручными раскопками.
mode-info-train=[font=default-semibold]МОБИЛЬНАЯ ФАБРИКА ВНУТРИ ГЛАВНОГО ПОЕЗДА[/font]\n\n• Стартовый Главный поезд содержит постоянные интерьеры, которые путешествуют вместе с поддерживаемыми локомотивами и вагонами. Возрождение следует за текущим положением Главного поезда.\n• Встаньте возле поддерживаемой части состава и один раз нажмите [font=default-bold]Ctrl + Enter[/font] для входа или выхода. Обычный Enter на локомотиве по-прежнему используется для управления.\n• В комнате грузового вагона слева находится фиксированный [font=default-bold]промышленный склад экспорта[/font], а справа — [font=default-bold]промышленный склад импорта[/font]. В комнате вагона-цистерны ровно два закреплённых резервуара 5×5 в нижних углах: [font=default-bold]левый экспортирует[/font] жидкость обратно в настоящий вагон, а [font=default-bold]правый импортирует[/font] её из него. Подключайте обычные трубы или резервуары к нужной подписанной стороне.\n• Внутренняя сеть, подключённая к подстанции Главного локомотива, заряжает батарею поезда. Запасённая энергия питает внешние опоры только внутри отмеченной жёлтой зоны. Между отдельными комнатами вагонов энергия автоматически не передаётся.\n• Встаньте на портал 2×2 в Главном локомотиве или Саду локомотива для автоматического перехода; прибытие происходит на отдельную серую площадку. Фиксированные промышленные складские ящики создают односторонние маршруты «ВХОД В САД» и «ВЫХОД ИЗ САДА», а парные подземные трубы передают жидкости.\n• Исследования расширяют внутреннюю фабрику, батарею и вместимость частей Главного поезда. Найденные заброшенные части можно присоединять, пока есть свободная вместимость.\n• Оборона поезда волнами атакует Главный поезд после выбранного периода подготовки; защищайте постоянный Главный локомотив и снабжайте состав.\n\n[font=default-bold]Рекомендуется:[/font] тем, кто хочет исследование, логистику и оборону вокруг движущейся подземной базы.
mode-info-shelter=[font=default-semibold]ЗАЩИЩАЙТЕ ОДНО ПОСТОЯННОЕ ПОДЗЕМНОЕ УБЕЖИЩЕ[/font]\n\n• Одно неподвижное Пещерное убежище с базовыми 5 000 ОЗ становится ядром миссии. После выбранного периода подготовки его атакуют волны врагов.\n• Встаньте в пределах 10 клеток, один раз нажмите [font=default-bold]Ctrl + Enter[/font] для входа или выхода. Внутри внешняя камера следует за закреплённым убежищем, а вся текущая комната видна на карте.\n• Фиксированные линии предметов и подписанные жидкостные порты связывают внешнюю и внутреннюю части. Внешний ввод жидкости питает оба внутренних порта INPUT, а оба внутренних OUTPUT возвращают жидкость к внешнему выходу.\n• Подключите внутреннюю сеть к фиксированной подстанции для зарядки 20-уровневой батареи убежища. Запасённую энергию можно вывести через отмеченную внешнюю область подключения.\n• Исследования щита повышают запас до 35 000 ОЗ и дают авторемонт 50 ОЗ/с, который начинается через 10 секунд после последнего попадания. Ручной ремонт и ремонт роботами остаются отключёнными.\n• Исследования расширяют основной этаж с 40×40 до 300×300 и добавляют отдельные технические полосы для труб, резервуаров, насосов и опор. Исследования расстояния туннелей отодвигают маршруты врагов.\n• Убежище нельзя перемещать или добывать. После его уничтожения начинается поэтапный мягкий перезапуск, и игроки возвращаются в Главное лобби.\n\n[font=default-bold]Рекомендуется:[/font] командам, которым нужна оборона фиксированной базы с защищённым внутренним производством.
mode-info-cavetorio=[font=default-semibold]ПОВТОРЯЮЩАЯСЯ ЭКСПЕДИЦИЯ ВАРП-АВАНПОСТА[/font]\n\n• CAVETORIO автоматически объединяет Интерьеры поездов со Всем на Наувисе и оставляет Оборону убежища отключённой.\n• Главный поезд — ядро миссии внутри защищённого Варп-аванпоста. Когда таймер заканчивается, в новую пещеру переносится только Аванпост и всё внутри него.\n• Постройки, транспорт и запасы снаружи бросаются. Игроки, оставшиеся снаружи, теряют переносимое снаряжение экспедиции и появляются в следующей пещере с пустым инвентарём.\n• Ручной варп позволяет уйти раньше; в сетевой игре требуется большинство голосов. Исследования расширяют Аванпост, увеличивают время в пещере и кольцо безопасности.\n• Давление врагов растёт с каждым варпом. Потеря последнего зарегистрированного локомотива Главного поезда запускает предупреждение о перезапуске экспедиции. Для интерьеров используется Ctrl + Enter, а портал Сада работает автоматически.\n\n[font=default-bold]Рекомендуется:[/font] опытным командам, которым нужны экспедиции по таймеру, контролируемая эвакуация и возрастающее долгосрочное выживание.
mode-info-advancing=[font=default-semibold]ДВИГАЙТЕСЬ НА СЕВЕР, ИНАЧЕ ВСЁ БУДЕТ УДАЛЕНО[/font]\n\n• Мир становится северной полосой шириной 510 клеток с зонами длиной 1024 клетки. Южный путь закрыт электрической линией и патрулирующей охраной.\n• Перед наступающим обвалом запускается видимый двухчасовой таймер игры с подключёнными игроками. После нуля поверхность, здания и транспорт навсегда удаляются с юга на север.\n• Перемещайте всю фабрику, транспортную сеть и запасы на север/вверх; всё оставленное позади будет потеряно. Небезопасное возрождение переносится минимум на 40 клеток вперёд от обвала.\n• Охрана атакует только пересёкших южную линию игроков, после отступления возвращается к патрулю и не входит в северную фабрику.\n• В Space Age будущие семейства планетарных зон открываются исследованиями обнаружения и разделяются одной или двумя восстановительными зонами Наувиса. Поезд или внешний транспортный мод не требуются.\n\n[font=default-bold]Рекомендуется:[/font] тем, кто хочет постоянное перемещение, строгие сроки и необратимую потерю карты. Уже созданные зоны сохраняют прежние размеры; новая схема начинается с первой полностью несозданной зоны.
