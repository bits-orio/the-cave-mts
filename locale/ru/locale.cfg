[mod-setting-description]
the-cave-extra-storage-tanks=Включает встроенные резервуары 1×1, 2×2, 3×4 и 5×5 с фиксированной вместимостью и отдельной цепочкой исследований.
the-cave-uranium-caves=По умолчанию: Включено. Начиная со средней глубины подходящие комнаты могут стать входом в 30-минутную урановую пещеру. Между естественными урановыми входами остаётся не менее 192 клеток, вес комнаты равен 12, а счётчик из восьми комнат гарантирует следующий подходящий вход вне этого радиуса. Входы могут ждать на карте, но у каждой команды одновременно работает только одна урановая экспедиция. Нижние пещеры содержат смесь урана и лома 50/50; лом не требует исследований или кислоты, а уран по-прежнему требует исследования добычи урана и серной кислоты. Требуется перезапуск и применение стартовой настройки. С активным Bob's Ores новые экспедиции длятся 60 минут и открывают широкие залежи с запасом на клетку в 10 раз больше, включая торий, если он включён. Начатые экспедиции сохраняют прежний срок.
the-cave-iron-cave=По умолчанию: Включено. Разрешает системе временных минеральных пещер выбирать железные пещеры. Отключение удаляет железо из новых детерминированных колод, не отключая медь или уголь; уже найденные железные пещеры остаются доступными. Включённые ресурсы сохраняют относительные веса исходной колоды: 5 железа / 3 меди / 2 угля. Требуется перезапуск и применение стартовой настройки.
the-cave-copper-cave=По умолчанию: Включено. Разрешает системе временных минеральных пещер выбирать медные пещеры. Отключение удаляет медь из новых детерминированных колод, не отключая железо или уголь; уже найденные медные пещеры остаются доступными. Включённые ресурсы сохраняют относительные веса исходной колоды: 5 железа / 3 меди / 2 угля. Требуется перезапуск и применение стартовой настройки.
the-cave-coal-cave=По умолчанию: Включено. Разрешает системе временных минеральных пещер выбирать угольные пещеры. Отключение удаляет уголь из новых детерминированных колод, не отключая железо или медь; уже найденные угольные пещеры остаются доступными. Включённые ресурсы сохраняют относительные веса исходной колоды: 5 железа / 3 меди / 2 угля. Требуется перезапуск и применение стартовой настройки.
the-cave-fortified-cave=По умолчанию: Включено. Разрешает новые входы в укреплённые пещеры при обычном исследовании и в режиме «Наступающий обвал». Отключение запрещает новые входы; уже найденные пещеры сохраняют доступ, содержимое и обычные таймеры. Требуется перезапуск.
the-cave-wind-turbine=По умолчанию: Включено. Включает предмет, рецепт и трёхэтапную цепочку исследований ветряной турбины. Отключение скрывает предмет, рецепт и исследования и устанавливает нулевую выработку существующих турбин, не удаляя их; повторное включение восстанавливает мощность по завершённым исследованиям команды. Требуется перезапуск и применение стартовой настройки.
the-cave-advancing-collapse=По умолчанию: Отключено. Только для новой игры. Закрывает юг электрической предупреждающей линией и патрулирующей охраной, затем запускает видимый двухчасовой таймер активной игры. После его окончания обвал навсегда удаляет пещеру шириной 510 клеток с юга на север, а каждые три минуты с доступной земли перед ним наступают односторонние волны врагов со скриптовыми гнёздами. Выжившие враги не задерживают следующие волны. Небезопасное возрождение переносится минимум на 40 клеток вперёд от обвала. Использует сетевую скорость и догоняющие правила MTN, не требует транспорта или других модов, открывает будущие семейства зон Space Age через исследования и разделяет их одной или двумя зонами Наувиса. Уже созданные зоны сохраняют прежние размеры; новая схема начинается с первой полностью несозданной зоны.
the-cave-chemical-rockets=Включает или отключает встроенные химические и зажигательные ракеты. Оба рецепта открываются технологией взрывных ракет.
the-cave-cavetorio=⚠️ !! ПРЕДУПРЕЖДЕНИЕ !!\nДля CAVETORIO должны быть включены следующие настройки:\n\nCAVETORIO\nИнтерьеры поездов\nВсё на Наувисе\n\nДля лучшей совместимости оставьте остальные параметры по умолчанию, если вам не требуется их изменить.\n\nЭтот режим добавляет таймер Cavetorio, интерфейс, кнопку Ручного варпа, новые поверхности пещер и правила переноса Варп-аванпоста.\n\nОтключите CAVETORIO, чтобы играть в обычный The Cave без системы варпа.
the-cave-ore-patch-missing=По умолчанию: ВЫКЛ. Дополнительный режим испытания. Один базовый тип руды удаляется из естественных месторождений на карте, но раскопка камней вместо этого даёт отсутствующий ресурс. Ресурс выбирается на основе зерна карты и не объявляется напрямую. Для чистого тестирования требуется новая карта.
the-cave-everything-on-nauvis=По умолчанию: ВКЛ. Сохраняет текущую прогрессию The Cave, при которой контент в стиле Space Age доступен в пещерных регионах Наувиса. Отключайте только для новых сохранений, если хотите обычные путешествия и прогрессию по планетам Space Age, пока The Cave остаётся на Наувисе.
the-cave-alien-biomes-support=По умолчанию: Включено. Если установлен Alien Biomes, новые созданные и открытые естественные полы пещеры Наувиса используют детерминированные органические регионы Alien Biomes. Существующая поверхность, покрытия игроков, регионы Space Age, урановые пещеры и интерьеры поездов не изменяются. Без Alien Biomes настройка не действует.
the-cave-underground-lighting-mode=По умолчанию: Вечная ночь. Выберите, как The Cave управляет подземным освещением. Обычный режим использует стандартный цикл дня и ночи. Вечный день сохраняет яркое освещение пещеры и полную мощность солнечных панелей. Вечная ночь сохраняет текущее ночное поведение пещеры с 50% мощности солнечных панелей. Кромешная тьма создаёт почти полную темноту с 25% мощности солнечных панелей, где важны лампы и фонари.
the-cave-collapse-mode=По умолчанию: Отключить. Включить активирует исходную быструю систему обвалов. Отключить полностью убирает обвалы, отсчёты, сигналы и эффекты и скрывает исследование подпорок. Предварительные треугольники напряжения не показываются; только действительно запланированный обвал отмечает точную область 2×2 квадратом с обратным отсчётом. При включении каждый игрок получает 2000 каменных стен, но опорные стены автоматически не размещаются. Требуется перезапуск и применение стартовой настройки.
diggy-carve-out-radius=Радиус заранее открытой безопасной зоны вокруг места появления. Требуется новая карта.
diggy-dig-biter-chance=Устаревшая настройка совместимости, сохранённая для существующих сохранений. Враги при прямой раскопке теперь используют детерминированные интервалы по сложности, и это значение игнорируется.
diggy-dig-nest-chance=Устаревшая настройка совместимости. Прямая раскопка больше не создаёт гнёзда или червей.
diggy-enemy-expansion=Использует интервал расширения The Cave, который линейно уменьшается с 10 минут при 0% эволюции до 2 минут при 100% эволюции, сохраняя стандартную дальность Factorio, оценку влияния, масштабирование группы переселенцев и настоящие миграции. На основной поверхности Пещеры уже открытый пол принимается даже тогда, когда окружающие клетки вне карты не проходят обычную проверку доли суши. Каждый интервал означает одну попытку, а не гарантированное гнездо. При выключении новые гнёзда появляются только при раскопке.
diggy-pack-size-multiplier=Устаревшая настройка совместимости, сохранённая для существующих сохранений. При прямой раскопке теперь появляется ровно один враг, и это значение игнорируется.
diggy-treasure-chance=Вероятность обнаружить при раскопке запечатанный сундук с добычей. Места фиксируются зерном карты, а содержимое улучшается с глубиной.
diggy-cavern-worm-multiplier=Устаревшая настройка совместимости. Защитники комнат теперь используют фиксированные безопасные лимиты.
diggy-crushed-remains=Устаревшая настройка совместимости, используемая только при включённых обвалах.
diggy-cavern-chance=Вероятность, что раскопка пробьёт пещерный туннель. Пещеры фиксируются зерном карты; в глубоких комнатах могут быть гнёзда, орды или входы в урановые пещеры.
diggy-collapse-enabled=Устаревший переключатель совместимости. Основное управление выполняет стартовый переключатель обвалов пещеры.
diggy-cavern-countdown=Устаревшее значение совместимости для отсчёта в охраняемых пещерах при активных обвалах.
diggy-wall-support=Устаревшее значение совместимости для поддержки стен при включённых обвалах.
diggy-strut-strength-max=Устаревшее значение совместимости для подпорок при включённых обвалах.
diggy-wall-crowding=Устаревшее значение совместимости для активного расчёта поддержки потолка.
the-cave-corpse-clean-radius=Радиус, в котором Backspace удаляет временные трупы.
the-cave-tree-stump-fade-time=Время до удаления пней. 0 = отключено. 54000 = 15 минут.
the-cave-enemy-corpse-fade-time=Время до удаления трупов кусак, плевак, червей, спавнеров и гнёзд. 0 = отключено. 54000 = 15 минут.
the-cave-building-remnant-fade-time=Время до удаления остатков разрушенных зданий. Трупы персонажей не затрагиваются. 0 = отключено.
the-cave-rail-remnant-fade-time=Время до удаления остатков рельсов. 0 = отключено.
damage-indicator-font-family=Базовый шрифт, используемый для создания пользовательского шрифта индикатора урона.
damage-indicator-font-size=Размер в пикселях для создания пользовательского шрифта индикатора урона.
damage-indicator-enabled=Если включено, рядом с повреждёнными объектами появляются числа урона.
damage-indicator-visibility=«Рядом» показывает весь ближайший урон. «Своя команда» показывает урон с участием вашей команды. «Исходящий» показывает только урон, нанесённый вашей командой другим командам.
damage-indicator-radius=Показывать индикаторы только в пределах указанного количества клеток от игрока.
damage-indicator-minimum-damage=Игнорировать новые индикаторы урона ниже этого значения. Уже существующие объединённые индикаторы продолжат учитывать последующие меньшие удары.
damage-indicator-scale=Множитель размера текста урона.
damage-indicator-lifetime=Базовая длительность анимации в тиках. Непрерывный урон поддерживает индикатор активным; после прекращения урона значение также влияет на длительность затухания.
damage-indicator-animation-speed=Множитель скорости анимации. Большие значения завершают её быстрее, меньшие оставляют индикатор дольше.
damage-indicator-combine-ticks=После получения объектом урона последующий урон в течение этого количества тиков объединяется в тот же индикатор вместо создания нового.
damage-indicator-text-update-interval=При объединении урона видимый текст обновляется не чаще одного раза за указанное количество тиков.
damage-indicator-max-active=Старые индикаторы удаляются при достижении этого количества активных индикаторов.
damage-indicator-group-similar-distance=Ближайшие повреждённые здания 1x1 с одинаковым внутренним именем получают один усреднённый индикатор урона в пределах указанного количества клеток. Установите 0, чтобы отключить группировку.
damage-indicator-whitelist-entity-types=Разделённый запятыми список типов объектов (например, «asteroid, turret, rail»), которые всегда можно группировать, даже если они больше 1x1. Оставьте пустым, чтобы полностью отключить белый список.
damage-indicator-whitelist-distance-bonus=Дополнительные клетки к дистанции группировки для типов объектов из белого списка. Позволяет таким объектам, как движущиеся астероиды, объединяться через большие промежутки, чем обычные здания.
damage-indicator-blacklist-entity-names=Разделённый запятыми список имён объектов, для которых никогда не показываются индикаторы урона (например, «small-biter, big-metallic-asteroid»). Поддерживаются подстановочные знаки в начале или конце: «*-asteroid» соответствует любому имени, заканчивающемуся на «-asteroid», а «pipe-*» — любому имени, начинающемуся с «pipe-». Оставьте пустым, чтобы отключить чёрный список; при пустом значении он не влияет на производительность.
damage-indicator-show-group-count=Показывает на групповых метках количество и локализованное имя объектов, например [7x Стена]. Отключите, чтобы видеть только текст урона.
damage-indicator-shadow-style=Определяет соотношение читаемости и производительности. Лёгкая тень использует три теневых текстовых объекта на индикатор, тяжёлая — пять, а выключенная оставляет только цветной текст.
damage-indicator-font=Прототип шрифта для отображаемого текста урона. Пользовательский вариант использует настройки семейства и размера пользовательского шрифта.
damage-indicator-compact-numbers=Если включено, большие значения урона используют обозначения k/m/b, например 1.0k, 10.0m и 1.00b. Если выключено, большие значения показываются полностью с выбранным разделителем чисел.
damage-indicator-number-separator=Разделитель полных чисел урона, когда сокращение чисел отключено.
damage-indicator-text-template=Текст, отображаемый для каждого индикатора. Используйте __damage__ в месте форматированного числа урона. Используйте __reduced__, чтобы вручную указать сниженный урон.
damage-indicator-show-reductions=Показывает урон, предотвращённый Stable Foundations: 50 (-50).
damage-indicator-drift-style=«От источника» перемещает числа от источника урона. «Вверх» сохраняет классический плавающий текст. «Смешанный» сочетает оба варианта.
damage-indicator-drift-distance=Расстояние в клетках, которое проходит индикатор за время существования.
damage-indicator-color-mode=«По типу урона» использует цвета, соответствующие типу источника. «Шкала урона» игнорирует тип и выбирает цвет по величине от светло-жёлтого до тёмно-красного.
damage-indicator-blend-damage-type-colors=Если включено, объединённые индикаторы используют взвешенную по урону смесь цветов всех типов урона вместо сохранения цвета первого удара. Применяется только в режиме цветов по типу урона.
damage-indicator-color-physical=RGB-цвет индикаторов физического урона.
damage-indicator-color-impact=RGB-цвет индикаторов ударного урона.
damage-indicator-color-explosion=RGB-цвет индикаторов урона от взрыва.
damage-indicator-color-fire=RGB-цвет индикаторов урона от огня.
damage-indicator-color-laser=RGB-цвет индикаторов лазерного урона.
damage-indicator-color-electric=RGB-цвет индикаторов электрического урона.
damage-indicator-color-acid=RGB-цвет индикаторов кислотного урона.
damage-indicator-color-poison=RGB-цвет индикаторов урона от яда.
damage-indicator-color-intensity=Если включено, малый урон выглядит немного светлее и менее насыщенно, а большой — глубже и насыщеннее, при сохранении цвета типа урона.
damage-indicator-color-intensity-cap=Урон на этом уровне или выше достигает максимальной интенсивности цвета или крайнего цвета шкалы.
damage-indicator-viewport-culling=Не создаёт индикаторы, которые находятся за пределами предполагаемого экрана всех подходящих игроков.
damage-indicator-viewport-margin=Дополнительные клетки вокруг предполагаемой области экрана, чтобы индикаторы у края не отсекались слишком рано.
damage-indicator-killing-blow=Добавляет маркер (по умолчанию !) к числу урона, нанесшего смертельный удар, и лёгкий импульс, чтобы последний удар выделялся.
damage-indicator-killing-blow-marker=Суффикс, добавляемый к числу урона при смертельном ударе. Оставьте пустым, чтобы отключить суффикс, сохранив импульс выделения.
damage-indicator-alt-mode=Показывать индикаторы урона только в режиме Alt.
damage-indicator-debug-info=Для отладки показывает внутреннее состояние индикатора урона.
damage-indicator-group-name-normalize=Группирует похожие варианты объектов, например врагов из Rampant. Укажите разделённые запятыми Lua-шаблоны, каждый с одной группой захвата `(...)`, извлекающей базовое имя из внутреннего имени уровня или версии.
damage-indicator-saturation-threshold=Количество индикаторов урона от одного типа объектов, после которого они объединяются в один индикатор.
damage-indicator-server-override-string=Переопределяет пользовательские настройки индикатора урона указанными стартовыми настройками. Полезно серверам для одинакового отображения у всех игроков. Создайте строку в игре командой [color=#FFE6C0]/damage-indicators-override[/color]. [font=default-bold]Оставьте пустым, чтобы отключить[/font].

[diggy]
mid-save-install=[color=red]Diggy был добавлен в существующее сохранение. Мир может быть создан только на совершенно новой карте — Diggy здесь отключён.[/color]
setting-rebased=[color=yellow]Diggy: параметр «__1__» использовал старое значение по умолчанию и был обновлён до __2__. Измените его в настройках модов, если предпочитаете другое значение.[/color]
stress-overlay=Наложение напряжения: показано ячеек __1__ на 10 секунд (красный = близко к обвалу, синий = поддерживается).
command-stress=Администратор: показать значения напряжения потолка вокруг вас на 10 секунд.
command-mirror-check=Администратор: проверить кэш мира системы напряжения по текущей карте (6x6 чанков вокруг вас).
mirror-check=Проверка зеркала: сравнено чанков __1__, несовпадений __2__ (__3__).
admin-only=Только для администраторов.
command-kit=Администратор: набор для тестирования — скорость добычи x4, 400 стен, броня MK2 с термоядерным реактором, щитами, лазерами, дронстанциями и 50 роботами; всё полностью заряжено.
command-mine=Администратор: установить модификатор скорости добычи персонажа (/diggy-mine 10, по умолчанию 10). Сбрасывается после смерти.
mine-set=[color=green]Модификатор скорости добычи: __1__ → __2__.[/color]
kit-given=[color=green]Тестовый набор Diggy экипирован: добыча x4, 400 стен, заряженная броня MK2 (щиты + лазеры), 50 роботов.[/color]
kit-needs-character=Для получения набора нужен персонаж.
kit-armor-skipped=Слот брони занят — броня MK2 пропущена, остальные предметы набора выданы.
command-sim=Администратор: повторяемый тест — расчищает зал 32x32 к востоку от вас с сеткой колонн (расстояние соответствует настройке поддержки стен). Параметры: «bare» (без колонн), «slow» (наблюдаемый темп + живое наложение напряжения), «stop». Результаты сохраняются в script-output.
sim-started=[color=yellow]Симуляция Diggy запущена (__1__): расчищается зал 30x30 к востоку от вас.[/color]
sim-already-running=Симуляция уже выполняется — сначала используйте «/diggy-sim stop».
sim-not-running=Симуляция не запущена.
sim-finished=[color=yellow]Симуляция Diggy __1__: раскопок __2__, обвалов __3__, пиковое напряжение __4__, __5__ с.[/color]
vein-discovered=Обнаружена жила: __1__ [color=yellow]__2__[/color]!
cavern-breached=[color=orange]Порода поддаётся — впереди открывается туннель![/color]
cavern-room-breached=[color=orange]Порода поддаётся — раскопка пробила пещеру![/color]
cave-collapse=[color=red]Обвал пещеры![/color]
cave-collapse-other=Игрок __1__ попал под обвал пещеры!
cavern-armed=[color=orange]Пещера содрогается — после гибели её стражей древний потолок начинает рушиться![/color]
cavern-countdown-pop=ОБВАЛ ЧЕРЕЗ __1__
cavern-collapse-pop=ОБВАЛ!
collapse-imminent-pop=ТРЕСК!
cavern-held-pop=ВЫДЕРЖАЛО!
cavern-collapsed=[color=red]Пещера частично обрушилась![/color]
cavern-held=[color=green]Потолок выдержал — ваши опоры спасли пещеру![/color]
mother-emerges=[color=red]По пещерам разносится чудовищный визг — появилась Матка![/color]
big-mother-emerges=[color=red]Земля дрожит. Под вашими ногами пробудилось нечто огромное.[/color]
cracking-sound-1=тресь
cracking-sound-2=КРРРР

[the-cave-enemy-expansion]
command-help=Тест администратора: /the-cave-expansion-test <0-100|status>. Процент задаёт эволюцию на всех основных поверхностях Пещеры и запускает новый интервал расширения; status показывает эволюцию, вражеские гнёзда, оставшееся время и состояние расширения.
admin-only=Команду тестирования расширения врагов может использовать только администратор.
no-surface=Активная основная поверхность Пещеры не найдена.
enabled=включено
disabled=отключено
not-scheduled=не запланировано
seconds=__1__ сек.
test-status=[The Cave] __1__: эволюция __2__% | Вражеские гнёзда: __3__ | Следующая попытка расширения: __4__ | Расширение: __5__.
test-set=[The Cave] __1__: эволюция установлена на __2__% | Новый таймер расширения: __3__ сек. | Вражеские гнёзда: __4__.
disabled-warning=[The Cave] Параметр «Разрешить расширение кусак» сейчас отключён. Перед тестом включите его в Настройки > Настройки модов > Запуск.

