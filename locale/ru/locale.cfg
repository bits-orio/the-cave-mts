server-features-title=УНИКАЛЬНЫЕ ВОЗМОЖНОСТИ
server-feature-depth=★ Четыре зоны глубины: лёгкая, средняя, сложная и кошмарная.
server-feature-rooms=◆ Заданные пещеры, сокровищницы, гнёзда врагов и региональные находки.
server-feature-missions=◆ Урановые пещеры утилизации и временные рейды в укреплённые хранилища.
server-feature-research=◆ Улучшения персонажа, логистики, турелей, сеток оборудования и поездов.
server-feature-caves=★ Общая статистика команд и отдельный рейтинг игроков онлайн по монетам во вкладке «Пещеры».
server-important-title=ВАЖНО
server-important-collapse-disabled=◆ Обвалы в этом мире ОТКЛЮЧЕНЫ. Исследование подпорок скрыто; предупреждения, сигналы тревоги и обвалы потолка не происходят.
server-important-collapse-enabled=⚠ ОБВАЛЫ ПЕЩЕРЫ ВКЛЮЧЕНЫ. Активен исходный быстрый баланс. Неподдерживаемые выработки могут обрушиться без предварительных маркеров напряжения и раздавить игроков или здания. Немедленно реагируйте на квадрат с обратным отсчётом, тревогу и треск.
server-important-darkness=● За пределами безопасной зоны найдите работающий свет за 30 секунд, иначе пещерные существа начнут атаковать.
server-important-advancing-directions=⚠ НАСТУПАЮЩИЙ ОБВАЛ: путь на юг / вниз закрыт. Все игровые зоны находятся впереди на севере / вверху. Пересекайте электрическую линию только если хотите, чтобы южная охрана атаковала.
server-important-directions=◆ Направления режима «Всё на Наувисе»: север/верх — Аквило, юг/низ — Глеба, восток/право — Фульгора, запад/лево — Вулкан.
server-important-planets=◆ «Всё на Наувисе» отключено; используется обычный межпланетный прогресс Space Age.
server-important-startup=◆ Стартовые настройки общие, после загрузки доступны только для чтения и требуют перезапуска для изменения.
server-map-info-title=ИНФОРМАЦИЯ О КАРТЕ
server-runtime=Время работы сервера: __1__ ч __2__ мин
server-online=Игроки онлайн: __1__ / __2__
server-offline-warning=Пять минут бездействия приводят к AFK-исключению. После любого выхода вернитесь в течение отдельного пятиминутного срока. Иначе предметы будут перенесены в постоянное тело рядом с текущим Главным поездом при включённых Интерьерах поездов или в точку появления команды в обычной игре.
server-offline-disabled=Защита тела офлайн-игрока отключена на этом сервере.
