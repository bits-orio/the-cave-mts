[recipe-description]
the-cave-scrap-sorting=Сортирует 10 единиц лома The Cave с независимыми случайными проверками компонентов базовой игры. Каждая успешная проверка даёт 3–7 предметов, и одна операция может выдать несколько разных результатов. Доступно только в сборочных автоматах.

[item-description]
the-cave-small-metal-electric-pole=Малая железная опора ЛЭП. Соединения, дальность проводов и область снабжения такие же, как у обычной малой опоры ЛЭП.
the-cave-scrap=Извлечённый радиоактивный лом. Каждый цикл добычи даёт 10 единиц — достаточно для одной сортировки в любом сборочном автомате; вручную не создаётся.
the-cave-storage-tank-1x1=Компактный резервуар 1×1. Фиксированная вместимость: 2 000 единиц жидкости.
the-cave-storage-tank-2x2=Компактный резервуар 2×2 с тремя соединениями для труб. Фиксированная вместимость: 8 000 единиц жидкости.
the-cave-storage-tank-3x4=Улучшенный прямоугольный резервуар. Фиксированная вместимость: 40 000 единиц жидкости.
the-cave-storage-tank-5x5=Большой резервуар высокой вместимости. Фиксированная вместимость: 70 000 единиц жидкости.
chemical-rocket=Создаёт ядовитое облако и замедляет врагов в большой области.
incendiary-rocket=Создаёт большую горящую область при попадании.
the-cave-big-wooden-pole=Простой железный электрический столб большой дальности. Соединяет провода на расстоянии до 24 клеток и снабжает область 4x4.
the-cave-filter-mining-drills-tool=Выделите буры рамкой, затем выберите ресурс, который они должны добывать.
the-cave-resource-eraser-tool=Навсегда удаляет все выбранные ресурсы, включая нефть, уран, ресурсы Space Age и ресурсы из других модов. Не более 10 000 ресурсов за одно выделение.
the-cave-portable-power-interface-mk1=Аварийный источник энергии, доступный только на рынке. Производит 50 кВт, имеет 200 здоровья; его можно добыть, ремонтировать, повредить и уничтожить.
the-cave-portable-power-interface-mk2=Аварийный источник энергии, доступный только на рынке. Производит 80 кВт, имеет 200 здоровья; его можно добыть, ремонтировать, повредить и уничтожить.
the-cave-portable-power-interface-mk3=Аварийный источник энергии, доступный только на рынке. Производит 100 кВт, имеет 200 здоровья; его можно добыть, ремонтировать, повредить и уничтожить.
the-cave-portable-power-interface-mk4=Аварийный источник энергии, доступный только на рынке. Производит 150 кВт, имеет 200 здоровья; его можно добыть, ремонтировать, повредить и уничтожить.
the-cave-portable-power-interface-mk5=Аварийный источник энергии, доступный только на рынке. Производит 250 кВт, имеет 200 здоровья; его можно добыть, ремонтировать, повредить и уничтожить.
the-cave-wind-turbine=После первого исследования производит 1 МВт. Следующие исследования автоматически повышают мощность этой же турбины до 1,5 МВт и затем до окончательных 2 МВт.
the-cave-stack-inserter=Собирает полную пачку в руке и размещает настоящие стопки предметов на конвейерах.

