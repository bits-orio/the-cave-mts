[the-cave-fortified-vault]
spiral-rules=УКРЕПЛЁННАЯ СПИРАЛЬ\n15 участков.\nЛЕГКО 1–5: зелёный пол, синие тайники, кусаки, гнёзда и пулемётные турели — по 7 минут.\nСРЕДНЕ 6–10: жёлтый пол и тайники, более сильные враги и лазерные турели — по 8 минут.\nСЛОЖНО 11–15: красный пол и тайники, более сильные враги и огнемётные турели — по 10 минут.\nУничтожьте всех врагов, гнёзда и турели участка: следующий коридор построится и получит новый таймер. Награды можно забрать позже; тайники не вызывают тревогу.\nПорталы ТОЛЬКО ВЫХОД находятся на участках 5, 10 и 15. У входа тоже можно выйти. Повторный вход всегда ведёт в коридор 1. Общий таймер идёт и снаружи; остаток времени не переносится.\nВыйдите до 00:00. Оставшиеся внутри погибнут; пещера закроется навсегда, оставленные вещи будут потеряны.\nМежду коридорами непроходимая пустота. Следуйте по спирали. Зачищенные коридоры остаются безопасными.
spiral-exit-only=ТОЛЬКО ВЫХОД
spiral-stage-label=Коридор __1__ / 15
spiral-unlocked=[Fortified] Открыт коридор __1__ / 15. Новый общий таймер: __2__ мин.
spiral-hud=Fortified · Коридор __1__/15 · __2__
spiral-left=[Fortified] Вы вышли. Таймер продолжает идти. Повторный вход ведёт в коридор 1.
legacy-rooms-rules=УКРЕПЛЁННЫЕ КОМНАТЫ\n18 одинаковых комнат размером 250 x 35 клеток.\nЛЕГКО 1–6: зелёный пол, по 8 синих тайников, кусаки, гнёзда и пулемётные турели — по 7 минут.\nСРЕДНЕ 7–12: жёлтый пол, по 6 жёлтых тайников, более сильные враги и лазерные турели — по 8 минут.\nСЛОЖНО 13–18: красный пол, по 4 красных тайника, более сильные враги и огнемётные турели — по 10 минут.\nУничтожьте всех врагов, гнёзда и турели: следующая комната построится и получит новый таймер. Награды находятся в дальнем конце комнаты; их можно забрать позже. Тайники не вызывают тревогу.\nСиний проход размером 35 x 595 клеток открыт с самого начала. Кусаки не могут войти в него. Между рядами комнат — 35 клеток непроходимой пустоты. Комнаты открываются по порядку.\nВнутри только ДВА портала: вход/выход наверху и один портал ТОЛЬКО ВЫХОД внизу синего прохода. Оба доступны сразу; выходов в комнатах нет. Повторный вход всегда ведёт наверх.\nОбщий таймер идёт и снаружи; остаток времени не переносится. Выйдите до 00:00. Оставшиеся внутри погибнут; пещера закроется навсегда, оставленные вещи будут потеряны.
rooms-rules=УКРЕПЛЁННЫЕ КОМНАТЫ\n18 одинаковых комнат размером 250 x 35 клеток.\nЛЕГКО 1–6: зелёный пол, 8 синих тайников, 300 смешанных лёгких врагов, 10 лёгких червей и 6 пулемётных турелей в каждой комнате — 10 минут.\nСРЕДНЕ 7–12: жёлтый пол, 6 жёлтых тайников, 250 смешанных средних врагов, 10 средних червей, 4 пулемётные и 4 лазерные турели — 12 минут.\nСЛОЖНО 13–18: красный пол, 4 красных тайника, 200 больших и чудовищных врагов, 10 больших и чудовищных червей, по 4 пулемётные, лазерные и огнемётные турели — 15 минут.\nКусаки, плеваки, арахниды и бронированные кусаки распределены поровну с округлением. В каждой комнате 12 гнёзд: 4 арахнидов, 4 бронированных кусак, 2 кусак и 2 плевак. Интервалы появления: 2,5 / 4,25 / 6 секунд с обычными ограничениями населения и места. Порождённые гнёздами враги добавляются к начальным.\nДальше от входа опасность растёт. Между гнёздами не менее 20 клеток, между турелями — 15. Огонь вражеских огнемётных турелей не вредит их союзникам; огонь игрока по-прежнему поражает врагов.\nКаждый дополнительный игрок одновременно внутри увеличивает начальное число подвижных врагов на 50%. Число гнёзд, червей и турелей неизменно. Выход игроков не уменьшает достигнутое усиление.\nУничтожьте всех врагов, гнёзда, червей и турели: следующая комната построится и получит новый таймер. Награды в дальнем конце можно забрать позже. Тайники неуязвимы и не вызывают тревогу. Зачищенные комнаты остаются безопасными.\nСиний проход 35 x 595 клеток открыт сразу и недоступен вражеским существам. Между рядами — 35 клеток пустоты. Комнаты открываются по порядку.\nВнутри только ДВА портала: вход/выход наверху и ТОЛЬКО ВЫХОД внизу синего прохода. Оба доступны сразу. Повторный вход всегда ведёт наверх.\nОбщий таймер идёт и снаружи; остаток времени не переносится. После зачистки комнаты 18 оставшееся время продолжает отсчитываться. Выйдите до 00:00: оставшиеся внутри погибнут, пещера закроется навсегда, все оставленные вещи будут потеряны.
rooms-stage-label=Комната __1__ / 18
rooms-unlocked=[Fortified] Открыта комната __1__ / 18. Новый общий таймер: __2__ мин.
