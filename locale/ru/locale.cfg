[the-cave-welcome]
title=THE CAVE
subtitle=Копайте. Исследуйте. Стройте. Выживайте.
begin-title=КАК НАЧАТЬ
begin-body=Добывайте сплошную породу вручную, чтобы открывать пещеру. Прямое копание может обнаружить залы, ресурсы, сокровища и врагов, а также вызвать засаду. Наладьте энергию, освещение и оборону, прежде чем уходить далеко от стартовой области. Глубокие зоны опаснее, но их находки и награды ценнее.
darkness-on-title=НАШЕСТВИЕ ИЗ ТЬМЫ — ВКЛЮЧЕНО
darkness-on-body=Область 5×5 чанков вокруг точки появления вашей команды безопасна. За её пределами оставайтесь не дальше 12 клеток от работающей малой лампы или 30 клеток от работающего фонарного столба. После предупреждения о тьме у вас есть 30 секунд, чтобы найти свет. Без защиты рядом начнут появляться пещерные существа и атаковать вас. Вождение транспорта сбрасывает таймер тьмы.
darkness-off-title=НАШЕСТВИЕ ИЗ ТЬМЫ — ОТКЛЮЧЕНО
darkness-off-body=30-секундная атака «Нашествие из тьмы» отключена в этом сохранении. Освещение всё ещё важно для видимости, но удаление от работающей лампы не запустит эту систему появления врагов.
nauvis-on-title=ВСЁ НА НАУВИСЕ — ВКЛЮЧЕНО
nauvis-on-body=Прогресс Space Age встроен в общий пещерный мир. Копайте на север / вверх к Аквило, на юг / вниз к Глебе, на восток / вправо к Фульгоре и на запад / влево к Вулкану. Эти регионы начинаются за центральной пещерой Наувиса и становятся опаснее по мере удаления от центра.
nauvis-off-title=ВСЁ НА НАУВИСЕ — ОТКЛЮЧЕНО
nauvis-off-body=Направленные пещерные регионы Space Age не используются. Планеты Space Age остаются отдельными, и путешествие к Аквило, Глебе, Фульгоре и Вулкану происходит через обычный межпланетный прогресс. Сама The Cave остаётся на Наувисе.
advancing-collapse-title=НАСТУПАЮЩИЙ ОБВАЛ — ВКЛЮЧЁН
advancing-collapse-body=Юг закрыт электрической предупреждающей линией и охраняемой полосой врагов. Охрана постоянно патрулирует, атакует нарушителей и возвращается на юг после отступления игрока; она никогда не нападает на фабрику к северу. У вас есть два часа игры с подключёнными игроками на подготовку; затем пещера начнёт исчезать с юга на север. Перемещайте фабрику и запасы на север / вверх. Оставленные позади поверхность, здания и транспорт будут навсегда удалены. Полоса имеет ширину 510 клеток, каждая зона — длину 1024 клетки, а будущие семейства зон Space Age открываются соответствующими исследованиями обнаружения планет и разделяются одной или двумя зонами Наувиса. Уже созданные зоны сохраняют прежние размеры; новая схема начинается с первой полностью несозданной зоны.
cavetorio-title=CAVETORIO — ВКЛЮЧЕНО
cavetorio-body=Главный поезд и Варп-аванпост — сердце экспедиции. При варпе в следующую пещеру переносится только аванпост и всё внутри него; всё снаружи остаётся позади. Если во время варпа вы снаружи, снаряжение персонажа, транспорт и инвентарь будут потеряны. Защищайте все зарегистрированные части Главного поезда и возвращайтесь до окончания таймера.
features-title=ЧТО МОЖНО ОБНАРУЖИТЬ
features-body=В зависимости от настроек сохранения и установленных DLC, The Cave может включать смешанные ресурсные жилы, уровни глубины, особые пещеры, комнаты сокровищ, вражеские гнёзда, рейды в укреплённые хранилища, урановые пещеры утилизации, регионы Space Age, переносные интерьеры поездов, экспедиции CAVETORIO, улучшения исследований, рыночные награды и множество встроенных машин и систем удобства.
confirm=Я понимаю

[the-cave-info]
button-tooltip=Открыть информацию и управление The Cave
