the-cave-cavetorio-intro-message=[The Cave: CAVETORIO]\n\nДобро пожаловать на Варп-аванпост. Главный поезд — сердце этой экспедиции. При каждом варпе Варп-аванпост и всё, что находится внутри него, переносятся в новую пещеру.\n\nСохраняется только то, что находится внутри Варп-аванпоста. Всё за его пределами остаётся позади.\n\nЕсли в момент варпа вы находитесь за пределами аванпоста, ваше тело, броня, снаряжение, оружие, боеприпасы, транспорт и инвентарь будут потеряны. В следующей пещере вы возродитесь с пустым инвентарём.\n\nГлавный поезд должен уцелеть. Если последний зарегистрированный локомотив будет уничтожен, начнётся 30-секундное предупреждение, после чего экспедиция автоматически перезапустится в новой пещере.\n\nИспользуйте Ручной варп, чтобы покинуть пещеру раньше. В сетевой игре для Ручного варпа требуется большинство голосов.\n\nИсследуйте «Расширение Варп-аванпоста», чтобы увеличить аванпост. Исследуйте «Время Варп-аванпоста», чтобы дольше оставаться в пещере до следующего варпа.\n\nВыживайте. Расширяйтесь. Вернитесь до варпа.

