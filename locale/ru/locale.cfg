server-welcome-title=ДОБРО ПОЖАЛОВАТЬ В THE CAVE
server-welcome-detailed=Стройте подземную фабрику, добывая сплошную породу и открывая детерминированные пещерные залы. Исследуйте осторожно, наладьте энергию и свет, защищайте находки и готовьтесь перед продвижением в глубокие регионы.
