[entity-description]
the-cave-lamp-pole=Объединяет большую базовую опору и фонарь. Дальность проводов: 32 клетки. Область снабжения: 7x7. Потребление включённого фонаря: 20 кВт. При наличии питания защищает игроков в радиусе 30 клеток от Нашествия из тьмы. Открывается вместе с Фонарным столбом.
the-cave-small-metal-electric-pole=Малая железная опора ЛЭП. Соединения, дальность проводов и область снабжения такие же, как у обычной малой опоры ЛЭП.
the-cave-scrap-resource=Лом из урановых пещер. Доступен с начала игры: добывается вручную или обычными бурами, без исследований и серной кислоты. Каждый завершённый цикл добычи даёт 10 единиц лома The Cave.
the-cave-train-fluid-transfer-tank-5x5=Закреплённый передаточный резервуар вместимостью 70 000 единиц жидкости внутри вагона-цистерны. Левый резервуар экспортирует, а правый импортирует.
the-cave-train-locomotive-substation=Закреплённая подстанция Главного локомотива с зоной питания 36×36 и дальностью провода 36 клеток. Она питает отдельный соединитель Сада через программное медное соединение; дополнительные локомотивы её не получают.
the-cave-train-garden-substation=Закреплённый проводной соединитель нижнего Сада с дальностью провода 36 клеток и прямой зоной питания только в пределах защищённой площадки 2×2. Для питания машин Сада подключайте электрические столбы.
the-cave-train-battery-info-panel=Объясняет, как видимая внутренняя электропроводка заряжает батарею поезда и питает внешнюю сеть.
the-cave-train-battery-output-reserve=Односторонний выходной резерв на 0,25 секунды для программной батареи поезда. Питает машины и заряжает внешние аккумуляторы совместно с внешними генераторами. Внешняя энергия не может заряжать батарею поезда.
the-cave-train-battery-interior-charger=Односторонний внутренний интерфейс зарядки программной батареи поезда. Это не построенный игроком аккумулятор; питание поступает только от внутренней сети Главного поезда.
the-cave-garden-item-input=Закреплённый односторонний маршрут предметов из Главного локомотива в локомотивный сад.
the-cave-garden-item-output=Закреплённый односторонний маршрут предметов из локомотивного сада обратно в Главный локомотив.
the-cave-garden-fluid-input=Закреплённый односторонний маршрут жидкости из Главного локомотива в локомотивный сад.
the-cave-garden-fluid-output=Закреплённый односторонний маршрут жидкости из локомотивного сада обратно в Главный локомотив.
the-cave-fortified-vault-entrance=Спуститесь в одноразовый тридцатиминутный подземный рейд за сокровищами. Сначала уничтожьте защитников наверху.
the-cave-fortified-vault-entrance-1=Спуститесь в одноразовый тридцатиминутный подземный рейд за сокровищами. Сначала уничтожьте защитников наверху.
the-cave-fortified-vault-entrance-2=Спуститесь в одноразовый тридцатиминутный подземный рейд за сокровищами. Сначала уничтожьте защитников наверху.
the-cave-fortified-vault-exit=Вернитесь в верхнюю укреплённую комнату до запечатывания хранилища.
the-cave-fortified-vault-exit-1=Вернитесь в верхнюю укреплённую комнату до запечатывания хранилища.
the-cave-fortified-vault-exit-2=Вернитесь в верхнюю укреплённую комнату до запечатывания хранилища.
the-cave-fortified-vault-power-pole=Подключите эту закреплённую опору к верхней электросети, чтобы запитать соответствующую опору и лампу внизу.
the-cave-fortified-vault-lamp=Закреплённая лампа у нижнего входа, получающая энергию только через верхнюю опору хранилища.
the-cave-fortified-cache-standard=Нажмите один раз, чтобы вызвать трёх защитников. Уничтожьте их и нажмите снова, чтобы забрать награду.
the-cave-fortified-cache-secure=Нажмите один раз, чтобы вызвать четырёх защитников. Уничтожьте их и нажмите снова, чтобы забрать награду.
the-cave-fortified-cache-high-security=Нажмите один раз, чтобы вызвать пятерых защитников. Уничтожьте их и нажмите снова, чтобы забрать награду.
the-cave-uranium-cave-entrance=Спуститесь в урановую пещеру. Первый вход запускает таймер на 30 минут или на 60 минут с активным Bob's Ores. Bob's Ores добавляет широкие богатые залежи и включённый торий. Начатые экспедиции сохраняют прежний срок.
the-cave-uranium-cave-entrance-1=Спуститесь в урановую пещеру. Первый вход запускает таймер на 30 минут или на 60 минут с активным Bob's Ores. Bob's Ores добавляет широкие богатые залежи и включённый торий. Начатые экспедиции сохраняют прежний срок.
the-cave-uranium-cave-entrance-2=Спуститесь в урановую пещеру. Первый вход запускает таймер на 30 минут или на 60 минут с активным Bob's Ores. Bob's Ores добавляет широкие богатые залежи и включённый торий. Начатые экспедиции сохраняют прежний срок.
the-cave-uranium-cave-exit=Покиньте урановую пещеру и вернитесь в верхнюю пещеру.
the-cave-uranium-item-down-input=Вход со скоростью синего конвейера. Предметы отправляются вниз, в урановую пещеру.
the-cave-uranium-item-down-output=Выход со скоростью синего конвейера для предметов, отправленных с поверхности.
the-cave-uranium-item-up-input=Вход со скоростью синего конвейера. Предметы отправляются обратно на поверхность.
the-cave-uranium-item-up-output=Выход со скоростью синего конвейера для предметов из урановой пещеры.
the-cave-uranium-fluid-down-input=Односторонний вход жидкости с поверхности в урановую пещеру.
the-cave-uranium-fluid-down-output=Односторонний выход жидкости, поступающей с поверхности.
the-cave-uranium-fluid-up-input=Односторонний вход жидкости из урановой пещеры на поверхность.
the-cave-uranium-fluid-up-output=Односторонний выход жидкости из урановой пещеры.
the-cave-uranium-power-bridge=Скрытый энергомост между уровнями, используемый закреплёнными большими опорами ЛЭП.
the-cave-mineral-cave-entrance=Спуститесь в одноразовую 30-минутную экспедицию за железом, медью или углём.
the-cave-mineral-cave-entrance-1=Спуститесь в одноразовую 30-минутную экспедицию за железом, медью или углём.
the-cave-mineral-cave-entrance-2=Спуститесь в одноразовую 30-минутную экспедицию за железом, медью или углём.
the-cave-mineral-cave-exit=Покиньте минеральную пещеру и вернитесь наверх до окончания таймера.
the-cave-mineral-item-down-input=Вход со скоростью синего конвейера. Предметы отправляются вниз, в минеральную пещеру.
the-cave-mineral-item-down-output=Выход со скоростью синего конвейера для предметов, отправленных с поверхности.
the-cave-mineral-item-up-input=Вход со скоростью синего конвейера для добытой руды, отправляемой на поверхность.
the-cave-mineral-item-up-output=Выход со скоростью синего конвейера для руды из минеральной пещеры.
the-cave-mineral-power-bridge=Скрытый энергомост между закреплёнными большими опорами минеральной пещеры.
the-cave-big-wooden-pole=Простой железный электрический столб большой дальности. Соединяет провода на расстоянии до 24 клеток и снабжает область 4x4.
the-cave-portable-power-interface-mk1=Аварийный источник энергии, доступный только на рынке. Производит 50 кВт, имеет 200 здоровья; его можно добыть, ремонтировать, повредить и уничтожить.
the-cave-portable-power-interface-mk2=Аварийный источник энергии, доступный только на рынке. Производит 80 кВт, имеет 200 здоровья; его можно добыть, ремонтировать, повредить и уничтожить.
the-cave-portable-power-interface-mk3=Аварийный источник энергии, доступный только на рынке. Производит 100 кВт, имеет 200 здоровья; его можно добыть, ремонтировать, повредить и уничтожить.
the-cave-portable-power-interface-mk4=Аварийный источник энергии, доступный только на рынке. Производит 150 кВт, имеет 200 здоровья; его можно добыть, ремонтировать, повредить и уничтожить.
the-cave-portable-power-interface-mk5=Аварийный источник энергии, доступный только на рынке. Производит 250 кВт, имеет 200 здоровья; его можно добыть, ремонтировать, повредить и уничтожить.
the-cave-wind-turbine=Производит электричество без топлива. Мощность автоматически соответствует исследованию ветряной турбины её команды: 1 МВт, 1,5 МВт и окончательные 2 МВт.
diggy-rock=Нераскопанный мир. Добудьте породу, чтобы узнать, что скрывается под ней.
diggy-tree=Обычное дерево для заготовки древесины. Его рубка не открывает пещеру и не вызывает врагов.
the-cave-stack-inserter=Собирает полную пачку в руке и размещает настоящие стопки предметов на конвейерах.

lamp-post=Обеспечивает яркое и эффективное освещение большой площади для крупных пещерных залов. Пока получает питание, защищает игроков в радиусе 30 клеток от Нашествия из тьмы.
electric-boiler=Использует электричество для нагрева жидкостей.

