[technology-description]
the-cave-coin-maker=Открывает автомат для продажи предметов по закупочным ценам рынка. Манипуляторы подают товары и забирают монеты.
[entity-description]
the-cave-coin-maker=Автоматически продаёт полные партии предметов обычного качества по закупочным ценам рынка. Каждый товар продаётся отдельно: показанные предметы — варианты продажи, а не общий набор ингредиентов. Выбор рецепта не требуется. Базовая скорость: одна продажа за 2 секунды. Четыре ячейки для модулей скорости и эффективности; маяки передают только эффекты этих категорий. Потребление в простое: 500 кВт, модули на него не влияют. Полное потребление при работе без модулей: 2 МВт. Если для монет нет места, продажа приостанавливается без потери товаров.
