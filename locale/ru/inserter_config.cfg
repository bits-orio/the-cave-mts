[technology-name]
the-cave-inserter-configuration=Настройка манипуляторов __1__

[technology-description]
the-cave-inserter-configuration-1=Открывает прямые позиции захвата и выгрузки на расстоянии до двух клеток, а также точную настройку смещения выгрузки внутри целевой клетки. Обычные манипуляторы можно настроить на увеличенную дальность.
the-cave-inserter-configuration-2=Открывает четыре внешние диагональные позиции захвата и выгрузки.
the-cave-inserter-configuration-3=Открывает полную сетку захвата и выгрузки, включая смещённые позиции и поддерживаемые модифицированные манипуляторы с увеличенной дальностью.
the-cave-inserter-configuration-4=Завершает ветку исследований настройки манипуляторов. Точная настройка смещения выгрузки уже доступна с уровня 1.

[technology-effect]
the-cave-inserter-configuration-1=Прямые позиции на расстоянии двух клеток и настройка смещения выгрузки
the-cave-inserter-configuration-2=Диагональные позиции на расстоянии двух клеток
the-cave-inserter-configuration-3=Полная сетка захвата и выгрузки
the-cave-inserter-configuration-4=Финальный уровень настройки

[mod-setting-name]
the-cave-inserter-configurable=Настраиваемые манипуляторы

[mod-setting-description]
the-cave-inserter-configurable=Включает или отключает систему настройки манипуляторов The Cave, включая исследования, позиции захвата и выгрузки, смещение выгрузки и горячие клавиши. Не включайте её одновременно с Bob's Adjustable Inserters, Inserter Config, Side Inserters или другим модом управления манипуляторами. При использовании такого мода установите эту настройку в положение «Отключить».

[string-mod-setting]
the-cave-inserter-configurable-enabled=Включить
the-cave-inserter-configurable-disabled=Отключить
