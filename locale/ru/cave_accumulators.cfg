[entity-description]
the-cave-accumulator-3x3=Накапливает избыток электроэнергии и отдаёт её при недостаточной выработке. Обычное качество: ёмкость 50 МДж, мощность заряда и разряда 3 МВт. Занимает 3x3 клетки.
the-cave-accumulator-6x6=Накапливает избыток электроэнергии и отдаёт её при недостаточной выработке. Обычное качество: ёмкость 250 МДж, мощность заряда и разряда 6 МВт. Занимает 6x6 клеток.
the-cave-accumulator-10x10=Накапливает избыток электроэнергии и отдаёт её при недостаточной выработке. Обычное качество: ёмкость 1 ГДж, мощность заряда и разряда 60 МВт. Занимает 10x10 клеток. Передний индикатор показывает фактический заряд: от красного через жёлтый до зелёного.
the-cave-accumulator-20x20=Накапливает избыток электроэнергии и отдаёт её при недостаточной выработке. Обычное качество: ёмкость 5 ГДж, мощность заряда и разряда 300 МВт. Занимает 20x20 клеток. Оснащён вращающимися вентиляторами и индикатором фактического заряда: от красного через жёлтый до зелёного.

[cave-portable-accumulators]
charged-name=__1__ (заряжен)
item-description=Сохраняет запас электроэнергии при демонтаже и повторной установке. Каждый заряженный аккумулятор занимает отдельную ячейку инвентаря. Установите его и подключите к электросети, чтобы использовать энергию или зарядить его.
stored-charge=Запас энергии: __1__ / __2__ (__3__%)\nЗаряд сохраняется в инвентарях и контейнерах. Установите аккумулятор и подключите к электросети для использования или зарядки.
invalid-charge=Данные о заряде аккумулятора некорректны. Установка отменена, предмет возвращён.
capacity-changed=Текущая ёмкость аккумулятора меньше сохранённого заряда. Установка отменена, заряженный предмет возвращён.
restore-failed=Не удалось восстановить заряд. Установка отменена, заряженный предмет возвращён.
