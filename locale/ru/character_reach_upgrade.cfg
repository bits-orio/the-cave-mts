the-cave-character-reach-upgrade=Улучшение радиуса персонажа

[technology-description]
the-cave-character-reach-upgrade=Одновременно улучшает семь характеристик персонажа. Этот уровень добавляет +__1__ клетки к дальности строительства, взаимодействия, добычи ресурсов, выбрасывания предметов и подбора добычи. Дальность ручного подбора предметов клавишей F остаётся стандартной. Общий бонус дальности: +__2__ клеток. Итоговые базовые значения после этого уровня: скорость бега __3__, скорость ручного изготовления __4__.
