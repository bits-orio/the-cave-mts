[mod-setting-name]
the-cave-market=Рынок

[mod-setting-description]
the-cave-market=Включить или отключить рынок The Cave и все новые награды монетами. При отключении монеты и переносные источники питания, доступные только на рынке, исключаются из новых стартовых наборов. Уже полученные предметы и постройки сохраняются. По умолчанию: включено.

[string-mod-setting]
the-cave-market-enabled=Включить
the-cave-market-disabled=Отключить
