[mod-setting-name]
the-cave-minimal-wire=Минимальные провода
the-cave-minimal-wire-radius=Радиус поиска минимальных проводов
the-cave-minimal-wire-max-poles=Максимум опор для минимальных проводов
the-cave-minimal-wire-operations-per-tick=Операций с проводами за тик

[mod-setting-description]
the-cave-minimal-wire=По умолчанию: включено. После установки, удаления или замены опоры перестраивает ближайшие медные соединения опор в короткое детерминированное минимальное остовное дерево. Красные и зелёные провода сохраняются. Требуется перезапуск.
the-cave-minimal-wire-radius=Радиус поиска опор вокруг изменённой опоры в клетках. По умолчанию: 42.
the-cave-minimal-wire-max-poles=Максимальное количество ближайших опор игрока в одной локальной перестройке. По умолчанию: 30.
the-cave-minimal-wire-operations-per-tick=Максимальное количество подключений и отключений медных проводов за один тик. По умолчанию: 10.

[string-mod-setting]
the-cave-minimal-wire-enabled=Включить
the-cave-minimal-wire-disabled=Отключить
