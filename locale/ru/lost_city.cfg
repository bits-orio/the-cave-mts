story-plumber-1=Водопровод поселения разорван. Нужны трубы и насосы, пока не опустели оставшиеся резервуары.
story-plumber-2=Нижний район затоплен, а в убежищах нет воды. Помогите восстановить линии перекачки.
story-gas-1=Повреждённая линия травит газом в промышленном районе. Нужны детали, чтобы её изолировать.
story-gas-2=Топливная сеть отключена. Нужны перерабатывающие установки и трубы для безопасного запуска аварийной системы.
story-miner-1=В деревне остался один пригодный рудный карман. Соберите запрошенный объём и доставьте его в ящик снабжения задания.
