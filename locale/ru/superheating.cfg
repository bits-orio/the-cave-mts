[mod-setting-description]
the-cave-superheating=Главный переключатель встроенных машин, технологии и жидкого топлива системы перегрева пара.
the-cave-superheating-superheaters=Добавляет твердотопливные и жидкотопливные пароперегреватели, производящие пар температурой 465°C.
the-cave-superheating-single-stage=Пароперегреватели принимают холодную воду напрямую, поэтому обычный котёл перед ними не нужен. После изменения настройки в существующем сохранении перестройте и переподключите пароперегреватели.
the-cave-superheating-liquid-fuel=Добавляет жидкотопливные котлы и позволяет сжигать поддерживаемые нефтепродукты как жидкое топливо.
the-cave-superheating-override-liquid-values=Если включено, The Cave заменяет значения жидкого топлива, заданные другими модами. Для лучшей совместимости оставьте отключённым.
the-cave-superheating-fuel-value=Энергия топлива в кДж на единицу __1__.

