[entity-description]
the-cave-industrial-container=Контейнер большой вместимости из промышленной системы хранения The Cave. Это отдельный контейнер, который не заменяет стандартные сундуки.

[technology-name]
the-cave-industrial-containers=Промышленные контейнеры
the-cave-logistic-containers=Логистические контейнеры

[technology-description]
the-cave-industrial-containers=Открывает обычные и фильтрующие промышленные контейнеры четырёх размеров.
the-cave-logistic-containers=Открывает варианты пассивного снабжения и хранения для промышленных контейнеров всех размеров. Запрашивающие, буферные и активно снабжающие варианты открываются позже исследованием «Логистическая система».

[mod-setting-name]
the-cave-industrial-container-1x1-capacity=Вместимость промышленного контейнера 1×1
the-cave-industrial-container-2x2-capacity=Вместимость промышленного ящика 2×2
the-cave-industrial-container-4x4-capacity=Вместимость промышленного хранилища 4×4
the-cave-industrial-container-6x6-capacity=Вместимость промышленного склада 6×6

[mod-setting-description]
the-cave-industrial-container-1x1-capacity=Число ячеек во всех вариантах промышленного контейнера 1×1. Диапазон: 100–200. По умолчанию: 200. Обычные сундуки Factorio не изменяются. Требуется перезапуск.
the-cave-industrial-container-2x2-capacity=Число ячеек во всех вариантах промышленного ящика 2×2. Диапазон: 400–800. По умолчанию: 800. Размер размещения 2×2 не изменяется. Обычные сундуки Factorio не изменяются. Требуется перезапуск.
the-cave-industrial-container-4x4-capacity=Число ячеек во всех вариантах промышленного хранилища 4×4. Диапазон: 900–1600. По умолчанию: 1600. Обычные сундуки Factorio не изменяются. Требуется перезапуск.
the-cave-industrial-container-6x6-capacity=Число ячеек во всех вариантах промышленного склада 6×6. Диапазон: 1800–3000. По умолчанию: 3000. Обычные сундуки Factorio не изменяются. Требуется перезапуск.
