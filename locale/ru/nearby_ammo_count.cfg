[mod-setting-name]
the-cave-nearby-ammo-display-mode=Боезапас ближайших турелей

[mod-setting-description]
the-cave-nearby-ammo-display-mode=Показывает количество загруженных магазинов над дружественными турелями с боеприпасами в радиусе 100 клеток при включённом ALT-режиме. Пустые турели показывают красный 0. Поддерживаются все исследованные варианты дальности пулемётной турели The Cave.

[string-mod-setting]
the-cave-nearby-ammo-display-mode-magazine=Количество магазинов
the-cave-nearby-ammo-display-mode-disabled=Отключено
