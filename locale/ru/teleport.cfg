[technology-description]
the-cave-teleporter-1=Открывает телепорт по точкам и две ячейки назначения. Сохранение стоит 200 электронных схем; каждый Телепорт или возврат стоит 10 улучшенных схем и запускает двухминутную перезарядку.
the-cave-teleporter-2=Сохраняет первые две точки и открывает третью ячейку назначения.
the-cave-teleporter-3=Сохраняет первые три точки и открывает четвёртую, последнюю ячейку назначения.
