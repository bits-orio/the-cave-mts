[mod-setting-description]
the-cave-uranium-caves=По умолчанию: Включено. Начиная со средней глубины естественные урановые входы используют вес комнаты 12, остаются не ближе 150 клеток друг к другу и получают гарантированный подходящий вход после 12 открытых комнат без урана. Каждая нижняя комната открывает жилу урана/лома 50/50; лом не требует исследований или кислоты, а уран по-прежнему требует исследования добычи урана и серной кислоты. Требуется перезапуск.
the-cave-iron-cave=По умолчанию: Включено. Разрешает новые железные пещеры. Отключение удаляет железо из новых колод минеральных пещер, не затрагивая медь или уголь; уже найденные железные пещеры остаются доступными. Требуется перезапуск.
the-cave-copper-cave=По умолчанию: Включено. Разрешает новые медные пещеры. Отключение удаляет медь из новых колод минеральных пещер, не затрагивая железо или уголь; уже найденные медные пещеры остаются доступными. Требуется перезапуск.
the-cave-coal-cave=По умолчанию: Включено. Разрешает новые угольные пещеры. Отключение удаляет уголь из новых колод минеральных пещер, не затрагивая железо или медь; уже найденные угольные пещеры остаются доступными. Требуется перезапуск.
the-cave-fortified-cave=По умолчанию: Включено. Разрешает новые входы в укреплённые пещеры при обычном исследовании и в режиме «Наступающий обвал». Отключение запрещает новые входы; уже найденные пещеры сохраняют доступ, содержимое и обычные таймеры. Требуется перезапуск.
the-cave-wind-turbine=По умолчанию: Включено. Отключение скрывает предмет, рецепт и исследования ветряной турбины и устанавливает нулевую выработку существующих турбин, не удаляя их. Требуется перезапуск.
the-cave-shelter-defense=По умолчанию: Отключено. Дополнительный режим выживания с неподвижным ядром только для новой игры. Создаёт одно неперемещаемое Пещерное убежище с базовыми 5 000 ОЗ, которое враги начинают атаковать после двух часов подготовки. Включает интерьер по Ctrl+Enter с начальным размером 40×40, полное отображение интерьера на карте, управляемую внешнюю камеру, 20 уровней батареи с внешним выводом энергии, 10 уровней щита до 35 000 ОЗ и отложенного авторемонта 50 ОЗ/с, закреплённые предметные и жидкостные соединения, восемь расширений основной площадки до 300×300 плюс отдельную техническую полосу шириной 10 клеток, а также восемь улучшений расстояния вражеских туннелей от 10 до 26 чанков атаки. Уничтожение убежища запускает поэтапный мягкий перезапуск. «Интерьеры поездов» должны быть отключены. Чтобы использовать «Оборону убежища», включите её перед началом игры. Если включены обе настройки, ни один сценарий не запускается, а в игре показывается предупреждение о конфликте. Оставьте обе настройки отключёнными для обычного основного режима The Cave. При обновлении старого сохранения убежище не добавляется в занятую базу. Требуется перезапуск и применение стартовой настройки.
the-cave-train-interiors=По умолчанию: Отключено. Добавляет интерьеры подвижного состава, внешнюю камеру, стартовый Главный поезд, возрождение рядом с поездом, батарею поезда и расширение поезда через исследование мира. Управление: Ctrl+Enter — вход и выход из интерьера поезда. Сад локомотива: встаньте на портал 2×2 в Главном локомотиве или Саду; переход выполняется автоматически и завершается на отдельной серой посадочной площадке. Перед запуском «Интерьеров поездов» настройка «Оборона убежища» должна быть отключена. Если включены обе настройки, ни один сценарий не запускается, а в игре показывается предупреждение о конфликте. Отключите обе настройки для обычного основного режима The Cave. Требуется перезапуск и применение стартовой настройки.
the-cave-allow-wave-defense=По умолчанию: Включено. Включает проверенную сценарную волновую оборону для активного совместимого режима: «Интерьеры поездов» или «Оборона убежища». Включает время подготовки, запланированных нападающих, туннели, очередь и волны боссов. Эта настройка независима от «Разрешить расширение кусак»: если включены обе, обе системы работают одновременно, сохраняя собственных врагов и команды. Отключите только эту настройку, чтобы убрать запланированные волны, не меняя расширение кусак. Отключите обе настройки, чтобы использовать «Интерьеры поездов» или «Оборону убежища» без этих систем атак. Требуется перезапуск и применение стартовой настройки.
the-cave-allow-biter-expansion=По умолчанию: Отключено. Включает систему расширения кусак The Cave: попытки с интервалом от 10 до 2 минут в зависимости от эволюции, плотное размещение гнёзд без минимального промежутка и настоящие отфильтрованные миграции поселенцев. При активных «Интерьерах поездов» или «Обороне убежища» видимая красная граница радиусом 200 клеток следует за Главным локомотивом либо окружает неподвижное Убежище даже при выключенном режиме ALT. Обычные подвижные враги, вошедшие внутрь, навсегда переключаются на атаку этой цели, а новые гнёзда расширения создаются только за пределами границы; враги Волновой обороны и активная Королева арахнидов исключены. Эта настройка независима от «Разрешить волновую оборону», и обе могут работать одновременно. Требуется перезапуск и применение стартовой настройки.
the-cave-arachnid-queen=По умолчанию: Включено. Позволяет первой подходящей комнате с тремя гнёздами в каждой зоне глубины выпустить одну Королеву арахнидов. Королевы перемещаются между открытыми комнатами, раскапывают пограничные камни, когда свободного места нет, создают ровно три случайно взвешенных гнезда, отдыхают и восстанавливают здоровье. Отключение удаляет существующих Королев и запрещает их повторное появление, не изменяя три гнезда комнаты и остальные системы врагов. Требуется перезапуск и применение стартовой настройки.
the-cave-advancing-collapse=По умолчанию: Отключено. Только для новой игры. Создаёт независимый режим движения на север с полосой шириной 510 клеток, зонами длиной 1024 клетки и видимым двухчасовым таймером активной игры. Яркая электрическая линия закрывает юг, пока за ней патрулирует охрана. После окончания таймера поверхность, здания и транспорт навсегда удаляются с юга на север, а каждые три минуты с доступной земли перед движущимся обвалом наступают односторонние волны врагов со скриптовыми гнёздами. Выжившие враги не задерживают следующие волны. Небезопасное возрождение переносится минимум на 40 клеток вперёд от обвала. Поезд, Mobile Factory и другие моды не требуются. В Space Age будущие зоны Вулкана, Глебы, Фульгоры и Аквило становятся доступны только после соответствующего исследования обнаружения планеты. Каждые две планетарные зоны разделены одной или двумя зонами Наувиса, а ранние планетарные враги ограничены номером текущей зоны. Уже созданные зоны сохраняют прежние размеры; новая схема начинается с первой полностью несозданной зоны.




the-cave-cavetorio=ПРЕДУПРЕЖДЕНИЕ: требуется включить CAVETORIO, «Интерьеры поездов» и «Всё на Наувисе», а «Оборона убежища» должна быть отключена. Управление: для интерьеров поездов используется Ctrl+Enter. Переход в Сад локомотива выполняется автоматически при входе на портал 2×2. Лучше использовать в новом сохранении; остальные параметры оставьте по умолчанию, если они не нужны.
the-cave-offline-player-body=По умолчанию: Включено. Сетевая система AFK и возврата вещей. Игрок с пятью минутами бездействия по счётчику Factorio исключается с сервера. После любого ручного выхода или AFK-исключения начинается отдельный пятиминутный срок для возвращения. Возвращение в этот срок отменяет перенос. Иначе все занятые стопки из основного инвентаря, брони и её сетки, оружия, боеприпасов, мусорных ячеек и курсора без пересоздания предметов переносятся в постоянное доступное тело. При включённых Интерьерах поездов тело создаётся рядом с текущим положением Главного поезда; иначе — в обычной точке появления команды на основной поверхности пещеры. Требуется перезапуск/применение стартовой настройки.
the-cave-darkness-infestation=По умолчанию: Включено. Испытание тьмой, привязанное к игроку. За пределами безопасной зоны 5x5 чанков оставайтесь в пределах 12 клеток от работающей стандартной малой лампы или в пределах 30 клеток от работающего встроенного фонарного столба. После 30 секунд без подходящего источника света рядом с игроком начинают появляться пещерные враги и напрямую атакуют его. Прототипы ламп, графика освещения, рецепты, электрические сети и логика схем не изменяются.






the-cave-integrated-damage-indicator=По умолчанию: ВКЛ. Показывает безопасные для сетевой игры локальные плавающие числа урона. Локальный текст не сохраняется в общем состоянии карты. Отключите для более чистого экрана. Требуется перезапуск и применение стартовой настройки.
the-cave-research-level-difficulty=Стартовая настройка стоимости всех технологий, пока активен The Cave. Средняя — нормальная. Очень легко 0,25x, легко 0,5x, сложно 2x, очень сложно 3x, марафон 6x. Множители применяются напрямую к базовой стоимости и не складываются. Требуется перезапуск и применение стартовой настройки.
the-cave-early-stack-size=По умолчанию: ВКЛ. Требует владения дополнением Space Age, но работает как в обычном Factorio с отключённым модом Space Age, так и в режиме Space Age. Включает пакетный манипулятор с вместимостью стопки 2, уровни вместимости конвейеров 1–18 до итоговой вместимости 20 и выдачу стопок подходящими манипуляторами, погрузчиками и бурами. Все уровни используют только красную, зелёную, синюю, фиолетовую и жёлтую науки. Отключите, чтобы сохранить стандартное поведение активного режима игры. Требуется перезапуск и применение стартовой настройки.
the-cave-mixed-resource-patches=По умолчанию: ВКЛ. При включении используются смешанные месторождения The Cave 2.0 с 10 готовыми смесями. При отключении используются классические месторождения одного ресурса с новыми сбалансированными значениями богатства. Требуется новая карта.
the-cave-ore-patch-missing=По умолчанию: ВЫКЛ. Дополнительный режим испытания. Один базовый тип руды удаляется из естественных месторождений на карте, но раскопка камней вместо этого даёт отсутствующий ресурс. Ресурс выбирается по зерну карты и не объявляется напрямую. Для чистого тестирования требуется новая карта.
the-cave-ore-blood=По умолчанию: ВКЛ. Кусаки и плеваки после смерти оставляют небольшое количество одного случайного базового ресурса. Выпадение монет не меняется. Черви, спавнеры и гнёзда, боссы и другие враги не затрагиваются. Требуется перезапуск и применение стартовой настройки.
the-cave-filter-mining-drills=По умолчанию: ВКЛ. Добавляет кнопку и инструмент выделения для настройки выбранных буров на один тип ресурса. Игроки могут отключить эту стартовую настройку, если фильтрация буров не нужна. При включении категории ресурсов и скрытые варианты буров создаются при запуске. Требуется перезапуск и применение стартовой настройки.
the-cave-chest-filtering=По умолчанию: Включить. Включение добавляет всем совместимым обычным и логистическим сундукам встроенные фильтры слотов предметов, работающие как в грузовом вагоне. Отключение сохраняет исходное поведение обычных сундуков; специальные фильтруемые промышленный контейнер, складской ящик, хранилище и склад остаются фильтруемыми. Для существующих сохранений настройка остаётся включённой, пока пользователь не изменит её вручную. Отключение в уже существующем сохранении может удалить назначенные фильтры слотов обычных сундуков. Требуется перезапуск и применение стартовой настройки.
the-cave-resource-eraser-access=По умолчанию: отключено. Добавляет опасный инструмент выделения, который навсегда удаляет все выбранные ресурсы, включая нефть и ресурсы из других модов. Для сетевой игры рекомендуется режим «Только администраторы». За одно выделение можно удалить не более 10 000 ресурсов. Требуется перезапуск и применение стартовых настроек.
the-cave-underground-belt-reach-research=По умолчанию: включено. Добавляет цепочку из 7 исследований дальности подземных конвейеров для официальных уровней подземных конвейеров. На последнем уровне общий бонус составляет +9 клеток к жёлтым, красным, синим и, при наличии, Turbo-подземным конвейерам. Каждый уровень исследования использует собственную нативную цепочку Планировщика улучшений, а уже установленные подземные конвейеры безопасно синхронизируются с текущим уровнем дальности силы. Чертежи, призраки, роботы и видимые предметы изготовления продолжают использовать официальные уровни конвейеров. Требуется перезапуск и применение стартовой настройки.
the-cave-underground-pipe-reach-research=По умолчанию: включено. Добавляет цепочку из 7 исследований дальности подземных труб. На уровне 0 подземная труба сохраняет стандартную дальность 10 клеток; каждое исследование добавляет +5 клеток, до 45 клеток на уровне 7. Уже установленные трубы автоматически не улучшаются. Q/пипетка, чертежи, призраки и строительные роботы продолжают использовать обычный предмет подземной трубы. Отключите настройку и перезапустите игру, чтобы новые размещения и исследования вернулись к стандартному поведению Factorio.
the-cave-resource-patch-size=Управляет масштабом месторождений The Cave как для смешанных, так и для классических месторождений одного ресурса. Уровень 1 — самый маленький, уровень 8 в восемь раз больше уровня 1. По умолчанию: уровень 2. Игнорируется, когда включён Режим раскопки. Эффект появится в новых неоткрытых или сгенерированных областях либо на новой карте.
the-cave-digging-mode=По умолчанию: Отключено. Отключённый режим сохраняет обычные месторождения The Cave. Хардкор отключает месторождения и даёт 0,5x наград за раскопку. Раскопка I/II/III/IV отключает месторождения и даёт 1x/2x/3x/4x наград. Смешанные месторождения и размер месторождений игнорируются, пока включён Режим раскопки. Нефть не меняется. Крошечные стартовые месторождения создаются рядом с точкой появления только для защиты прогрессии. Требуется новая карта.
the-cave-tnt-boxes=По умолчанию: Включено. Добавляет размещаемые игроком малый, средний и большой ящики TNT размером 2×2 с цепочкой из трёх исследований после Военно-технического исследовательского пакета. Каждый ящик отсчитывает 10 секунд; диаметры взрыва — 20, 30 и 40 клеток. Взрыв удаляет только породы-покрытия The Cave, не выдаёт добытый камень, сохраняет обычные результаты раскопки — ресурсы, врагов, комнаты и особые пещеры — и не наносит урон игрокам, врагам или зданиям. Одновременно во всём мире может находиться не более пяти ящиков. Строительные дроны не могут размещать или убирать их. Эта настройка управляет ящиками TNT во всех режимах игры, включая Обвал пещеры и Наступающий обвал. Требуется перезапуск с применением стартовых настроек.
the-cave-ore-patch-protection=По умолчанию: ВЫКЛ. При включении новые недопустимые здания, размещённые на месторождениях, будут удаляться с возвратом предметов, когда это возможно; недопустимые призраки чертежей также удаляются. Существующие здания не удаляются, но правило применится после их демонтажа и повторной установки. На ресурсах разрешены: буры, сундуки, конвейеры, подземные конвейеры, разделители, электрические столбы, подстанции, рельсы, железнодорожные сигналы, проходные сигналы, остановки, локомотивы, вагоны, автомобили, танки и паучьи машины. Включайте на свой риск.
the-cave-global-difficulty=Общая сложность и баланс сокровищ. Враги: легко 50%, средне 100%, сложно 150%, кошмар 200%. Сокровища: легко 125%, средне 100%, сложно 90%, кошмар 75%.
the-cave-wooden-chest-capacity=Устанавливает количество ячеек деревянного сундука. Допустимый диапазон: от 16 до 28.
the-cave-iron-chest-capacity=Устанавливает количество ячеек железного сундука. Допустимый диапазон: от 32 до 60.
the-cave-steel-chest-capacity=Устанавливает количество ячеек стального сундука. Допустимый диапазон: от 48 до 80.
the-cave-logistic-chest-capacity=Устанавливает количество ячеек логистического сундука. Допустимый диапазон: от 48 до 80.

the-cave-iron-ore-stack-size=Устанавливает размер стопки только для необработанной железной руды. Диапазон: 50–400. По умолчанию: 200. Не влияет на пластины, рецепты, добычу, рынок или экономику.
the-cave-copper-ore-stack-size=Устанавливает размер стопки только для необработанной медной руды. Диапазон: 50–400. По умолчанию: 200. Не влияет на пластины, рецепты, добычу, рынок или экономику.
the-cave-coal-stack-size=Устанавливает размер стопки только для необработанного угля. Диапазон: 50–400. По умолчанию: 200. Не влияет на пластины, рецепты, добычу, рынок или экономику.
the-cave-stone-stack-size=Устанавливает размер стопки только для необработанного камня. Диапазон: 50–400. По умолчанию: 200. Не влияет на кирпичи, рецепты, добычу, рынок или экономику.
the-cave-uranium-ore-stack-size=Устанавливает размер стопки только для необработанной урановой руды. Диапазон: 50–400. По умолчанию: 200. Не влияет на переработку урана, рецепты, добычу, рынок или экономику.
the-cave-scrap-stack-size=Устанавливает размер стопки только для добытого лома The Cave. Диапазон: 50–400. По умолчанию: 200. Не влияет на вероятности сортировки лома, рецепты, добычу, рынок или экономику.
the-cave-calcite-stack-size=Устанавливает размер стопки только для кальцита. Диапазон: 50–400. По умолчанию: 200. Не влияет на рецепты, добычу, трофеи, рынок или экономику.
the-cave-tungsten-ore-stack-size=Устанавливает размер стопки только для вольфрамовой руды. Диапазон: 50–400. По умолчанию: 200. Не влияет на рецепты, добычу, трофеи, рынок или экономику.
the-cave-fulgora-scrap-stack-size=Устанавливает размер стопки только для фульгорского лома Space Age. Диапазон: 50–400. По умолчанию: 200. Полностью независимо от лома The Cave и не влияет на результаты переработки, рецепты, трофеи, рынок или экономику.
the-cave-yumako-stack-size=Устанавливает размер стопки только для юмако. Диапазон: 50–400. По умолчанию: 200. Не влияет на время и результат порчи, топливную ценность, эффекты употребления, рецепты, трофеи, рынок или экономику.
the-cave-jellynut-stack-size=Устанавливает размер стопки только для желейного ореха. Диапазон: 50–400. По умолчанию: 200. Не влияет на время и результат порчи, топливную ценность, эффекты употребления, рецепты, трофеи, рынок или экономику.

the-cave-auto-inventory-repair=По умолчанию: Включено. Автоматически ремонтирует повреждённые размещаемые предметы в инвентаре игрока с помощью ремонтных комплектов. Ремонтные комплекты расходуются обычным образом. Работает с размещаемыми предметами Factorio и модов, у которых есть здоровье объекта.
the-cave-everything-on-nauvis=По умолчанию: Включено.\n\nВКЛ:\nКонтент Space Age интегрирован в прогрессию Наувиса и пещер. Все четыре технологии обнаружения планет завершены для каждой игровой стороны. Космическая наука становится обычным исследованием на 100 единиц с металлургическими, сельскохозяйственными, химическими и электромагнитными исследовательскими пакетами, а её официальный рецепт работает на поверхности пещеры.\n\nНаправления:\nСевер / вверх = Аквило\nЮг / вниз = Глеба\nВосток / вправо = Фульгора\nЗапад / влево = Вулканус\n\nВЫКЛ:\nОбычные обнаружение планет, космическая наука и путешествия Space Age остаются без изменений.\nПланеты остаются на своих обычных местах.
the-cave-base-quality=По умолчанию: 0 (отключено). Значение от 1 до 100 даёт указанный процент базового качества всем сборочным автоматам, печам и добывающим бурам. При включении необычное качество открывается для всех сторон, а отрицательные эффекты качества модулей считаются нулевыми. Требуется официальный мод Quality и перезапуск с применением стартовых настроек.

the-cave-squeak-through=По умолчанию: включено. При запуске уменьшает области столкновений выбранных объектов, позволяя игрокам проходить через узкие промежутки. Отключите и перезапустите игру, чтобы сохранить стандартное поведение столкновений Factorio. Если установлен отдельный мод Squeak Through, встроенная реализация безопасно пропускается.
the-cave-squeak-through-modify-chests=Изменяет области столкновений деревянных, железных, стальных, логистических, связанных, бесконечных и совместимых модифицированных сундуков.
the-cave-squeak-through-modify-circuits=Изменяет области столкновений комбинаторов, ламп, программируемых динамиков, селекторных комбинаторов и выключателей питания.
the-cave-squeak-through-modify-drills=Изменяет области столкновений буров.
the-cave-squeak-through-modify-machines=Изменяет области столкновений сборочных автоматов, печей, лабораторий и ракетных шахт.
the-cave-squeak-through-modify-pipes=Изменяет области столкновений труб, подземных труб, помп, резервуаров, прибрежных насосов, тепловых труб и совместимых жидкостных объектов.
the-cave-squeak-through-modify-solar=Изменяет области столкновений солнечных панелей, аккумуляторов и интерфейсов электроэнергии.
the-cave-squeak-through-modify-steam=Изменяет области столкновений бойлеров, генераторов, реакторов и твердотопливных генераторов.
the-cave-squeak-through-modify-trees=Изменяет области столкновений деревьев.
the-cave-squeak-through-modify-turrets=Изменяет области столкновений огнестрельных, электрических, жидкостных и артиллерийских турелей.
the-cave-squeak-through-modify-misc=Изменяет области столкновений маяков, опор ЛЭП, манипуляторов, радаров, дронстанций и железнодорожных станций.
the-cave-squeak-through-blacklist-types=Типы прототипов объектов через запятую, которые никогда не следует изменять. Пример: tree, inserter, electric-pole
the-cave-squeak-through-blacklist-names=Точные названия прототипов объектов через запятую, которые никогда не следует изменять. Пример: fast-inserter, small-electric-pole
the-cave-squeak-through-remove-collision=Расширенная настройка. Удаляет все слои столкновений, общие с игроком, у объектов из двух списков ниже. Это может изменить движение врагов, поэтому используйте осторожно.
the-cave-squeak-through-remove-collision-types=Типы прототипов объектов через запятую, у которых следует удалить столкновение с игроком. По умолчанию: tree
the-cave-squeak-through-remove-collision-names=Точные названия прототипов объектов через запятую, у которых следует удалить столкновение с игроком. Цепочки улучшений и ухудшений изменяются вместе.
the-cave-lamp-post=Добавляет встроенный фонарный столб широкого освещения, его рецепт и технологию.
the-cave-electric-furnaces-stone-steel=Добавляет электрические версии каменной и стальной печей.
the-cave-electric-furnaces-advanced=Добавляет электрические печи 2-го и 3-го уровней с повышенной скоростью производства.
the-cave-electric-furnaces-boiler=Добавляет электрический котёл, нагревающий жидкости с помощью электричества.
the-cave-electric-furnaces-distinct-icons=Добавляет молнию на значки каменной и стальной электрических печей, чтобы их было легче отличать.

the-cave-faster-start=Один раз выдаёт каждому игроку компактную модульную броню с портативным реактором мощностью 250 кВт, персональным робопортом, двумя стандартными персональными аккумуляторами и экзоскелетом с бонусом скорости 30%, а также 50 автономными строительными дронами. Ночное видение не выдаётся.
the-cave-starter-pack=По умолчанию: Средний. Один раз выдаёт каждому новому игроку сбалансированный стартовый набор в инвентарь. Отключено ничего не выдаёт; Малый, Средний, Большой и Ленивый последовательно увеличивают количество всех включённых предметов. Настройка независима от Faster Start и не повторяется после переподключения, смерти или возрождения. Переработчик и модуль качества выдаются только при активном Space Age. Требуется перезапуск/применение стартовой настройки.
the-cave-train-wave-small-coin-drop=Точное количество монет за каждого малого кусака или плеваки волны поезда. По умолчанию: 2. Значение 0 отключает награду. Изменение действует со следующей смерти врага без перезапуска.
the-cave-train-wave-small-resource-drop=Точное количество одного случайного базового ресурса за каждого малого кусака или плеваки волны поезда: железная руда, медная руда, уголь или камень. По умолчанию: 0. Значение 0 отключает награду.
the-cave-train-wave-medium-coin-drop=Точное количество монет за каждого среднего кусака или плеваки волны поезда. По умолчанию: 3. Значение 0 отключает награду. Изменение действует со следующей смерти врага без перезапуска.
the-cave-train-wave-medium-resource-drop=Точное количество одного случайного базового ресурса за каждого среднего кусака или плеваки волны поезда: железная руда, медная руда, уголь или камень. По умолчанию: 0. Значение 0 отключает награду.
the-cave-train-wave-big-coin-drop=Точное количество монет за каждого большого кусака или плеваки волны поезда. По умолчанию: 4. Значение 0 отключает награду. Изменение действует со следующей смерти врага без перезапуска.
the-cave-train-wave-big-resource-drop=Точное количество одного случайного базового ресурса за каждого большого кусака или плеваки волны поезда: железная руда, медная руда, уголь или камень. По умолчанию: 0. Значение 0 отключает награду.
the-cave-train-wave-behemoth-coin-drop=Точное количество монет за каждого чудовищного кусака или плеваку волны поезда. По умолчанию: 6. Значение 0 отключает награду. Изменение действует со следующей смерти врага без перезапуска.
the-cave-train-wave-behemoth-resource-drop=Точное количество одного случайного базового ресурса за каждого чудовищного кусака или плеваку волны поезда: железная руда, медная руда, уголь или камень. По умолчанию: 0. Значение 0 отключает награду.
the-cave-train-wave-boss-coin-drop=Точное количество монет за каждого текущего или старого босса волны поезда. По умолчанию: 6. Значение 0 отключает награду. Изменение действует со следующей смерти босса без перезапуска.
the-cave-train-wave-boss-resource-drop=Точное количество одного случайного базового ресурса за каждого текущего или старого босса волны поезда: железная руда, медная руда, уголь или камень. По умолчанию: 0. Значение 0 отключает награду.
