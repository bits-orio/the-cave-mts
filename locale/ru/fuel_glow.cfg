[mod-setting-name]
the-cave-fuel-glow=FuelGlow
the-cave-fuel-glow-peak-fuel-value=Верхнее значение энергии FuelGlow
the-cave-fuel-glow-floor-fuel-value=Нижнее значение энергии FuelGlow
the-cave-fuel-glow-color-curve=Кривая цвета FuelGlow
the-cave-fuel-glow-lock-vanilla-fuels=Цвета стандартного топлива FuelGlow
the-cave-fuel-glow-electric-furnace-light=Подсветка электрической печи FuelGlow

[mod-setting-description]
the-cave-fuel-glow=По умолчанию: включено. Применяет зависящие от топлива цвета свечения к топливным устройствам и реакторам. Автоматически поддерживает совместимое топливо из других модов. При установке отдельного мода FuelGlow приоритет получает он. Требуется перезапуск.
the-cave-fuel-glow-peak-fuel-value=Энергия холодного синего края автоматического диапазона цветов. Используйте значение в джоулях, например 1.21GJ. При ошибке безопасно используется значение по умолчанию. Требуется перезапуск.
the-cave-fuel-glow-floor-fuel-value=Энергия тёплого красного края автоматического диапазона цветов. Используйте значение в джоулях, например 2MJ. Оно должно быть меньше верхнего значения. Требуется перезапуск.
the-cave-fuel-glow-color-curve=Изменяет форму автоматического перехода от тёплых цветов к холодным. По умолчанию: 2. Требуется перезапуск.
the-cave-fuel-glow-lock-vanilla-fuels=По умолчанию: включено. Применяет настроенные цвета к древесине, углю, твёрдому и ракетному топливу, урановым топливным элементам и ядерному топливу. Требуется перезапуск.
the-cave-fuel-glow-electric-furnace-light=По умолчанию: включено. Добавляет стандартной электрической печи мягкую оранжевую подсветку во время работы. Требуется перезапуск.

