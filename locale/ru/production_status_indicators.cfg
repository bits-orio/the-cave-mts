[mod-setting-name]
the-cave-production-status-indicators=Индикаторы состояния производства

[mod-setting-description]
the-cave-production-status-indicators=По умолчанию: включено. Добавляет индикаторы с фиксированными цветами на сборочные автоматы, печи, ракетные шахты и буры. Зелёный означает работу, жёлтый — заполненный выход, оранжевый — недостаток энергии, красный — остановку или блокировку. Использует встроенную графическую систему Factorio без опроса во время игры. Требуется перезапуск.

[string-mod-setting]
the-cave-production-status-indicators-enabled=Включить
the-cave-production-status-indicators-disabled=Отключить
