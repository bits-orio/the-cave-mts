[mod-setting-description]
damage-indicator-font-family=Podstawowa czcionka używana do utworzenia własnej czcionki wskaźnika obrażeń.
damage-indicator-font-size=Rozmiar w pikselach używany do utworzenia własnej czcionki wskaźnika obrażeń.
damage-indicator-enabled=Gdy włączone, liczby obrażeń pojawiają się przy uszkodzonych obiektach.
damage-indicator-visibility=W pobliżu pokazuje wszystkie pobliskie obrażenia. Własne siły pokazuje obrażenia z udziałem twoich sił. Tylko wychodzące pokazuje obrażenia zadawane przez twoje siły innym siłom.
damage-indicator-radius=Pokazuje wskaźniki tylko w tej odległości od gracza, w kaflach.
damage-indicator-minimum-damage=Ignoruje nowe wskaźniki obrażeń poniżej tej wartości. Istniejące połączone wskaźniki nadal zbierają mniejsze kolejne trafienia.
damage-indicator-scale=Mnoży rozmiar tekstu obrażeń.
damage-indicator-lifetime=Podstawowy czas trwania animacji w tickach. Ciągłe obrażenia utrzymują wskaźnik; po ustaniu obrażeń wartość ta wpływa też na czas zanikania.
damage-indicator-animation-speed=Mnoży prędkość animacji. Wyższe wartości kończą animację szybciej, niższe pozostawiają ją dłużej.
damage-indicator-combine-ticks=Po uszkodzeniu obiektu kolejne obrażenia w tej liczbie ticków są łączone z tym samym wskaźnikiem zamiast tworzyć nowy komunikat.
damage-indicator-text-update-interval=Widoczny tekst obrażeń jest odświeżany najwyżej raz na tę liczbę ticków podczas łączenia obrażeń.
damage-indicator-max-active=Stare wskaźniki są usuwane, gdy aktywna jest ta liczba wskaźników.
damage-indicator-group-similar-distance=Pobliskie uszkodzone budynki 1x1 o tej samej nazwie wewnętrznej współdzielą jeden uśredniony wskaźnik obrażeń w tej odległości, w kaflach. Ustaw 0, aby wyłączyć grupowanie.
damage-indicator-whitelist-entity-types=Lista typów obiektów rozdzielonych przecinkami (np. "asteroid, turret, rail"), które zawsze mogą być grupowane, nawet jeśli są większe niż 1x1. Pozostaw puste, aby całkowicie wyłączyć listę dozwolonych.
damage-indicator-whitelist-distance-bonus=Dodatkowe kafle dodawane do odległości grupowania podobnych przy grupowaniu dozwolonych typów obiektów. Pozwala dozwolonym obiektom, takim jak dryfujące asteroidy, łączyć się przez większe odstępy niż zwykłe budynki.
damage-indicator-blacklist-entity-names=Lista nazw obiektów rozdzielonych przecinkami, które nigdy nie powinny wyświetlać wskaźników obrażeń (np. "small-biter, big-metallic-asteroid"). Obsługuje symbole wieloznaczne na początku lub końcu: "*-asteroid" pasuje do każdej nazwy kończącej się na "-asteroid", a "pipe-*" do każdej nazwy zaczynającej się od "pipe-". Pozostaw puste, aby wyłączyć listę blokowanych (brak wpływu na wydajność, gdy pusta).
damage-indicator-show-group-count=Pokazuje zgrupowane etykiety z liczbą i zlokalizowaną nazwą zgrupowanych obiektów, np. [7x Wall]. Wyłącz, aby pokazywać tylko tekst obrażeń.
damage-indicator-shadow-style=Kontroluje czytelność względem wydajności. Lekki używa trzech obiektów tekstu cienia na wskaźnik, ciężki używa pięciu, a wyłączony używa tylko kolorowego tekstu.
damage-indicator-font=Prototyp czcionki używany do renderowanego tekstu obrażeń. Opcja własna używa ustawień rodziny i rozmiaru własnej czcionki.
damage-indicator-compact-numbers=Gdy włączone, duże wartości obrażeń używają zapisu k/m/b, np. 1.0k, 10.0m i 1.00b. Gdy wyłączone, duże wartości używają pełnych liczb z wybranym separatorem.
damage-indicator-number-separator=Separator używany w pełnych liczbach obrażeń, gdy skrócone liczby obrażeń są wyłączone.
damage-indicator-text-template=Tekst renderowany dla każdego wskaźnika. Użyj __damage__ w miejscu, w którym ma pojawić się sformatowana liczba obrażeń. Użyj __reduced__, aby ręcznie umieścić zmniejszone obrażenia.
damage-indicator-show-reductions=Pokazuje obrażenia zablokowane przez Stable Foundations: 50 (-50).
damage-indicator-drift-style=Od strzelającego przesuwa liczby z dala od źródła obrażeń. W górę zachowuje klasyczny unoszący się tekst. Mieszany łączy oba style.
damage-indicator-drift-distance=Odległość, na jaką wskaźnik przesuwa się w czasie swojego trwania, w kaflach.
damage-indicator-color-mode=Kolory typów obrażeń używają kolorów inspirowanych źródłem dla każdego typu obrażeń. Skala obrażeń ignoruje typ obrażeń i koloruje według wartości od jasnożółtego do ciemnoczerwonego.
damage-indicator-blend-damage-type-colors=Gdy włączone, połączone wskaźniki obrażeń używają mieszanki kolorów typów obrażeń ważonej zadanymi obrażeniami zamiast zachowywać kolor pierwszego trafienia. Dotyczy tylko trybu kolorów typu obrażeń.
damage-indicator-color-physical=Kolor RGB używany dla wskaźników obrażeń fizycznych.
damage-indicator-color-impact=Kolor RGB używany dla wskaźników obrażeń od uderzenia.
damage-indicator-color-explosion=Kolor RGB używany dla wskaźników obrażeń od wybuchu.
damage-indicator-color-fire=Kolor RGB używany dla wskaźników obrażeń od ognia.
damage-indicator-color-laser=Kolor RGB używany dla wskaźników obrażeń laserowych.
damage-indicator-color-electric=Kolor RGB używany dla wskaźników obrażeń elektrycznych.
damage-indicator-color-acid=Kolor RGB używany dla wskaźników obrażeń od kwasu.
damage-indicator-color-poison=Kolor RGB używany dla wskaźników obrażeń od trucizny.
damage-indicator-color-intensity=Gdy włączone, niskie obrażenia są nieco jaśniejsze i mniej nasycone, a wysokie obrażenia nieco głębsze i bardziej nasycone, przy zachowaniu koloru typu obrażeń.
damage-indicator-color-intensity-cap=Obrażenia równe tej wartości lub wyższe osiągają maksymalną intensywność koloru albo maksymalny kolor skali.
damage-indicator-viewport-culling=Pomija tworzenie wskaźników znajdujących się poza szacowanym widokiem ekranu każdego uprawnionego gracza.
damage-indicator-viewport-margin=Dodatkowe kafle dodawane wokół szacowanego widoku ekranu, aby wskaźniki przy krawędzi ekranu nie były odrzucane zbyt agresywnie.
damage-indicator-killing-blow=Dodaje znacznik (domyślnie !) do liczby obrażeń, która zadała śmiertelny cios, oraz subtelne podkreślenie, aby końcowe trafienie było wyraźniejsze.
damage-indicator-killing-blow-marker=Przyrostek dodawany do liczby obrażeń przy śmiertelnym ciosie. Pozostaw puste, aby wyłączyć przyrostek, zachowując podkreślenie.
damage-indicator-alt-mode=Wyświetla wskaźniki obrażeń tylko w trybie ALT.
damage-indicator-debug-info=Do celów debugowania pokazuje wewnętrzny stan wskaźnika obrażeń.
damage-indicator-group-name-normalize=Grupuje podobne warianty obiektów, takie jak przeciwnicy z Rampant. Wzorce Lua rozdzielone przecinkami, każdy z jedną grupą przechwytywania `(...)`, która wyodrębnia nazwę bazową z wewnętrznej nazwy poziomu lub wersji.
damage-indicator-saturation-threshold=Liczba wskaźników obrażeń, które mogą być wyświetlane dla tego samego typu obiektu, zanim zostaną zgrupowane w jeden wskaźnik.
damage-indicator-server-override-string=Nadpisuje ustawienia wskaźnika obrażeń użytkownika podanymi ustawieniami startowymi. Przydatne na serwerach do wymuszenia spójnych wskaźników obrażeń. Wygeneruj ciąg w grze poleceniem [color=#FFE6C0]/damage-indicators-override[/color]. [font=default-bold]Pozostaw puste, aby wyłączyć[/font].

