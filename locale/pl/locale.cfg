[command-help]
damage-indicators-clear=Czyści wszystkie aktywne wskaźniki obrażeń w grze.
damage-indicators-override=Otwiera okno z zakodowanym ciągiem bieżących ustawień wskaźnika obrażeń przypisanych do gracza. Administratorzy mogą wkleić go do ustawienia startowego "Ciąg ustawień wymuszanych przez serwer", aby wymusić jednolite wyświetlanie wskaźników dla wszystkich graczy.

[gui-damage-indicator]
settings-string-title=Ustawienia wymuszenia wskaźnika obrażeń
settings-string-help=Skopiuj i wklej ten ciąg do ustawienia [font=default-bold][color=#FFE6C0]Startowe[/color][/font] → [font=default-bold]Ciąg ustawień wymuszanych przez serwer[/font] w ustawieniach modów w menu głównym, aby nadpisać ustawienia wskaźnika obrażeń użytkownika w grze. Używa to bieżących ustawień wskaźnika obrażeń przypisanych do gracza; możesz ponownie uruchomić polecenie [color=#FFE6C0]/damage-indicators-override[/color], aby zaktualizować ciąg po zmianie ustawień wskaźnika.
settings-string-close=Zamknij

[damage-indicator-message]
server-override-active=[font=default-dialog-button][[color=#FFE6C0]Wskaźnik obrażeń[/color]][/font] Ustawienia wyświetlania przypisane do gracza (oprócz "Pokaż wskaźniki obrażeń") zostaną nadpisane przez serwer.
server-override-decode-failed=[color=red]Ciąg wymuszenia serwera jest nieprawidłowy[/color]: wartość w ustawieniu "Ciąg ustawień wymuszanych przez serwer" nie jest prawidłowym zakodowanym ciągiem ustawień. Wyczyść ją i wygeneruj nową poleceniem [color=#FFE6C0]/damage-indicators-override[/color], a następnie wklej dokładny wynik do ustawienia startowego.\n\n[font=default-bold]To problem ustawień startowych; sprawdź ustawienia modów w menu głównym.[/font]\n
server-override-json-failed=[color=red]Ciąg wymuszenia serwera jest uszkodzony[/color]: dekodowanie się powiodło, ale zawarte dane nie są prawidłowym JSON-em. Ciąg prawdopodobnie został ucięty lub częściowo nadpisany; wygeneruj nowy poleceniem [color=#FFE6C0]/damage-indicators-override[/color].\n\n[font=default-bold]To problem ustawień startowych; sprawdź ustawienia modów w menu głównym.[/font]\n
server-override-shape-failed=[color=red]Ciąg wymuszenia serwera ma nieprawidłowy format[/color]: zdekodowane dane nie odpowiadają oczekiwanemu układowi ustawień. Zwykle oznacza to, że wklejono schemat lub inny niepowiązany zakodowany ciąg. Wygeneruj nowy poleceniem [color=#FFE6C0]/damage-indicators-override[/color].\n\n[font=default-bold]To problem ustawień startowych; sprawdź ustawienia modów w menu głównym.[/font]\n
setting-overridden=[font=default-dialog-button][[color=#FFE6C0]Wskaźnik obrażeń[/color]][/font] Zmiany ustawienia "__1__" zostaną nadpisane przez serwer.

