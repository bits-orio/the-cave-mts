[technology-description]
the-cave-underground-belt-reach=Zwiększa maksymalny zasięg wszystkich oficjalnych podziemnych taśmociągów o +__1__ pole(a) na tym poziomie. Łączna premia do zasięgu: +__2__ pól.

[technology-effect]
the-cave-underground-belt-reach=Zasięg podziemnych taśmociągów: +__1__ pole(a) na tym poziomie (łącznie +__2__)
