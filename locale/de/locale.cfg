[mod-setting-description]
damage-indicator-font-family=Basisschrift, mit der die benutzerdefinierte Schrift der Schadensanzeige erstellt wird.
damage-indicator-font-size=Pixelgröße, mit der die benutzerdefinierte Schrift der Schadensanzeige erstellt wird.
damage-indicator-enabled=Wenn aktiviert, erscheinen Schadenszahlen in der Nähe beschädigter Objekte.
damage-indicator-visibility=In der Nähe zeigt allen Schaden in der Umgebung. Eigene Streitkraft zeigt Schaden mit Beteiligung deiner Streitkraft. Nur ausgehend zeigt Schaden, den deine Streitkraft anderen Streitkräften zufügt.
damage-indicator-radius=Zeigt Anzeigen nur innerhalb dieser Entfernung zu deinem Spieler an, in Kacheln.
damage-indicator-minimum-damage=Ignoriert neue Schadensanzeigen unterhalb dieses Werts. Bereits kombinierte Anzeigen sammeln kleinere Folgetreffer weiter.
damage-indicator-scale=Multipliziert die Größe des Schadenstextes.
damage-indicator-lifetime=Grunddauer der Animation in Ticks. Fortlaufender Schaden hält eine Anzeige aktiv; nachdem der Schaden endet, beeinflusst dieser Wert auch die Ausblenddauer.
damage-indicator-animation-speed=Multipliziert die Animationsgeschwindigkeit. Höhere Werte enden schneller, niedrigere Werte bleiben länger sichtbar.
damage-indicator-combine-ticks=Nachdem ein Objekt beschädigt wurde, wird weiterer Schaden innerhalb dieser Anzahl von Ticks mit derselben Anzeige kombiniert, statt eine neue Anzeige zu erzeugen.
damage-indicator-text-update-interval=Sichtbarer Schadenstext wird während des Kombinierens von Schaden höchstens einmal pro diese Anzahl von Ticks aktualisiert.
damage-indicator-max-active=Alte Anzeigen werden entfernt, wenn diese Anzahl aktiv ist.
damage-indicator-group-similar-distance=Nahe beschädigte 1x1-Gebäude mit demselben internen Namen teilen sich innerhalb dieser Distanz in Kacheln eine gemittelte Schadensanzeige. Auf 0 setzen, um Gruppierung zu deaktivieren.
damage-indicator-whitelist-entity-types=Durch Kommas getrennte Liste von Objekttypen (z. B. "asteroid, turret, rail"), die immer gruppierbar sind, auch wenn sie größer als 1x1 sind. Leer lassen, um die Zulassungsliste vollständig zu deaktivieren.
damage-indicator-whitelist-distance-bonus=Zusätzliche Kacheln, die beim Gruppieren zugelassener Objekttypen zur Distanz für ähnliche Objekte addiert werden. Ermöglicht zugelassenen Objekten wie driftenden Asteroiden, über größere Abstände hinweg zusammengeführt zu werden als normale Gebäude.
damage-indicator-blacklist-entity-names=Durch Kommas getrennte Liste von Objektnamen, die niemals Schadensanzeigen anzeigen sollen (z. B. "small-biter, big-metallic-asteroid"). Unterstützt Platzhalter am Anfang oder Ende: "*-asteroid" passt auf alle Namen, die mit "-asteroid" enden, "pipe-*" auf alle Namen, die mit "pipe-" beginnen. Leer lassen, um die Blockierliste zu deaktivieren (keine Leistungsauswirkung, wenn leer).
damage-indicator-show-group-count=Zeigt gruppierte Beschriftungen mit Anzahl und lokalisiertem Namen der gruppierten Objekte an, z. B. [7x Wall]. Deaktivieren, um nur den Schadenstext anzuzeigen.
damage-indicator-shadow-style=Steuert Lesbarkeit gegenüber Leistung. Leicht nutzt drei Schatten-Textobjekte pro Anzeige, stark nutzt fünf, aus nutzt nur den farbigen Text.
damage-indicator-font=Schriftprototyp für gerenderten Schadenstext. Die benutzerdefinierte Option verwendet die Einstellungen für benutzerdefinierte Schriftfamilie und Schriftgröße.
damage-indicator-compact-numbers=Wenn aktiviert, verwenden große Schadenswerte die Schreibweise k/m/b, z. B. 1.0k, 10.0m und 1.00b. Wenn deaktiviert, verwenden große Werte vollständige Zahlen mit dem ausgewählten Zahlentrennzeichen.
damage-indicator-number-separator=Trennzeichen für vollständige Schadenszahlen, wenn kompakte Schadenszahlen deaktiviert sind.
damage-indicator-text-template=Text, der für jede Anzeige gerendert wird. Verwende __damage__ an der Stelle, an der die formatierte Schadenszahl erscheinen soll. Verwende __reduced__, um reduzierten Schaden manuell zu platzieren.
damage-indicator-show-reductions=Zeigt den von Stable Foundations verhinderten Schaden an: 50 (-50).
damage-indicator-drift-style=Vom Schützen weg bewegt Zahlen von der Schadensquelle weg. Aufwärts behält den klassischen schwebenden Text bei. Gemischt kombiniert beides.
damage-indicator-drift-distance=Distanz, über die sich die Anzeige während ihrer Lebensdauer bewegt, in Kacheln.
damage-indicator-color-mode=Schadenstypfarben verwenden quellinspirierte Farben je Schadenstyp. Schadensverlauf ignoriert den Schadenstyp und färbt nach Menge von hellgelb bis dunkelrot.
damage-indicator-blend-damage-type-colors=Wenn aktiviert, verwenden kombinierte Schadensanzeigen eine nach Schaden gewichtete Mischung der beteiligten Schadenstypfarben, statt die Farbe des ersten Treffers beizubehalten. Gilt nur für den Farbmodus Schadenstyp.
damage-indicator-color-physical=RGB-Farbe für Anzeigen physischen Schadens.
damage-indicator-color-impact=RGB-Farbe für Anzeigen von Aufprallschaden.
damage-indicator-color-explosion=RGB-Farbe für Anzeigen von Explosionsschaden.
damage-indicator-color-fire=RGB-Farbe für Anzeigen von Feuerschaden.
damage-indicator-color-laser=RGB-Farbe für Anzeigen von Laserschaden.
damage-indicator-color-electric=RGB-Farbe für Anzeigen von Elektroschaden.
damage-indicator-color-acid=RGB-Farbe für Anzeigen von Säureschaden.
damage-indicator-color-poison=RGB-Farbe für Anzeigen von Giftschaden.
damage-indicator-color-intensity=Wenn aktiviert, erscheint niedriger Schaden etwas heller und weniger gesättigt, hoher Schaden etwas kräftiger und stärker gesättigt, während die Schadenstypfarbe erhalten bleibt.
damage-indicator-color-intensity-cap=Schaden ab dieser Menge erreicht die maximale Farbintensität oder die maximale Verlaufsfarbe.
damage-indicator-viewport-culling=Überspringt das Erstellen von Anzeigen, die außerhalb der geschätzten Bildschirmansicht jedes berechtigten Spielers liegen.
damage-indicator-viewport-margin=Zusätzliche Kacheln um die geschätzte Bildschirmansicht, damit Anzeigen am Bildschirmrand nicht zu aggressiv ausgeblendet werden.
damage-indicator-killing-blow=Hängt eine Markierung (standardmäßig !) an die Schadenszahl an, die den Todesstoß verursacht hat, und fügt eine dezente Betonung hinzu, damit der letzte Treffer auffällt.
damage-indicator-killing-blow-marker=Suffix, das bei einem Todesstoß an die Schadenszahl angehängt wird. Leer lassen, um das Suffix zu deaktivieren, aber die Betonung beizubehalten.
damage-indicator-alt-mode=Zeigt Schadensanzeigen nur im Alt-Modus an.
damage-indicator-debug-info=Zeigt zu Debugging-Zwecken den internen Zustand der Schadensanzeige an.
damage-indicator-group-name-normalize=Gruppiert ähnliche Objektvarianten, zum Beispiel Gegner aus Rampant. Durch Kommas getrennte Lua-Muster, jeweils mit einer Erfassungsgruppe `(...)`, die den Basisnamen aus einem gestuften oder versionierten internen Namen extrahiert.
damage-indicator-saturation-threshold=Anzahl der Schadensanzeigen, die vom selben Objekttyp angezeigt werden können, bevor sie zu einer einzelnen Anzeige gruppiert werden.
damage-indicator-server-override-string=Überschreibt Benutzereinstellungen der Schadensanzeige mit den angegebenen Starteinstellungen. Nützlich für Server, um einheitliche Schadensanzeigen zu erzwingen. Erzeuge im Spiel eine Zeichenfolge mit [color=#FFE6C0]/damage-indicators-override[/color]. [font=default-bold]Leer lassen, um zu deaktivieren[/font].

