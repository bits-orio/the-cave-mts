[command-help]
damage-indicators-clear=Entfernt alle aktiven Schadensanzeigen im Spiel.
damage-indicators-override=Öffnet einen Dialog mit einer codierten Zeichenfolge deiner aktuellen spielerbezogenen Schadensanzeige-Einstellungen. Administratoren können diese in die Starteinstellung "Serverseitige Überschreibungszeichenfolge" einfügen, um eine einheitliche Anzeige für alle Spieler zu erzwingen.

[gui-damage-indicator]
settings-string-title=Überschreibungseinstellungen der Schadensanzeige
settings-string-help=Kopiere diese Zeichenfolge in die [font=default-bold][color=#FFE6C0]Start[/color][/font]-Einstellung → [font=default-bold]Serverseitige Überschreibungszeichenfolge[/font] in den Mod-Einstellungen des Hauptmenüs, um spielerbezogene Schadensanzeige-Einstellungen im Spiel zu überschreiben. Dies verwendet deine aktuellen spielerbezogenen Schadensanzeige-Einstellungen; du kannst den Befehl [color=#FFE6C0]/damage-indicators-override[/color] erneut ausführen, um die Zeichenfolge zu aktualisieren, wenn du deine Anzeige-Einstellungen änderst.
settings-string-close=Schließen

[damage-indicator-message]
server-override-active=[font=default-dialog-button][[color=#FFE6C0]Schadensanzeige[/color]][/font] Spielerbezogene Anzeigeeinstellungen (außer "Schadensanzeigen anzeigen") werden vom Server überschrieben.
server-override-decode-failed=[color=red]Die serverseitige Überschreibungszeichenfolge ist ungültig[/color]: Der Wert in "Serverseitige Überschreibungszeichenfolge" ist keine gültige codierte Einstellungszeichenfolge. Leere sie, erzeuge mit [color=#FFE6C0]/damage-indicators-override[/color] eine neue und füge die exakte Ausgabe in die Starteinstellung ein.\n\n[font=default-bold]Dies ist ein Problem der Starteinstellungen; überprüfe deine Mod-Einstellungen im Hauptmenü.[/font]\n
server-override-json-failed=[color=red]Die serverseitige Überschreibungszeichenfolge ist beschädigt[/color]: Sie wurde erfolgreich decodiert, aber die enthaltenen Daten sind kein gültiges JSON. Die Zeichenfolge wurde wahrscheinlich gekürzt oder teilweise überschrieben; erzeuge mit [color=#FFE6C0]/damage-indicators-override[/color] eine neue.\n\n[font=default-bold]Dies ist ein Problem der Starteinstellungen; überprüfe deine Mod-Einstellungen im Hauptmenü.[/font]\n
server-override-shape-failed=[color=red]Die serverseitige Überschreibungszeichenfolge hat das falsche Format[/color]: Die decodierten Daten entsprechen nicht der erwarteten Einstellungsstruktur. Das bedeutet normalerweise, dass ein Bauplan oder eine andere unpassende codierte Zeichenfolge eingefügt wurde. Erzeuge mit [color=#FFE6C0]/damage-indicators-override[/color] eine neue.\n\n[font=default-bold]Dies ist ein Problem der Starteinstellungen; überprüfe deine Mod-Einstellungen im Hauptmenü.[/font]\n
setting-overridden=[font=default-dialog-button][[color=#FFE6C0]Schadensanzeige[/color]][/font] Änderungen an "__1__" werden vom Server überschrieben.

