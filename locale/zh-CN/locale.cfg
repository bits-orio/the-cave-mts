[mod-setting-description]
damage-indicator-font-family=用于创建自定义伤害指示器字体的基础字体。
damage-indicator-font-size=用于创建自定义伤害指示器字体的像素大小。
damage-indicator-enabled=启用时，伤害数字会显示在受伤实体附近。
damage-indicator-visibility=“附近”显示所有邻近伤害。“己方势力”显示涉及己方势力的伤害。“仅造成的伤害”只显示己方势力对其他势力造成的伤害。
damage-indicator-radius=仅在距离玩家这么多个方格内显示指示器。
damage-indicator-minimum-damage=忽略低于此数值的新伤害指示器。已存在的合并指示器会继续累积更小的后续伤害。
damage-indicator-scale=将伤害文本的大小乘以该倍数。
damage-indicator-lifetime=动画基础持续时间，以游戏刻为单位。持续伤害会使指示器保持活跃；伤害停止后，该值也会影响淡出持续时间。
damage-indicator-animation-speed=动画速度倍率。数值越高，动画结束越快；数值越低，停留越久。
damage-indicator-combine-ticks=实体受到伤害后，在此游戏刻数内受到的后续伤害会合并到同一个指示器中，而不是生成新的弹出数字。
damage-indicator-text-update-interval=在伤害合并期间，可见的伤害文本最多每隔这么多游戏刻刷新一次。
damage-indicator-max-active=活跃指示器数量达到此上限时，会移除最早的指示器。
damage-indicator-group-similar-distance=拥有相同内部名称的相邻 1x1 建筑，若相互距离在这么多个方格内，会共用一个取平均值后的伤害指示器。设为 0 可禁用分组。
damage-indicator-whitelist-entity-types=用英文逗号分隔的实体类型列表（例如 "asteroid, turret, rail"），这些类型即使大于 1x1，也始终视为可分组。留空可完全禁用白名单。
damage-indicator-whitelist-distance-bonus=分组白名单实体类型时，额外添加到同类分组距离上的方格数。让白名单实体（如漂移的小行星）能在比普通建筑更远的距离上合并。
damage-indicator-blacklist-entity-names=用英文逗号分隔的实体名称列表，这些实体永远不会显示伤害指示器（例如 "small-biter, big-metallic-asteroid"）。支持前导或尾随通配符："*-asteroid" 匹配所有以 "-asteroid" 结尾的名称，"pipe-*" 匹配所有以 "pipe-" 开头的名称。留空禁用黑名单（为空时性能开销为零）。
damage-indicator-show-group-count=显示分组标签，包含已分组实体的数量和本地化名称，例如 [7x 墙体]。禁用则只显示伤害文本。
damage-indicator-shadow-style=控制可读性与性能的平衡。轻量每个指示器使用三个阴影文本对象；重度使用五个；关闭只使用纯色文本。
damage-indicator-font=用于显示伤害文本的字体原型。自定义选项使用自定义字体系列和字号设置。
damage-indicator-compact-numbers=启用后，较大的伤害值会使用千、百万、十亿记数法，如 1.0k、10.0m 和 1.00b。禁用后，较大的数值使用完整数字，并采用选定的数字分隔符。
damage-indicator-number-separator=禁用“缩写伤害数字”时，用于完整伤害数字的分隔符。
damage-indicator-text-template=为每个指示器渲染的文本。在需要显示格式化伤害数字的位置使用 __damage__。使用 __reduced__ 手动放置减免后的伤害。
damage-indicator-show-reductions=显示 Stable Foundations 减免的伤害，例如 50 (-50)。
damage-indicator-drift-style=“远离攻击者”让数字向伤害来源的反方向移动。“向上”保留经典的浮动文本。“混合”则两者兼有。
damage-indicator-drift-distance=指示器在其生命周期内漂移的距离，以方格为单位。
damage-indicator-color-mode=“伤害类型”根据伤害类型使用对应的主题颜色。“伤害渐变”忽略伤害类型，根据伤害值从浅黄色渐变到深红色。
damage-indicator-blend-damage-type-colors=启用后，合并后的伤害指示器会根据各伤害类型贡献的伤害值，将它们的颜色进行加权混合，而非保留首次命中的颜色。仅在“伤害类型”颜色模式下生效。
damage-indicator-color-physical=用于物理伤害指示器的 RGB 颜色。
damage-indicator-color-impact=用于冲击伤害指示器的 RGB 颜色。
damage-indicator-color-explosion=用于爆炸伤害指示器的 RGB 颜色。
damage-indicator-color-fire=用于火焰伤害指示器的 RGB 颜色。
damage-indicator-color-laser=用于激光伤害指示器的 RGB 颜色。
damage-indicator-color-electric=用于电击伤害指示器的 RGB 颜色。
damage-indicator-color-acid=用于酸蚀伤害指示器的 RGB 颜色。
damage-indicator-color-poison=用于毒素伤害指示器的 RGB 颜色。
damage-indicator-color-intensity=启用后，低伤害数字会显得略微偏亮/减淡，高伤害数字会略微偏深/更饱和，同时保留伤害类型颜色。
damage-indicator-color-intensity-cap=伤害值达到或超过该数值时，达到最大颜色强度或最大渐变颜色。
damage-indicator-viewport-culling=跳过创建位于所有有效玩家预估屏幕视野之外的指示器。
damage-indicator-viewport-margin=在预估屏幕视野周围额外添加的方格数，避免屏幕边缘的指示器过早被剔除。
damage-indicator-killing-blow=在造成致命一击的伤害数字后追加一个标记（默认为 !），并添加微弱的强调脉冲，使最后一击更加醒目。
damage-indicator-killing-blow-marker=致命一击时追加到伤害数字后的后缀。留空则禁用后缀，仅保留强调脉冲。
damage-indicator-alt-mode=仅在启用 Alt 模式时显示伤害指示器。
damage-indicator-debug-info=用于调试，显示伤害指示器的内部状态。
damage-indicator-group-name-normalize=将相似的变体实体（如 Rampant 模组的敌人）分组在一起。用英文逗号分隔的 Lua 模式，每个模式包含一个捕获组 `(...)`，用于从带有层级/版本后缀的内部名称中提取基础名称。
damage-indicator-saturation-threshold=同一实体类型的伤害指示器达到此数量后，将它们分组为单个指示器。
damage-indicator-server-override-string=使用给定的启动设置覆盖用户的伤害指示器设置。适用于服务器统一伤害指示器显示。可在游戏中通过 [color=#FFE6C0]/damage-indicators-override[/color] 生成字符串。[font=default-bold]留空禁用[/font]。

