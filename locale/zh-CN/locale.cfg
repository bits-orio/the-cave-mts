[command-help]
damage-indicators-clear=清除游戏中所有当前活跃的伤害指示器。
damage-indicators-override=打开一个对话框，其中包含当前玩家伤害指示器设置的编码字符串。管理员可以将其粘贴到启动设置中的“服务器覆盖设置字符串”中，为所有玩家强制统一指示器显示。

[gui-damage-indicator]
settings-string-title=伤害指示器覆盖设置
settings-string-help=将此字符串复制并粘贴到主菜单模组设置中的 [font=default-bold][color=#FFE6C0]启动[/color][/font] → [font=default-bold]服务器覆盖设置字符串[/font]，以覆盖游戏中的玩家伤害指示器设置。这里使用的是你当前的玩家伤害指示器设置；如果之后调整了指示器设置，可以重新运行 [color=#FFE6C0]/damage-indicators-override[/color] 命令来更新字符串。
settings-string-close=关闭

[damage-indicator-message]
server-override-active=[font=default-dialog-button][[color=#FFE6C0]伤害指示器[/color]][/font] 除“显示伤害指示器”之外的玩家显示设置将被服务器覆盖。
server-override-decode-failed=[color=red]服务器覆盖设置字符串无效[/color]：“服务器覆盖设置字符串”中的值不是有效的编码设置字符串。请清除并使用 [color=#FFE6C0]/damage-indicators-override[/color] 生成一个新的字符串，然后将准确的输出粘贴到启动设置中。\n\n[font=default-bold]这是启动设置问题，请在主菜单的模组设置中检查。[/font]\n
server-override-json-failed=[color=red]服务器覆盖设置字符串已损坏[/color]：解码成功，但内部数据不是有效的 JSON。字符串可能被截断或部分覆盖；请使用 [color=#FFE6C0]/damage-indicators-override[/color] 生成一个新的。\n\n[font=default-bold]这是启动设置问题，请在主菜单的模组设置中检查。[/font]\n
server-override-shape-failed=[color=red]服务器覆盖设置字符串格式错误[/color]：解码后的数据与预期的设置结构不匹配。这通常意味着粘贴了蓝图或其他不相关的编码字符串。请使用 [color=#FFE6C0]/damage-indicators-override[/color] 生成一个新的。\n\n[font=default-bold]这是启动设置问题，请在主菜单的模组设置中检查。[/font]\n
setting-overridden=[font=default-dialog-button][[color=#FFE6C0]伤害指示器[/color]][/font] 对“__1__”的更改将被服务器覆盖。

