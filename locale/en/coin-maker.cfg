[technology-description]
the-cave-coin-maker=Unlocks a machine that automatically sells items at the Market's selling prices. Inserters supply goods and collect coins.
[entity-description]
the-cave-coin-maker=Automatically sells complete batches of normal-quality items at the Market's selling prices. Each item is sold independently; the displayed goods are alternatives, not ingredients required together. No recipe selection. Base rate: one sale every 2 seconds. Four module slots: speed and efficiency only, including beacon effects. Idle consumption: 500 kW, unaffected by modules. Total working consumption without modules: 2 MW. Full coin output pauses sales without consuming items.
