[entity-description]
the-cave-shelter=The fixed core objective starts with 5,000 HP. Shelter Shield research raises it to 35,000 HP and adds delayed automatic repair. Only enemy-force damage is accepted. It cannot be mined, moved, deconstructed, blueprinted or repaired manually or by robots.
the-cave-shelter-substation=Fixed interior Main Substation with 36×36 direct supply coverage and 36-tile wire reach. It powers the Shelter core, charges the Shelter Battery and carries the same electric network to the Garden connector.
the-cave-shelter-hidden-battery=Legacy hidden Shelter Battery bridge retained only so older saves can migrate safely.
the-cave-shelter-battery-interior-charger=One-way interior charger for the scripted Shelter Battery. It consumes only Shelter-interior power and cannot supply that grid.
the-cave-shelter-battery-output-reserve=One-way 0.25-second output reserve for the scripted Shelter Battery. Powers machines and charges exterior accumulators alongside exterior generators. Exterior power cannot charge the Shelter Battery.
the-cave-shelter-fluid-input=One-way fluid connection from the exterior Shelter port into both interior INPUT ports.
the-cave-shelter-fluid-output=One-way fluid connection from both interior OUTPUT ports to the exterior Shelter port.
the-cave-shelter-garden-substation=Fixed Garden Floor wire connector with 36-tile wire reach and direct supply limited to its protected 2×2 footprint. Connect player-built electric poles to power Garden machines.

