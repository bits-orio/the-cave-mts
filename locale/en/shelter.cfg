[technology-description]
the-cave-shelter-interior-expansion=Expands the Shelter's main buildable floor to __1__×__2__ tiles, plus a separate 10-tile utility lane around all four sides, without moving its fixed center core.
the-cave-shelter-battery-upgrade=Installs or upgrades the Shelter Battery to __1__ MJ with a maximum __2__ MW interior charge rate and __3__ MW exterior output rate.
the-cave-shelter-shield-upgrade=Reinforces the fixed Cave Shelter to __1__ HP and __2__ HP/sec self-repair. Automatic repair starts 10 seconds after the last hit.
the-cave-shelter-shield-health=Shelter Shield health: __1__ HP
the-cave-shelter-shield-repair=Self-repair: __1__ HP/sec
the-cave-shelter-attack-distance=Moves future enemy tunnel mouths to __1__ chunks from the Shelter and generates/converts terrain through __2__ chunks.
the-cave-shelter-garden=Unlocks or expands Garden Floor stage __1__, with a fixed green core, internal water, and expanding Yumako/Jellynut growing soil.
the-cave-shelter-garden-effect=Garden Floor stage __1__

