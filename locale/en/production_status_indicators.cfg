[mod-setting-name]
the-cave-production-status-indicators=Production Status Indicators

[mod-setting-description]
the-cave-production-status-indicators=Default: Enable. Adds fixed-colour status indicators to assembling machines, furnaces, rocket silos and mining drills. Green means working, yellow means full output, orange means low power, and red means stopped or blocked. Uses Factorio's native graphics system with no runtime polling. Requires restart/startup setting apply.

[string-mod-setting]
the-cave-production-status-indicators-enabled=Enable
the-cave-production-status-indicators-disabled=Disable
