[entity-description]
the-cave-industrial-container=A high-capacity container in The Cave's industrial storage family. This separate container does not replace any vanilla chest.

[technology-name]
the-cave-industrial-containers=Industrial containers
the-cave-logistic-containers=Logistic containers

[technology-description]
the-cave-industrial-containers=Unlocks standard and filtered industrial containers in four sizes.
the-cave-logistic-containers=Unlocks Passive Provider and Storage variants for every industrial container size. Requester, Buffer and Active Provider variants unlock later with Logistic System.

[mod-setting-name]
the-cave-industrial-container-1x1-capacity=1×1 Industrial Container Capacity
the-cave-industrial-container-2x2-capacity=2×2 Industrial Storebox Capacity
the-cave-industrial-container-4x4-capacity=4×4 Industrial Storehouse Capacity
the-cave-industrial-container-6x6-capacity=6×6 Industrial Warehouse Capacity

[mod-setting-description]
the-cave-industrial-container-1x1-capacity=Inventory slots for every 1×1 industrial container variant. Range: 100–200. Default: 200. Does not modify vanilla chests. Requires restart/startup setting apply.
the-cave-industrial-container-2x2-capacity=Inventory slots for every 2×2 industrial storebox variant. Range: 400–800. Default: 800. The existing 2×2 placement footprint is unchanged. Does not modify vanilla chests. Requires restart/startup setting apply.
the-cave-industrial-container-4x4-capacity=Inventory slots for every 4×4 industrial storehouse variant. Range: 900–1600. Default: 1600. Does not modify vanilla chests. Requires restart/startup setting apply.
the-cave-industrial-container-6x6-capacity=Inventory slots for every 6×6 industrial warehouse variant. Range: 1800–3000. Default: 3000. Does not modify vanilla chests. Requires restart/startup setting apply.
