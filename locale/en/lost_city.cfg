[entity-description]
the-cave-lost-city-entrance=Enter the procedural Underground Village.
the-cave-lost-city-exit=Return to the parent cave surface.
the-cave-lost-city-supply-crate=Place the active mission's requested supplies here. Items are checked once per second.
the-cave-lost-city-reward-crate=Collect the team-selected reward after completing the village contract.
the-cave-lost-city-item-down-input=Blue-belt-speed input. Items placed here travel down into the Underground Village.
the-cave-lost-city-item-down-output=Blue-belt-speed output for items sent down from the parent cave.
the-cave-lost-city-item-up-input=Blue-belt-speed input for ore, salvage and loot returning to the parent cave.
the-cave-lost-city-item-up-output=Blue-belt-speed output for items returned from the Underground Village.

