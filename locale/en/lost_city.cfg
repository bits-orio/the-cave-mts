story-doctor-1=A virus swept through the settlement. I can finish a treatment, but the field laboratory has run out of research materials.
story-doctor-2=The survivors are getting weaker. Bring me the laboratory supplies needed to identify the infection before time runs out.
story-soldier-1=My unit is cut off beyond the ruins. I need enough weapons and field supplies to reach them alive.
story-soldier-2=The defensive line collapsed during the evacuation. Help me rearm the remaining guards before the village is sealed.
story-engineer-1=The village's machines can still be recovered, but the maintenance depot is empty. Bring me parts for an emergency repair.
story-engineer-2=The old infrastructure is failing one system at a time. I need components to stabilize it long enough for an evacuation.
story-electrician-1=The underground grid is dark and unstable. Supply the electrical parts needed to restore a safe route through the district.
story-electrician-2=Power has been lost across the shelters. Bring me enough cable and grid equipment to reconnect them.
story-plumber-1=The settlement's water network has ruptured. I need pipes and pumps before the remaining reservoirs drain away.
story-plumber-2=The lower district is flooding while the shelters have no water. Help me rebuild the transfer lines.
story-gas-1=A damaged processing line is leaking through the industrial district. Bring the equipment required to isolate it.
story-gas-2=The fuel network is offline. I need processing and pipe components to restart the emergency system safely.
story-miner-1=The village has one last usable ore pocket. Collect the requested amount and deliver it to the Mission Supply Crate so we can reinforce the shelters.
story-miner-2=Our stockpile is exhausted. Collect the requested resource and deliver it to the Mission Supply Crate before the passage closes.
