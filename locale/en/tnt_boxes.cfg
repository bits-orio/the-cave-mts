[item-description]
the-cave-tnt-box-small=A 2×2 timed excavation charge. Detonates 10 seconds after player placement and resolves Cave digs in a 20-tile-diameter circle.
the-cave-tnt-box-medium=A 2×2 timed excavation charge. Detonates 10 seconds after player placement and resolves Cave digs in a 30-tile-diameter circle.
the-cave-tnt-box-large=A 2×2 timed excavation charge. Detonates 10 seconds after player placement and resolves Cave digs in a 40-tile-diameter circle.

