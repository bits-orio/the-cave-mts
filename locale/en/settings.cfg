[mod-setting-description]
the-cave-uranium-caves=Default: Enable. From Medium depth onward, natural Uranium Cave entrances use room weight 12, remain at least 150 tiles apart and gain a guaranteed eligible entrance after 12 opened rooms without Uranium. Every lower cavern reveals a 50/50 uranium/scrap vein; scrap needs no research or acid, while uranium still requires Uranium mining research and sulphuric acid. Requires restart.
the-cave-iron-cave=Default: Enable. Allows new Iron Caves. Disable removes Iron from new Mineral Cave decks without affecting Copper or Coal; already discovered Iron Caves remain usable. Requires restart.
the-cave-copper-cave=Default: Enable. Allows new Copper Caves. Disable removes Copper from new Mineral Cave decks without affecting Iron or Coal; already discovered Copper Caves remain usable. Requires restart.
the-cave-coal-cave=Default: Enable. Allows new Coal Caves. Disable removes Coal from new Mineral Cave decks without affecting Iron or Copper; already discovered Coal Caves remain usable. Requires restart.
the-cave-fortified-cave=Default: Enable. Allows new Fortified Cave entrances in normal exploration and Advancing Collapse. Disable prevents new entrances; previously discovered caves retain access, contents and normal timers. Requires restart.
the-cave-wind-turbine=Default: Enable. Disable hides the Wind Turbine item, recipe and research and sets existing turbines to zero output without deleting them. Requires restart.
the-cave-shelter-defense=Default: Disabled. Optional new-game fixed-core survival mode. Creates one immovable Cave Shelter with 5,000 base HP that enemy waves attack after the two-hour preparation period. Includes a Ctrl+Enter interior starting at 40×40, full interior map charting, a controllable exterior camera, a 20-stage Shelter Battery with exterior power bridge, a 10-stage Shelter Shield reaching 35,000 HP and 50 HP/sec delayed self-repair, fixed item/fluid transfer fixtures, eight main-floor expansions through 300×300 plus a separate ten-tile utility lane, and eight enemy tunnel-distance upgrades from 10 to 26 attack chunks. Destroying the Shelter starts the staged soft reset. Train Interiors must be Disabled. To use Shelter Defense, enable it before starting the game. If both settings are Enabled, neither scenario starts and an in-game conflict warning is shown. Leave both disabled for normal core The Cave. Intended for new games; updating an older save never inserts a Shelter into an occupied base. Requires restart/startup setting apply.
the-cave-train-interiors=Default: Disabled. Adds usable rolling-stock interiors, outside camera view, starter Main Train, train-near respawn, Train Battery and exploration-based train expansion. Controls: Ctrl+Enter enters/exits train interiors. Locomotive Garden: walk onto the 2×2 portal in the Main Locomotive or Garden; travel is automatic and arrives on the separate grey landing pad. Shelter Defense must be Disabled before Train Interiors can start. If both settings are Enabled, neither scenario starts and an in-game conflict warning is shown. Disable both for normal core The Cave. Requires restart/startup setting apply.
the-cave-allow-wave-defense=Default: Enable. Enables the established scripted Wave Defense for whichever compatible mode is active: Train Interiors or Shelter Defense. Includes its preparation timer, scheduled attackers, tunnels, queue and Boss waves. This setting is independent from Allow Biter Expansion; if both are Enabled, both systems run together while keeping their own units and commands. Disable only this setting to remove scheduled waves without changing Biter Expansion. Disable both to run Train Interiors or Shelter Defense without either attack system. Requires restart/startup setting apply.
the-cave-allow-biter-expansion=Default: Disable. Enables The Cave's Biter Expansion system, including its Evolution-scaled 10-to-2-minute attempts, dense zero-spacing nest placement and real filtered settler migrations. With Train Interiors or Shelter Defense active, a visible red 200-tile-radius boundary follows the Main Locomotive or surrounds the fixed Shelter even when ALT mode is off. Ordinary mobile enemies that enter it permanently attack that objective, and new Expansion nests are founded only outside the boundary; Wave Defense units and the active Arachnid Queen are excluded. This setting is independent from Allow Wave Defense, and both may run together. Requires restart/startup setting apply.
the-cave-arachnid-queen=Default: Enable. Allows the first eligible three-spawner Nest Room in each depth zone to release one Arachnid Queen. Queens travel between opened rooms, excavate Cave frontier rocks when no room has space, lay exactly three weighted nests, rest and regenerate. Disable removes existing Queens and prevents replacements while leaving the three room spawners and all other enemy systems unchanged. Requires restart/startup setting apply.
the-cave-advancing-collapse=Default: Disable. New games only. Creates an independent northbound survival mode with a 510-tile-wide ribbon, 1024-tile zones and a visible two-hour connected-gameplay countdown. A bright electric line seals the south while guards patrol behind it. At zero, terrain, buildings and vehicles are permanently erased from south to north, and one-direction enemy waves with scripted nests advance from reachable floor ahead of the moving collapse every three minutes. Surviving attackers never pause later waves. Unsafe respawns are moved at least 40 tiles ahead of the collapse. No train, Mobile Factory or other mod is required. With Space Age, future Vulcanus, Gleba, Fulgora and Aquilo zone families become eligible only after their planet-discovery research. Every planet-family zone is separated by one or two Nauvis zones, and early planetary enemies are limited by the current zone number. Existing generated zones keep their previous dimensions; the new layout begins in the first fully ungenerated zone.



the-cave-cavetorio=WARNING: Requires CAVETORIO, Train Interiors, and Everything on Nauvis, with Shelter Defense Disabled. Controls: Train interiors use Ctrl+Enter. Locomotive Garden travel is automatic when walking onto its 2×2 portal. Best used on a new save; keep other options default unless needed.
the-cave-offline-player-body=Default: Enable. Multiplayer AFK and recovery system. A connected player with five minutes of Factorio-reported inactivity is kicked. Every manual disconnect or AFK kick then receives a separate five-minute return grace period. Rejoining during that grace period cancels recovery. Otherwise every occupied stack in the main inventory, armor, equipment grid, guns, ammunition, trash slots and cursor is moved without re-creating items into a permanent lootable body. With Train Interiors enabled, the body is created near the Main Train's live position; otherwise it is created at that force's normal spawn point on the main Cave surface. Requires restart/startup setting apply.
the-cave-darkness-infestation=Default: Enable. Player-centred darkness challenge. Outside the 5x5-chunk safe zone, stay within 12 tiles of a powered vanilla Small Lamp or within 30 tiles of a powered integrated Lamp Post. After 30 seconds without a valid lamp, cave enemies begin appearing near the player and attack directly. No lamp prototypes, lighting graphics, recipes, power networks, or circuit behavior are changed.






the-cave-integrated-damage-indicator=Default: ON. Shows multiplayer-safe local floating damage numbers during combat. Local text is not stored in the shared map state. Turn OFF for a cleaner screen. Requires restart/startup setting apply.
the-cave-research-level-difficulty=Startup setting for all technology research costs while The Cave is active. Medium is normal. Very Easy 0.25x, Easy 0.5x, Hard 2x, Very Hard 3x, Marathon 6x. Multipliers are direct from each base cost, not cumulative. Requires restart/startup setting apply.
the-cave-early-stack-size=Default: ON. Requires ownership of the Space Age expansion, but works in both normal Factorio with the Space Age mod disabled and in Space Age mode. Enables Stack Inserter at capacity 2, Transport Belt Capacity levels 1–18 up to capacity 20, and belt-stack output for eligible inserters, loaders, and item mining drills. All capacity levels use Automation, Logistic, Chemical, Production, and Utility science only. Disable to keep vanilla behaviour for the active game mode. Requires restart/startup setting apply.
the-cave-mixed-resource-patches=Default: ON. ON uses The Cave 2.0 mixed resource patches with 10 preset mixes. OFF uses classic single-resource patches while keeping the new balanced richness values. Requires a new map.
the-cave-ore-patch-missing=Default: OFF. Optional challenge mode. One basic ore type is removed from natural cave ore patches for the map, but digging rocks gives that missing resource instead. The missing resource is chosen per map seed and is not announced directly. Requires a new map for clean testing.
the-cave-ore-blood=Default: ON. Biters and spitters drop a small amount of one random basic resource when killed. Coin drops are unchanged. Worms, spawners/nests, bosses, and other enemies are not affected. Requires restart/startup setting apply.
the-cave-filter-mining-drills=Default: ON. Adds a shortcut/selection tool for filtering selected mining drills to one resource type. Players can disable this startup setting if they do not want drill filtering. When enabled, resource categories and hidden mining-drill variants are created at startup. Requires restart/startup setting apply.
the-cave-chest-filtering=Default: Enable. Enable gives every compatible normal and logistic chest Factorio's native cargo-wagon-style item-slot filters. Disable keeps ordinary chests' original inventory behaviour; the dedicated Filtered Industrial Container, Filtered Industrial Storebox, Filtered Industrial Storehouse and Filtered Industrial Warehouse remain filterable. Existing saves retain Enable unless changed manually. Disabling this setting on an established save can remove slot-filter assignments from ordinary chests. Requires restart/startup setting apply.
the-cave-resource-eraser-access=Default: Disabled. Adds a destructive shortcut/selection tool that permanently removes every selected resource entity, including oil and resources added by other mods. Admins Only is recommended for multiplayer. A maximum of 10,000 resources can be removed per selection. Requires restart/startup setting apply.
the-cave-underground-belt-reach-research=Default: Enable. Adds a 7-level Underground Belt Reach research chain for the official underground belt tiers. Total bonus at the final level is +9 tiles to yellow, red, blue, and Turbo underground belts when available. Every research level uses its own native Upgrade Planner chain, and existing underground belts are safely synchronised to the force's current reach level. Blueprints, ghosts, robots, and visible crafting items continue to use the official belt tiers. Requires restart/startup setting apply.
the-cave-underground-pipe-reach-research=Default: Enable. Adds a 7-level Underground Pipe Reach research chain. Pipe to Ground keeps the vanilla 10-tile reach at Level 0; each research adds +5 tiles, reaching 45 tiles at Level 7. Existing placed pipes are not upgraded automatically. Q/pipette, blueprints, ghosts and construction robots continue to use the normal Pipe to Ground item. Disable and restart to return new placement and research to vanilla behavior.
the-cave-resource-patch-size=Controls The Cave ore patch scale for both Mixed Resource Patches and classic single-resource patches. Level 1 is the smallest, Level 8 is eight times Level 1. Default: Level 2. Ignored when Digging Mode is enabled. Requires new undiscovered/generated areas or a new map to see the effect.
the-cave-digging-mode=Default: Disabled. Disabled keeps normal The Cave resource patches. Hardcore disables ore patches and gives 0.5x digging rewards. Digging I/II/III/IV disable ore patches and give 1x/2x/3x/4x digging rewards. Mixed Resource Patches and Resource Patch Size are ignored while Digging Mode is enabled. Oil is unchanged. Tiny starter ore patches are created near spawn only to protect progression unlocks. Requires a new map.
the-cave-tnt-boxes=Default: Enable. Adds player-placed Small, Medium and Large 2×2 TNT Boxes with a three-stage research chain after Military Science Pack. Every box counts down for 10 seconds; blast diameters are 20, 30 and 40 tiles. Blasts remove only The Cave cover rocks, give no mined stone items, preserve normal Dig outcomes such as resources, enemies, rooms and special caves, and damage no players, enemies or buildings. At most five boxes may be active globally. Construction robots cannot place or remove them. This setting controls TNT Boxes in every game mode, including Cave Collapse and Advancing Collapse. Requires restart/startup setting apply.
the-cave-ore-patch-protection=OFF by default. When enabled, new invalid buildings placed on resource patches will be removed and refunded when possible, or invalid blueprint ghosts will be removed. Existing buildings are not removed, but if you remove and rebuild them, this rule will apply. Allowed on resources: mining drills, chests, belts, underground belts, splitters, electric poles, substations, rails, rail signals, chain signals, train stops, locomotives, wagons, cars, tanks, and spider vehicles. Enable at your own risk.
the-cave-global-difficulty=Global difficulty and treasure balance. Enemies: Easy 50%, Medium 100%, Hard 150%, Nightmare 200%. Treasure: Easy 125%, Medium 100%, Hard 90%, Nightmare 75%.
the-cave-wooden-chest-capacity=Set Wooden Chest inventory slots. Allowed range: 16 to 28.
the-cave-iron-chest-capacity=Set Iron Chest inventory slots. Allowed range: 32 to 60.
the-cave-steel-chest-capacity=Set Steel Chest inventory slots. Allowed range: 48 to 80.
the-cave-logistic-chest-capacity=Set Logistic Chest inventory slots. Allowed range: 48 to 80.

the-cave-iron-ore-stack-size=Sets stack size for raw Iron Ore only. Range: 50 to 400. Default: 200. Does not affect plates, recipes, loot, market, or economy.
the-cave-copper-ore-stack-size=Sets stack size for raw Copper Ore only. Range: 50 to 400. Default: 200. Does not affect plates, recipes, loot, market, or economy.
the-cave-coal-stack-size=Sets stack size for raw Coal only. Range: 50 to 400. Default: 200. Does not affect plates, recipes, loot, market, or economy.
the-cave-stone-stack-size=Sets stack size for raw Stone only. Range: 50 to 400. Default: 200. Does not affect bricks, recipes, loot, market, or economy.
the-cave-uranium-ore-stack-size=Sets stack size for raw Uranium Ore only. Range: 50 to 400. Default: 200. Does not affect uranium processing, recipes, loot, market, or economy.
the-cave-scrap-stack-size=Sets stack size for mined The Cave Scrap only. Range: 50 to 400. Default: 200. Does not affect Scrap Sorting probabilities, recipes, loot, market, or economy.
the-cave-calcite-stack-size=Sets stack size for Calcite only. Range: 50 to 400. Default: 200. Does not affect recipes, mining, loot, market, or economy.
the-cave-tungsten-ore-stack-size=Sets stack size for Tungsten Ore only. Range: 50 to 400. Default: 200. Does not affect recipes, mining, loot, market, or economy.
the-cave-fulgora-scrap-stack-size=Sets stack size for Space Age Fulgora Scrap only. Range: 50 to 400. Default: 200. This is completely independent from The Cave Scrap and does not affect recycling results, recipes, loot, market, or economy.
the-cave-yumako-stack-size=Sets stack size for Yumako only. Range: 50 to 400. Default: 200. Does not affect spoil time, spoil result, fuel value, consumption effects, recipes, loot, market, or economy.
the-cave-jellynut-stack-size=Sets stack size for Jellynut only. Range: 50 to 400. Default: 200. Does not affect spoil time, spoil result, fuel value, consumption effects, recipes, loot, market, or economy.

the-cave-auto-inventory-repair=Default: Enable. Automatically repairs damaged placeable items inside player inventories using repair packs. Repair packs are consumed normally. Works with Factorio and modded placeable items that have entity health.
the-cave-everything-on-nauvis=Default: Enable.\n\nON:\nSpace Age content is integrated into Nauvis / cave progression. All four Planet Discovery technologies are completed for every playable force. Space Science becomes a 100-unit laboratory research using Metallurgic, Agricultural, Chemical and Electromagnetic Science Packs, and its official recipe can run on the cave surface.\n\nDirection guide:\nNorth / Up = Aquilo\nSouth / Down = Gleba\nEast / Right = Fulgora\nWest / Left = Vulcanus\n\nOFF:\nNormal Space Age discovery, Space Science and planet travel remain unchanged.\nPlanets stay in their normal places.
the-cave-base-quality=Default: 0 (disabled). Set a value from 1 to 100 to give that percentage of base quality to every assembling machine, furnace and mining drill. When enabled, Uncommon quality is unlocked for every force and negative module quality effects are treated as zero. Requires the official Quality mod and a restart/startup setting apply.

the-cave-squeak-through=Default: Enable. Shrinks selected entity collision boxes at startup so players can walk through narrow gaps. Disable and restart to keep normal Factorio collision behaviour. If a standalone Squeak Through mod is installed, the integrated implementation safely skips itself.
the-cave-squeak-through-modify-chests=Applies Squeak Through collision trimming to wooden, iron, steel, logistic, linked, infinity, and compatible modded chests.
the-cave-squeak-through-modify-circuits=Applies collision trimming to combinators, lamps, programmable speakers, selector combinators, and power switches.
the-cave-squeak-through-modify-drills=Applies collision trimming to mining drills.
the-cave-squeak-through-modify-machines=Applies collision trimming to assembling machines, furnaces, laboratories, and rocket silos.
the-cave-squeak-through-modify-pipes=Applies collision trimming to pipes, Pipe to Ground, pumps, storage tanks, offshore pumps, heat pipes, and compatible fluid entities.
the-cave-squeak-through-modify-solar=Applies collision trimming to solar panels, accumulators, and electric-energy interfaces.
the-cave-squeak-through-modify-steam=Applies collision trimming to boilers, generators, reactors, and burner generators.
the-cave-squeak-through-modify-trees=Applies collision trimming to trees.
the-cave-squeak-through-modify-turrets=Applies collision trimming to ammo, electric, fluid, and artillery turrets.
the-cave-squeak-through-modify-misc=Applies collision trimming to beacons, electric poles, inserters, radars, roboports, and train stops.
the-cave-squeak-through-blacklist-types=Comma-separated entity prototype types that must never be modified. Example: tree, inserter, electric-pole
the-cave-squeak-through-blacklist-names=Comma-separated exact entity prototype names that must never be modified. Example: fast-inserter, small-electric-pole
the-cave-squeak-through-remove-collision=Advanced option. Removes every collision layer shared with the player from entities named by the two lists below. This can also change enemy movement, so use it carefully.
the-cave-squeak-through-remove-collision-types=Comma-separated entity prototype types whose player collision should be removed. Default: tree
the-cave-squeak-through-remove-collision-names=Comma-separated exact entity prototype names whose player collision should be removed. Upgrade and downgrade chains are changed together.
the-cave-lamp-post=Adds the integrated wide-area Lamp Post, its recipe and technology.
the-cave-electric-furnaces-stone-steel=Adds electric versions of the stone and steel furnaces.
the-cave-electric-furnaces-advanced=Adds Electric Furnace 2 and Electric Furnace 3 with increased crafting speed.
the-cave-electric-furnaces-boiler=Adds an electric boiler that heats fluids using electricity.
the-cave-electric-furnaces-distinct-icons=Adds a lightning bolt to electric stone and steel furnace item icons so they are easier to distinguish.

the-cave-faster-start=Provides each player once with compact modular armour containing a 250 kW portable fission reactor, a personal roboport, two standard personal batteries and an exoskeleton with a 30% movement bonus, plus 50 self-powered construction robots. Night vision is not included.
the-cave-starter-pack=Default: Medium. Gives each newly created player one balanced starting inventory package. Disabled gives nothing; Small, Medium, Large and Lazy progressively increase every included item. This is independent from Faster Start and is never repeated on reconnect, death or respawn. Recycler and Quality Module are included only while Space Age is active. Requires restart/startup setting apply.
the-cave-train-wave-small-coin-drop=Exact Coins dropped by each Small Train Wave Biter or Spitter. Default: 2. Set to 0 to disable this reward. Changes apply to the next enemy death without a restart.
the-cave-train-wave-small-resource-drop=Exact amount of one random basic resource dropped by each Small Train Wave Biter or Spitter. The resource is Iron Ore, Copper Ore, Coal or Stone. Default: 0. Set to 0 to disable this reward.
the-cave-train-wave-medium-coin-drop=Exact Coins dropped by each Medium Train Wave Biter or Spitter. Default: 3. Set to 0 to disable this reward. Changes apply to the next enemy death without a restart.
the-cave-train-wave-medium-resource-drop=Exact amount of one random basic resource dropped by each Medium Train Wave Biter or Spitter. The resource is Iron Ore, Copper Ore, Coal or Stone. Default: 0. Set to 0 to disable this reward.
the-cave-train-wave-big-coin-drop=Exact Coins dropped by each Big Train Wave Biter or Spitter. Default: 4. Set to 0 to disable this reward. Changes apply to the next enemy death without a restart.
the-cave-train-wave-big-resource-drop=Exact amount of one random basic resource dropped by each Big Train Wave Biter or Spitter. The resource is Iron Ore, Copper Ore, Coal or Stone. Default: 0. Set to 0 to disable this reward.
the-cave-train-wave-behemoth-coin-drop=Exact Coins dropped by each Behemoth Train Wave Biter or Spitter. Default: 6. Set to 0 to disable this reward. Changes apply to the next enemy death without a restart.
the-cave-train-wave-behemoth-resource-drop=Exact amount of one random basic resource dropped by each Behemoth Train Wave Biter or Spitter. The resource is Iron Ore, Copper Ore, Coal or Stone. Default: 0. Set to 0 to disable this reward.
the-cave-train-wave-boss-coin-drop=Exact Coins dropped by every current or legacy Train Wave Boss. Default: 6. Set to 0 to disable this reward. Changes apply to the next Boss death without a restart.
the-cave-train-wave-boss-resource-drop=Exact amount of one random basic resource dropped by every current or legacy Train Wave Boss. The resource is Iron Ore, Copper Ore, Coal or Stone. Default: 0. Set to 0 to disable this reward.
