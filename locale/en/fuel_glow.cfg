[mod-setting-name]
the-cave-fuel-glow=FuelGlow
the-cave-fuel-glow-peak-fuel-value=FuelGlow peak fuel value
the-cave-fuel-glow-floor-fuel-value=FuelGlow floor fuel value
the-cave-fuel-glow-color-curve=FuelGlow colour curve
the-cave-fuel-glow-lock-vanilla-fuels=FuelGlow vanilla fuel colours
the-cave-fuel-glow-electric-furnace-light=FuelGlow electric furnace light

[mod-setting-description]
the-cave-fuel-glow=Default: Enable. Applies fuel-dependent glow colours to burner entities and reactors. Automatically supports compatible fuels added by other mods. The standalone FuelGlow mod takes priority when installed. Requires restart.
the-cave-fuel-glow-peak-fuel-value=Energy value used for the cool-blue end of the automatic colour range. Use a joule value such as 1.21GJ. Invalid values safely use the default. Requires restart.
the-cave-fuel-glow-floor-fuel-value=Energy value used for the warm-red end of the automatic colour range. Use a joule value such as 2MJ. It must be lower than the peak value. Requires restart.
the-cave-fuel-glow-color-curve=Adjusts the shape of the automatic warm-to-cool colour progression. Default: 2. Requires restart.
the-cave-fuel-glow-lock-vanilla-fuels=Default: Enable. Applies tuned fixed colours to wood, coal, solid fuel, rocket fuel, uranium fuel cells and nuclear fuel. Requires restart.
the-cave-fuel-glow-electric-furnace-light=Default: Enable. Adds a subtle orange working light to the vanilla electric furnace. Requires restart.

[string-mod-setting]
the-cave-fuel-glow-enabled=Enable
the-cave-fuel-glow-disabled=Disable
the-cave-fuel-glow-lock-vanilla-fuels-enabled=Enable
the-cave-fuel-glow-lock-vanilla-fuels-disabled=Disable
the-cave-fuel-glow-electric-furnace-light-enabled=Enable
the-cave-fuel-glow-electric-furnace-light-disabled=Disable
