[mod-setting-name]
the-cave-minimal-wire=Minimal Wire
the-cave-minimal-wire-radius=Minimal Wire search radius
the-cave-minimal-wire-max-poles=Minimal Wire maximum poles
the-cave-minimal-wire-operations-per-tick=Minimal Wire operations per tick

[mod-setting-description]
the-cave-minimal-wire=Default: Enable. Rebuilds nearby player power-pole copper connections as a short, deterministic minimum spanning tree after a pole is built, removed or replaced. Red and green circuit wires are preserved. Requires restart.
the-cave-minimal-wire-radius=How far, in tiles, Minimal Wire searches around a changed pole. Default: 42.
the-cave-minimal-wire-max-poles=Maximum nearby player poles included in one local rebuild. Default: 30.
the-cave-minimal-wire-operations-per-tick=Maximum copper-wire connect/disconnect operations processed per tick. Default: 10.

[string-mod-setting]
the-cave-minimal-wire-enabled=Enable
the-cave-minimal-wire-disabled=Disable
