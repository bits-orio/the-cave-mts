the-cave-character-reach-upgrade=Upgrades seven character abilities together. This level adds +__1__ tiles to building, interaction, resource reach, item dropping and loot pickup. Manual item pickup with F remains at vanilla range. Total distance bonus: +__2__ tiles. Cumulative base character values after this level: running speed __3__, hand crafting speed __4__.
