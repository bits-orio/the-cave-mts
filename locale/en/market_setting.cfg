[mod-setting-name]
the-cave-market=Market

[mod-setting-description]
the-cave-market=Enable or disable The Cave Market and all new coin rewards. Disabled also removes coins and market-only portable power from new starter packs. Existing items and buildings are preserved. Default: Enable.

[string-mod-setting]
the-cave-market-enabled=Enable
the-cave-market-disabled=Disable
