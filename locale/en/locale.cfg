[mod-setting-description]
the-cave-extra-storage-tanks=Enables the integrated 1×1, 2×2, 3×4 and 5×5 storage tanks with fixed capacities and dedicated research progression.
the-cave-uranium-caves=Default: Enable. From Medium depth onward, eligible rooms can become a timed 30-minute Uranium Cave. Natural Uranium entrances stay at least 192 tiles apart, their room weight is 12, and an eight-room anti-drought counter guarantees the next eligible entrance outside that radius. Entrances may wait on the map, but only one Uranium expedition can run per Force. Lower caverns reveal 50/50 mixed uranium and salvage-scrap veins; scrap needs no research or acid, while uranium still requires Uranium mining research and sulphuric acid. Requires restart/startup setting apply. With Bob's Ores active, new expeditions last 60 minutes and reveal broad beds with 10x per-tile richness, including enabled thorium. Started expeditions keep their original deadline.
the-cave-iron-cave=Default: Enable. Allows Iron Caves to be selected by the timed Mineral Cave system. Disabling it removes Iron from new deterministic cave decks without disabling Copper or Coal; already discovered Iron Caves remain usable. Enabled resource types retain their relative weights from the original 5 Iron / 3 Copper / 2 Coal deck. Requires restart/startup setting apply.
the-cave-copper-cave=Default: Enable. Allows Copper Caves to be selected by the timed Mineral Cave system. Disabling it removes Copper from new deterministic cave decks without disabling Iron or Coal; already discovered Copper Caves remain usable. Enabled resource types retain their relative weights from the original 5 Iron / 3 Copper / 2 Coal deck. Requires restart/startup setting apply.
the-cave-coal-cave=Default: Enable. Allows Coal Caves to be selected by the timed Mineral Cave system. Disabling it removes Coal from new deterministic cave decks without disabling Iron or Copper; already discovered Coal Caves remain usable. Enabled resource types retain their relative weights from the original 5 Iron / 3 Copper / 2 Coal deck. Requires restart/startup setting apply.
the-cave-fortified-cave=Default: Enable. Allows new Fortified Cave entrances in normal exploration and Advancing Collapse. Disable prevents new entrances; previously discovered caves retain access, contents and normal timers. Requires restart.
the-cave-wind-turbine=Default: Enable. Enables the Wind Turbine item, recipe and three-stage research chain. Disabling hides its item, recipe and research and sets existing Wind Turbines to zero output without deleting them; enabling it again restores output from the Force's completed research. Requires restart/startup setting apply.
the-cave-advancing-collapse=Default: Disable. New games only. Seals the south with an electric warning line and patrolling guards, then starts a visible two-hour connected-gameplay countdown. At zero, the collapse permanently erases the 510-tile-wide Cave from south to north while one-direction enemy waves and scripted nests advance from reachable floor ahead of it every three minutes. Surviving attackers never pause later waves. Unsafe respawns move at least 40 tiles ahead of the collapse. Uses MTN-scaled multiplayer speed and catch-up rules, requires no vehicle or other mod, research-gates future Space Age zone families, and separates them with one or two Nauvis zones. Existing generated zones keep their previous dimensions; the new layout begins in the first fully ungenerated zone.
the-cave-chemical-rockets=Enable or disable the integrated Chemical Rocket and Incendiary Rocket ammunition. Both recipes are unlocked by Explosive Rocketry.
the-cave-cavetorio=⚠️ !! WARNING !!\nCAVETORIO requires these settings to be enabled:\n\nCAVETORIO\nTrain Interiors\nEverything on Nauvis\n\nFor best compatibility, keep all other options at their default values unless you specifically want to change them.\n\nThis mode adds the Cavetorio timer, HUD, Manual Warp button, fresh cave surfaces, and Warp Outpost transfer rules.\n\nDisable CAVETORIO to play normal The Cave without the warp system.
the-cave-ore-patch-missing=Default: OFF. Optional challenge mode. One basic ore type is removed from natural cave ore patches for the map, but digging rocks gives that missing resource instead. The missing resource is chosen per map seed and is not announced directly. Requires a new map for clean testing.
the-cave-everything-on-nauvis=Default: ON. Keeps the current The Cave progression where Space Age-style content is available through Nauvis cave regions. Turn OFF only for new saves if you want normal Space Age planet travel/progression while The Cave remains on Nauvis.
the-cave-alien-biomes-support=Default: Enable. When Alien Biomes is installed, newly generated and newly revealed natural Nauvis cave floor uses deterministic organic Alien Biomes regions. Existing terrain, player flooring, Space Age regions, Uranium Caves and Train Interiors are not changed. Has no effect when Alien Biomes is absent.
the-cave-underground-lighting-mode=Default: Permanent Night. Choose how The Cave controls underground lighting. Normal uses the regular day/night cycle. Permanent Day keeps the cave bright with full solar output. Permanent Night keeps the current cave-night behaviour with 50% solar output. Pitch Black creates near-total darkness with 25% solar output, where lamps and flashlights matter.
the-cave-collapse-mode=Default: Disable. Enable activates the original fast cave-collapse system. Disable prevents every cave-in, countdown, alarm and collapse effect and hides Support Struts research. No advance stress triangles are shown; only an actually scheduled cave-in reveals its exact 2×2 area with a boxed countdown. Enabled games receive 2,000 Stone Walls per player, but no support walls are placed automatically. Requires restart/startup setting apply.
diggy-carve-out-radius=Radius of the pre-revealed safe area at spawn. Requires a new map.
diggy-dig-biter-chance=Legacy compatibility setting retained for existing saves. Direct-dig enemies now use deterministic difficulty-based dig intervals and this value is ignored.
diggy-dig-nest-chance=Legacy compatibility setting. Direct digging no longer spawns nests or worms.
diggy-enemy-expansion=Uses a The Cave expansion interval that scales linearly from 10 minutes at 0% Evolution to 2 minutes at 100% Evolution, while retaining Factorio's standard distance, influence scoring, settler-group scaling and real migrations. On the main Cave surface, opened cave floor is accepted even when surrounding out-of-map tiles make the containing chunk fail Factorio's normal land-percentage check. Each interval is one attempt, not a guaranteed nest. Off keeps digging as the only source of new nests.
diggy-pack-size-multiplier=Legacy compatibility setting retained for existing saves. Direct-dig events now create exactly one enemy and this value is ignored.
diggy-treasure-chance=Chance that a dig uncovers a sealed loot chest. Locations are fixed per map seed; contents scale with depth.
diggy-cavern-worm-multiplier=Legacy compatibility setting. Cavern defenders now use fixed CPU-safe threat budgets.
diggy-crushed-remains=Legacy compatibility setting used only when cave collapses are enabled.
diggy-cavern-chance=Chance that a dig breaches a cavern tunnel. Caverns are fixed per map seed; deeper rooms hold nests, hoards, or Uranium Cave entrances.
diggy-collapse-enabled=Legacy compatibility toggle. The Cave Collapses Startup switch is the authoritative control.
diggy-cavern-countdown=Legacy compatibility value used for guarded cavern countdowns when collapses are active.
diggy-wall-support=Legacy compatibility value used for wall support when cave collapses are enabled.
diggy-strut-strength-max=Legacy compatibility value used by Support Struts when cave collapses are enabled.
diggy-wall-crowding=Legacy compatibility value used by the active ceiling-support calculation.
the-cave-corpse-clean-radius=Radius used when Backspace removes nearby temporary corpses.
the-cave-tree-stump-fade-time=How long tree stumps remain before being removed. 0 = disabled. 54000 = 15 minutes.
the-cave-enemy-corpse-fade-time=How long biter, spitter, worm, spawner, and nest corpses remain before being removed. 0 = disabled. 54000 = 15 minutes.
the-cave-building-remnant-fade-time=How long destroyed building remnants remain before being removed. Character corpses are not affected. 0 = disabled.
the-cave-rail-remnant-fade-time=How long rail remnants remain before being removed. 0 = disabled.
damage-indicator-font-family=Base font used to create the custom damage-indicator font
damage-indicator-font-size=Pixel size used to create the custom damage-indicator font.
damage-indicator-enabled=When enabled, damage numbers appear near damaged entities.
damage-indicator-visibility=Nearby shows all nearby damage. Own force shows damage involving your force. Outgoing only shows damage your force deals to other forces.
damage-indicator-radius=Only show indicators within this many tiles of your player.
damage-indicator-minimum-damage=Ignore new damage indicators below this amount. Existing combined indicators continue accumulating smaller follow-up hits.
damage-indicator-scale=Multiplies the size of damage text.
damage-indicator-lifetime=Base animation duration in ticks. Continuous damage keeps an indicator alive; after damage stops, this also influences fade duration.
damage-indicator-animation-speed=Multiplies animation speed. Higher values finish faster; lower values linger longer.
damage-indicator-combine-ticks=After an entity is damaged, further damage within this many ticks is combined into the same indicator instead of spawning a new popup.
damage-indicator-text-update-interval=Visible damage text is refreshed at most once every this many ticks while damage is being combined.
damage-indicator-max-active=Old indicators are removed when this many are active.
damage-indicator-group-similar-distance=Nearby damaged 1x1 buildings with the same internal name share one averaged damage indicator within this many tiles. Set to 0 to disable grouping.
damage-indicator-whitelist-entity-types=Comma-separated list of entity types (e.g. "asteroid, turret, rail") that are always considered groupable, even if they are larger than 1x1. Leave blank to disable the whitelist entirely.
damage-indicator-whitelist-distance-bonus=Extra tiles added to the group-similar distance when grouping whitelisted entity types. Lets whitelisted entities (such as drifting asteroids) merge across larger gaps than regular buildings.
damage-indicator-blacklist-entity-names=Comma-separated list of entity names that should never display damage indicators (e.g. "small-biter, big-metallic-asteroid"). Supports leading or trailing wildcards: "*-asteroid" matches any name ending in "-asteroid", "pipe-*" matches any name starting with "pipe-". Leave blank to disable the blacklist (zero performance impact when empty).
damage-indicator-show-group-count=Shows grouped labels with the number and localized name of grouped entities, such as [7x Wall]. Disable to show only the damage text.
damage-indicator-shadow-style=Controls readability versus performance. Light uses three shadow text objects per indicator; Heavy uses five; Off uses only the colored text.
damage-indicator-font=Font prototype used for rendered damage text. The custom option uses the custom font family and size settings.
damage-indicator-compact-numbers=When enabled, large damage values use k/m/b notation, such as 1.0k, 10.0m, and 1.00b. When disabled, large values use full numbers with the selected number separator.
damage-indicator-number-separator=Separator used for full damage numbers when Compact damage numbers is disabled.
damage-indicator-text-template=Text to render for each indicator. Use __damage__ where the formatted damage number should appear. Use __reduced__ to place reduced damage manually.
damage-indicator-show-reductions=Shows the damage prevented from Stable Foundations: 50 (-50)..
damage-indicator-drift-style=Away from shooter moves numbers away from the source of damage. Upward keeps classic floating text. Mixed blends both.
damage-indicator-drift-distance=How far the indicator drifts over its lifetime, in tiles.
damage-indicator-color-mode=Damage type colors use source-inspired colors per damage type. Damage ramp ignores damage type and colors by amount from light yellow to dark red.
damage-indicator-blend-damage-type-colors=When enabled, combined damage indicators use a damage-weighted blend of their contributing damage type colors instead of keeping the first hit's color. Only applies to Damage type color mode.
damage-indicator-color-physical=RGB color used for physical damage indicators.
damage-indicator-color-impact=RGB color used for impact damage indicators.
damage-indicator-color-explosion=RGB color used for explosion damage indicators.
damage-indicator-color-fire=RGB color used for fire damage indicators.
damage-indicator-color-laser=RGB color used for laser damage indicators.
damage-indicator-color-electric=RGB color used for electric damage indicators.
damage-indicator-color-acid=RGB color used for acid damage indicators.
damage-indicator-color-poison=RGB color used for poison damage indicators.
damage-indicator-color-intensity=When enabled, low damage appears slightly lighter/desaturated and high damage appears slightly deeper/more saturated while preserving the damage type color.
damage-indicator-color-intensity-cap=Damage at or above this amount reaches maximum color intensity or maximum ramp color.
damage-indicator-viewport-culling=Skips creating indicators that are outside every eligible player's estimated screen view.
damage-indicator-viewport-margin=Extra tiles added around the estimated screen view so edge-of-screen indicators are not culled too aggressively.
damage-indicator-killing-blow=Appends a marker (default !) to the damage number that delivered the killing blow, and adds a subtle emphasis pulse so the final hit stands out.
damage-indicator-killing-blow-marker=Suffix appended to the damage number on a killing blow. Leave blank to disable the suffix while keeping the emphasis pulse.
damage-indicator-alt-mode=Only display damage indicators when in alt mode.
damage-indicator-debug-info=For debugging purposes, shows the damage indicator's internal state.
damage-indicator-group-name-normalize=Group up similar variant entities, such as enemies from Rampant. Comma-separated Lua patterns, each with one capture group `(...)` that extracts the base name from a tiered/versioned internal name.
damage-indicator-saturation-threshold=How many damage indicators can be displayed from the same entity type before grouping them into a single indicator.
damage-indicator-server-override-string=Overrides user damage indicator settings with the given startup settings. Useful for servers to enforce consistent damage indicators. Generate a string in-game with [color=#FFE6C0]/damage-indicators-override[/color]. This synchronized map setting is shared by every peer. [font=default-bold]Leave empty to disable[/font].

