the-cave-cavetorio-intro-message=[The Cave: CAVETORIO]\n\nWelcome to the Warp Outpost. Your Main Train is the heart of this expedition. Every warp sends the Warp Outpost and everything inside it to a new cave.\n\nOnly things inside the Warp Outpost are saved. Anything outside the Outpost is left behind.\n\nIf you are outside the Outpost when warp happens, your body, armor, equipment, weapons, ammo, vehicles, and inventory are lost. You will respawn in the next cave with an empty inventory.\n\nThe Main Train must survive. If its final registered locomotive is destroyed, a 30-second warning starts and the expedition automatically restarts from a fresh cave.\n\nUse Manual Warp to leave early. In multiplayer, Manual Warp requires a majority vote.\n\nResearch Warp Outpost Expansion to make the Outpost bigger. Research Warp Outpost Time to stay longer before the next warp.\n\nSurvive. Expand. Return before the warp.

