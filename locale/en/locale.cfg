server-important-title=IMPORTANT
server-important-collapse-disabled=◆ Cave collapses are DISABLED in this world. Support Struts research is hidden and no ceiling warnings, alarms or cave-ins can occur.
server-important-collapse-enabled=⚠ CAVE COLLAPSES ARE ENABLED. The original fast collapse balance is active. Unsupported excavations can cave in without advance stress markers and may crush players or buildings. React immediately when the boxed countdown, alarm and cracking sounds begin.
server-important-darkness=● Outside the spawn-safe zone, find powered light within 30 seconds or cave creatures will attack.
server-important-advancing-directions=⚠ ADVANCING COLLAPSE: the south/down route is sealed. Every playable zone is ahead to the north/up. Cross the electric line only if you want the southern guards to attack.
server-important-directions=◆ Everything on Nauvis directions: north/up Aquilo, south/down Gleba, east/right Fulgora, west/left Vulcanus.
server-important-planets=◆ Everything on Nauvis is disabled; use normal Space Age interplanetary progression.
server-important-startup=◆ Startup settings are shared, read-only after loading and require a restart to change.
