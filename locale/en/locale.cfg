[entity-description]
the-cave-lamp-pole=Combines a Basic Big Pole and a lamp. Wire reach: 32 tiles. Supply area: 7x7. Lamp consumption: 20 kW while on. While powered, protects players within 30 tiles from Darkness Infestation. Unlocked with Lamp Post.
the-cave-small-metal-electric-pole=A small iron electric pole. Uses the same connections, wire reach and supply area as the original Small Electric Pole.
the-cave-train-fluid-transfer-tank-5x5=Fixed 70,000-fluid transfer tank inside the Fluid Wagon. The left tank exports and the right tank imports.
the-cave-train-locomotive-substation=Fixed Main Locomotive power Substation with 36×36 supply coverage and 36-tile wire reach. It feeds the separate Garden connector through a scripted copper link; secondary locomotives do not receive one.
the-cave-train-garden-substation=Fixed lower Garden wire connector with 36-tile wire reach and direct supply limited to its protected 2×2 footprint. Connect player-built electric poles to power Garden machines.
the-cave-train-battery-info-panel=Explains how visible interior power wiring charges the Train Battery and supplies exterior power.
the-cave-train-battery-output-reserve=One-way 0.25-second output reserve for the scripted Train Battery. Powers machines and charges exterior accumulators alongside exterior generators. Exterior power cannot charge the Train Battery.
the-cave-train-battery-interior-charger=One-way interior charging interface for the scripted Train Battery. It is not a player-built accumulator and receives power only from the Main Train interior network.
the-cave-garden-item-input=Fixed one-way item route from the Main Locomotive into the Locomotive Garden.
the-cave-garden-item-output=Fixed one-way item route from the Locomotive Garden back into the Main Locomotive.
the-cave-garden-fluid-input=Fixed one-way fluid route from the Main Locomotive into the Locomotive Garden.
the-cave-garden-fluid-output=Fixed one-way fluid route from the Locomotive Garden back into the Main Locomotive.
the-cave-scrap-resource=Salvage found in Uranium Caves. Mine by hand or with ordinary mining drills from the start of the game, without research or sulphuric acid. Each completed mining cycle yields 10 The Cave Scrap.
the-cave-fortified-vault-entrance=Descend into a one-use, thirty-minute underground treasure raid. Clear the upper defenders before entering.
the-cave-fortified-vault-entrance-1=Descend into a one-use, thirty-minute underground treasure raid. Clear the upper defenders before entering.
the-cave-fortified-vault-entrance-2=Descend into a one-use, thirty-minute underground treasure raid. Clear the upper defenders before entering.
the-cave-fortified-vault-exit=Escape to the upper Fortified room before the vault seals.
the-cave-fortified-vault-exit-1=Escape to the upper Fortified room before the vault seals.
the-cave-fortified-vault-exit-2=Escape to the upper Fortified room before the vault seals.
the-cave-fortified-vault-power-pole=Connect this fixed pole to your upper electric network to power the matching pole and arrival lamp below.
the-cave-fortified-vault-lamp=Fixed lower entrance lamp powered only through the matching upper vault pole.
the-cave-fortified-cache-standard=Click once to trigger three defenders. Defeat them, then click again to claim the reward.
the-cave-fortified-cache-secure=Click once to trigger four defenders. Defeat them, then click again to claim the reward.
the-cave-fortified-cache-high-security=Click once to trigger five defenders. Defeat them, then click again to claim the reward.
the-cave-uranium-cave-entrance=Descend into a Uranium Cave expedition. First entry starts a 30-minute timer, or 60 minutes with Bob's Ores active. Bob's Ores adds broad, rich resource beds and enabled thorium. Started expeditions keep their original deadline.
the-cave-uranium-cave-entrance-1=Descend into a Uranium Cave expedition. First entry starts a 30-minute timer, or 60 minutes with Bob's Ores active. Bob's Ores adds broad, rich resource beds and enabled thorium. Started expeditions keep their original deadline.
the-cave-uranium-cave-entrance-2=Descend into a Uranium Cave expedition. First entry starts a 30-minute timer, or 60 minutes with Bob's Ores active. Bob's Ores adds broad, rich resource beds and enabled thorium. Started expeditions keep their original deadline.
the-cave-uranium-cave-exit=Leave the Uranium Cave and return to the upper cave.
the-cave-uranium-item-down-input=Blue-belt-speed input. Items placed here travel down into the Uranium Cave.
the-cave-uranium-item-down-output=Blue-belt-speed output for items sent down from the surface.
the-cave-uranium-item-up-input=Blue-belt-speed input. Items placed here travel back to the surface.
the-cave-uranium-item-up-output=Blue-belt-speed output for items returned from the Uranium Cave.
the-cave-uranium-fluid-down-input=One-way fluid input from the surface to the Uranium Cave.
the-cave-uranium-fluid-down-output=One-way fluid output receiving fluid from the surface.
the-cave-uranium-fluid-up-input=One-way fluid input from the Uranium Cave to the surface.
the-cave-uranium-fluid-up-output=One-way fluid output receiving fluid from the Uranium Cave.
the-cave-uranium-power-bridge=Hidden cross-layer electric bridge used by the fixed Big Electric Poles.
the-cave-mineral-cave-entrance=Descend into a one-use 30-minute Iron, Copper or Coal mining expedition.
the-cave-mineral-cave-entrance-1=Descend into a one-use 30-minute Iron, Copper or Coal mining expedition.
the-cave-mineral-cave-entrance-2=Descend into a one-use 30-minute Iron, Copper or Coal mining expedition.
the-cave-mineral-cave-exit=Leave the Mineral Cave and return to the upper cave before the timer reaches zero.
the-cave-mineral-item-down-input=Blue-belt-speed input. Items placed here travel down into the Mineral Cave.
the-cave-mineral-item-down-output=Blue-belt-speed output for items sent down from the surface.
the-cave-mineral-item-up-input=Blue-belt-speed input for mined ore returning to the surface.
the-cave-mineral-item-up-output=Blue-belt-speed output for ore returned from the Mineral Cave.
the-cave-mineral-power-bridge=Hidden cross-layer electric bridge used by the fixed Mineral Cave Big Electric Poles.
the-cave-big-wooden-pole=A simple long-range iron electric pole. Connects wires over 24 tiles and provides a 4x4 supply area.
the-cave-portable-power-interface-mk1=Market-only emergency power source. Produces 50 kW, has 200 health, can be mined, repaired, damaged, and destroyed.
the-cave-portable-power-interface-mk2=Market-only emergency power source. Produces 80 kW, has 200 health, can be mined, repaired, damaged, and destroyed.
the-cave-portable-power-interface-mk3=Market-only emergency power source. Produces 100 kW, has 200 health, can be mined, repaired, damaged, and destroyed.
the-cave-portable-power-interface-mk4=Market-only emergency power source. Produces 150 kW, has 200 health, can be mined, repaired, damaged, and destroyed.
the-cave-portable-power-interface-mk5=Market-only emergency power source. Produces 250 kW, has 200 health, can be mined, repaired, damaged, and destroyed.
the-cave-wind-turbine=Produces electricity without fuel. Its output automatically follows the owning Force's Wind Turbine research: 1 MW, 1.5 MW, then a final 2 MW.
diggy-rock=The undug world. Mine it to reveal what lies beneath.
diggy-tree=An ordinary harvestable tree. Cutting it does not open cave terrain or trigger enemies.
the-cave-stack-inserter=Collects a full hand before placing real stacked items on transport belts.

lamp-post=Provides bright, efficient wide-area lighting for large cave rooms. While powered, it protects players within 30 tiles from Darkness Infestation.
electric-boiler=Uses electricity to heat fluids.

