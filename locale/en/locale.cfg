panel-text=MAIN TRAIN BATTERY POWER SYSTEM\n\nPOWER: Generate electricity anywhere inside the train.\nWIRING: Use visible electric poles to connect that network to the Main Train Battery Substation.\nINTERIOR: The connected grid powers machines throughout the train.\nCHARGING: Only available power from this interior network can charge the Train Battery.\nACCUMULATORS: Player-built accumulators stay ordinary members of their local network and never become Train Battery storage.\nGARDEN: The same Main Substation supplies the fixed Substation in the Locomotive Garden.\nEXTERIOR: Place a power pole inside the yellow 10-tile POWER RANGE square around the Main Locomotive. Stored battery power never connects to poles outside that square.\nONE-WAY OUTPUT: The Train Battery powers machines and charges exterior accumulators alongside exterior generators. Exterior power can never charge the Train Battery.\nOUTPUT RESERVE DISPLAY: The hidden 0.25-second transfer reserve is backed by Train Battery energy. It is not a player-built accumulator.\nOTHER LOCOMOTIVES: Additional locomotives do not receive a fixed Substation.\nIMPORTANT: No power is transferred automatically between wagon rooms.

