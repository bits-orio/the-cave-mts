[technology-description]
the-cave-storage-tank-1x1-technology=Unlocks the compact 1×1 storage tank. It does not unlock oil processing.
the-cave-storage-tank-2x2-technology=Unlocks the 2×2 storage tank with three pipe connections. It does not unlock oil processing.
the-cave-storage-tank-3x4-technology=Unlocks the advanced 3×4 storage tank with a fixed capacity of 40,000 fluid.
the-cave-storage-tank-5x5-technology=Unlocks the large 5×5 storage tank with a fixed capacity of 70,000 fluid.
the-cave-wind-turbine-1=Unlocks the Wind Turbine after Steel Processing. Every turbine belonging to this Force produces 1 MW.
the-cave-wind-turbine-2=Automatically raises every existing and future Wind Turbine belonging to this Force to 1.5 MW.
the-cave-wind-turbine-3=Automatically raises every existing and future Wind Turbine belonging to this Force to the final maximum of 2 MW.
the-cave-underground-pipe-reach=Increases Pipe to Ground reach by +__1__ tiles at this level. Total reach bonus: +__2__ tiles. Current maximum reach: __3__ tiles.
the-cave-underground-pipe-reach-1=Increases Pipe to Ground reach by +5 tiles. Total bonus: +5 tiles. Maximum reach: 15 tiles.
the-cave-underground-pipe-reach-2=Increases Pipe to Ground reach by +5 tiles. Total bonus: +10 tiles. Maximum reach: 20 tiles.
the-cave-underground-pipe-reach-3=Increases Pipe to Ground reach by +5 tiles. Total bonus: +15 tiles. Maximum reach: 25 tiles.
the-cave-underground-pipe-reach-4=Increases Pipe to Ground reach by +5 tiles. Total bonus: +20 tiles. Maximum reach: 30 tiles.
the-cave-underground-pipe-reach-5=Increases Pipe to Ground reach by +5 tiles. Total bonus: +25 tiles. Maximum reach: 35 tiles.
the-cave-underground-pipe-reach-6=Increases Pipe to Ground reach by +5 tiles. Total bonus: +30 tiles. Maximum reach: 40 tiles.
the-cave-underground-pipe-reach-7=Increases Pipe to Ground reach by +5 tiles. Total bonus: +35 tiles. Maximum reach: 45 tiles.
the-cave-underground-belt-reach=Increases the maximum placement reach of all official underground belt tiers by +__1__ tile(s) at this level. Total underground reach bonus: +__2__ tiles.
the-cave-transport-belt-capacity=Increases maximum belt and loader stack capacity to __1__ items. From level 2 onward, Burner, standard, Long-handed and Fast Inserters rise step by step; from level 15 onward, Bulk and Stack Inserters also rise by one per level.
the-cave-transport-belt-capacity-final=Increases maximum belt and loader stack capacity to __1__ items and raises the hand capacity of Burner, standard, Long-handed, Fast, Bulk and Stack Inserters to 20 items.
the-cave-belt-compression-1=Allows belts to carry small compressed item stacks when Space Age is not active.
the-cave-belt-compression-2=Improves cave belt compression for heavier underground logistics.
the-cave-belt-compression-3=Further improves belt stack capacity for cave mining routes.
the-cave-belt-compression-4=High-capacity belt compression for large resource caverns.
the-cave-belt-compression-5=Advanced belt compression for late-game underground transport.
the-cave-belt-compression-6=Maximum RedMew-style cave belt compression.
diggy-dig-speed-exact=Your miners learn to move more rock: +__1__% manual mining speed for the whole team. Total with all previous tiers: +__2__%.
diggy-support-reach-exact=Better struts and bracing: ALL your walls and reactors support the ceiling __2__ tiles around, up from __1__, the moment this completes. Pillars can stand one tile further apart.
the-cave-equipment-grid-upgrade=Expands the equipment grid of Modular Armor, Power Armor, Power Armor MK2, Tank, and Spidertron by +__1__ width and +__2__ height.
the-cave-underground-belt-reach-1=Increases the maximum placement reach of all official underground belt tiers by +2 tiles. Total underground reach bonus: +2 tiles.
