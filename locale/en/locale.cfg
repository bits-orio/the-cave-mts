[the-cave-fortified-vault]
spiral-rules=FORTIFIED SPIRAL\n15 stages.\nEASY 1–5: green floors, blue caches, biters, nests and gun turrets — 7 minutes per stage.\nMEDIUM 6–10: yellow floors/caches, stronger enemies and laser turrets — 8 minutes.\nHARD 11–15: red floors/caches, stronger enemies and flame turrets — 10 minutes.\nClear every enemy, nest and turret to build the next corridor and reset its timer. Looting is optional; caches stay available and never summon alarms.\nEXIT ONLY portals: stages 5, 10 and 15. The arrival portal also returns outside. Re-entry always starts at corridor 1. The shared timer keeps running while you are outside; unused time does not carry over.\nLeave before 00:00. Anyone still inside dies, the cave seals permanently, and all items left inside are lost.\nThe gap between corridors is out-of-map. Follow the spiral; no shortcuts. Cleared corridors stay clear.
spiral-exit-only=EXIT ONLY
spiral-stage-label=Corridor __1__ / 15
spiral-unlocked=[Fortified] Corridor __1__ / 15 is open. New shared timer: __2__ minutes.
spiral-hud=Fortified · Corridor __1__/15 · __2__
spiral-left=[Fortified] You exited. The timer keeps running. Re-entry returns to corridor 1.
legacy-rooms-rules=FORTIFIED ROOMS\n18 equal rooms, each 250 x 35 tiles.\nEASY 1–6: green floors, 8 blue caches per room, biters, nests and gun turrets — 7 minutes per room.\nMEDIUM 7–12: yellow floors, 6 yellow caches per room, stronger enemies and laser turrets — 8 minutes.\nHARD 13–18: red floors, 4 red caches per room, stronger enemies and flame turrets — 10 minutes.\nClear every enemy, nest and turret to build the next room and reset its timer. Rewards are near the far end of each room and may be collected later. Caches never summon alarms.\nThe blue hall is 35 x 595 tiles and is open from the start. Biters cannot enter it. Rooms are separated by 35 tiles of out-of-map. Enter rooms in order.\nThere are only TWO interior portals: the top arrival/return portal and one EXIT ONLY portal at the bottom of the blue hall. Both can be used immediately; there are no room checkpoint exits. Re-entry always returns to the top.\nThe shared timer keeps running outside; unused time does not carry over. Leave before 00:00. Anyone still inside dies, the cave seals permanently, and all items left inside are lost.
rooms-rules=FORTIFIED ROOMS\n18 equal rooms, each 250 x 35 tiles.\nEASY 1–6: green floors, 8 blue caches, 300 mixed easy enemies, 10 easy worms and 6 gun turrets per room — 10 minutes.\nMEDIUM 7–12: yellow floors, 6 yellow caches, 250 mixed medium enemies, 10 medium worms, 4 gun and 4 laser turrets per room — 12 minutes.\nHARD 13–18: red floors, 4 red caches, 200 mixed Big/Behemoth enemies, 10 Big/Behemoth worms, 4 gun, 4 laser and 4 flame turrets per room — 15 minutes.\nEnemy families: Biter, Spitter, Arachnid and Snapper, in equal shares (rounded per room). Each room has 12 nests: 4 Arachnid, 4 Snapper, 2 Biter and 2 Spitter. Nest spawn intervals are 2.5 / 4.25 / 6 seconds, subject to normal population and space limits. Nest offspring are additional enemies.\nPressure increases towards the far end. Nests are at least 20 tiles apart; turrets are at least 15 tiles apart. Enemy flame turrets do not damage their allies; player flames still damage enemies.\nEach additional simultaneous player adds 50% to the initial mobile enemy population. Nests, worms and turrets stay fixed. Leaving does not reduce the highest reached scaling.\nClear every enemy, nest, worm and turret to build the next room and reset its timer. Rewards are near the far end and may be collected later. Caches are indestructible and never summon alarms. Cleared rooms stay clear.\nThe blue hall is 35 x 595 tiles and is open from the start. Enemy units cannot enter it. Rows are separated by 35 tiles of out-of-map. Rooms open in order.\nThere are only TWO interior portals: the top arrival/return portal and one EXIT ONLY portal at the bottom of the blue hall. Both can be used immediately. Re-entry always returns to the top.\nThe shared timer keeps running outside; unused time does not carry over. After clearing room 18, its remaining time keeps counting down. Leave before 00:00. Anyone still inside dies, the cave seals permanently, and all items left inside are lost.
rooms-stage-label=Room __1__ / 18
rooms-unlocked=[Fortified] Room __1__ / 18 is open. New shared timer: __2__ minutes.
rooms-hud=Fortified · Room __1__/18 · __2__
rooms-left=[Fortified] You exited. The timer keeps running. Re-entry returns to the top entrance.
panel-text=FORTIFIED UNDERGROUND VAULT\n\nENTER: Clear every upper defender, then click the central entrance.\nPOWER: Connect electricity to the fixed upper Big Electric Pole. It powers the arrival lamp below.\nTIME: The first successful entry starts one shared 30-minute timer.\nCACHES: There is no personal or shared opening limit. Open as many as you can before the timer ends; balanced reward budgets still apply.\nHACKING: Start within 8 tiles and remain within 8 tiles while a cache unlocks. Moving farther away or changing surface cancels the attempt. Successful loot is delivered directly to your inventory.\nWARNING: Cache alarms summon defenders. The vault is pitch black beyond the powered arrival lamp.\nESCAPE: Click the lower exit before the timer reaches zero. Players left below die and their items remain trapped forever.
