game-mode-tooltip=Choose exactly one scenario. The Lobby will automatically apply a coherent set of internal mode switches.
mode-normal=Normal The Cave
mode-collapse=Cave Collapses
mode-digging=Digging Mode
mode-train=Train Interiors
mode-shelter=Shelter Defense
mode-cavetorio=CAVETORIO
mode-advancing=Advancing Collapse
mode-details-title=ABOUT — __1__
mode-info-normal=[font=default-semibold]THE CLASSIC, STATIONARY CAVE EXPERIENCE[/font]\n\n• Mine Solid Rock by hand to open permanent tunnels and discover resources, cavern rooms, enemies, treasure and enabled special locations.\n• Build one lasting factory around the normal force spawn; there is no mandatory moving base, protected mission core, warp timer or advancing deletion front.\n• Train Interiors, Shelter Defense, CAVETORIO, Cave Collapses and Advancing Collapse remain disabled.\n• Gameplay Modifiers and Features selected below still control resources, difficulty, lighting, research, enemies and optional cave systems.\n\n[font=default-bold]Recommended for:[/font] the standard open-ended The Cave progression and first-time players.
mode-info-collapse=[font=default-semibold]THE CLASSIC CAVE WITH STRUCTURAL DANGER[/font]\n\n• Uses the normal stationary cave and exploration rules, but active cave-ins can destroy unsupported areas.\n• Only a genuinely scheduled collapse reveals its exact 2×2 danger area with a boxed countdown; there are no advance stress triangles.\n• Every player begins with 2,000 Stone Walls. Walls and supported reactors protect nearby ceiling, but no supports are placed automatically.\n• Support Struts research extends protection reach from 4 to 14 tiles as the factory grows.\n\n[font=default-bold]Recommended for:[/font] players who want the normal Cave with construction pressure and destructive environmental risk.
mode-info-digging=[font=default-semibold]ROCK MINING BECOMES THE MAIN RESOURCE ECONOMY[/font]\n\n• Normal and mixed ore patches are disabled; the Resource Patch Size setting is ignored.\n• Mining Solid Rock supplies the main basic-resource rewards. This Lobby mode starts at Digging I with the standard 1× digging reward multiplier.\n• Oil remains unchanged, and tiny starter deposits remain near spawn only to protect early progression.\n• All normal cave exploration, rooms, enemies and enabled Features continue to operate.\n\n[font=default-bold]Recommended for:[/font] players who want continuous manual excavation to replace conventional ore-field expansion.
mode-info-train=[font=default-semibold]A MOBILE FACTORY INSIDE THE MAIN TRAIN[/font]\n\n• A starter Main Train provides persistent interiors that travel with supported locomotives and wagons. Respawns follow the live Main Train.\n• Stand near a supported train part and press [font=default-bold]Ctrl + Enter[/font] once to enter or leave. Normal Enter on a locomotive still drives it.\n• Cargo Wagon rooms use a fixed [font=default-bold]left-side Export Industrial Warehouse[/font] and [font=default-bold]right-side Import Industrial Warehouse[/font]. A Fluid Wagon room has exactly two fixed 5×5 tanks at its lower corners: the [font=default-bold]left tank exports[/font] fluid back into the real wagon and the [font=default-bold]right tank imports[/font] fluid from it. Connect ordinary pipes or tanks to the labelled side you need.\n• Interior power connected to the Main Locomotive Substation charges the Train Battery. Stored power can feed exterior poles only inside the marked yellow power range. Power is not transferred automatically between separate wagon rooms.\n• Walk onto the 2×2 portal in the Main Locomotive or Locomotive Garden to travel automatically; arrival uses the separate grey landing pad. Fixed Industrial Store Boxes provide one-way INPUT TO GARDEN and OUTPUT FROM GARDEN item routes, while the paired Underground Pipes carry fluid.\n• Research expands interior factory space, battery capacity and Main Train part capacity. Abandoned train parts can be discovered and added while capacity remains.\n• Train Wave Defense attacks the Main Train after the selected preparation period; protect the persistent Main Locomotive and keep the train supplied.\n\n[font=default-bold]Recommended for:[/font] players who want exploration, logistics and defense centred on a moving underground base.
mode-info-shelter=[font=default-semibold]DEFEND ONE PERMANENT UNDERGROUND SHELTER[/font]\n\n• One immovable Cave Shelter with 5,000 base HP becomes the fixed mission core. Enemy waves attack it after the selected preparation period.\n• Stand within 10 tiles and press [font=default-bold]Ctrl + Enter[/font] once to enter or leave. Inside, the outside-view camera follows the fixed Shelter and the complete current room is visible on the map.\n• Fixed item lanes and labelled fluid ports connect the exterior and interior. Exterior Fluid Input feeds both interior INPUT ports; both interior OUTPUT ports return fluid to the exterior output.\n• Connect the interior grid to the fixed Substation to charge the 20-stage Shelter Battery. Stored power can be exported through the marked exterior connection area.\n• Shelter Shield research raises the objective to 35,000 HP and 50 HP/sec self-repair, beginning 10 seconds after the last hit. Manual and robot repair remain disabled.\n• Interior research expands the main floor from 40×40 to 300×300, with separate utility lanes for pipes, tanks, pumps and electric poles. Tunnel-distance research pushes enemy attack routes farther away.\n• The Shelter cannot be moved or mined. If it is destroyed, the staged soft reset begins and players return to the Main Lobby.\n\n[font=default-bold]Recommended for:[/font] teams that want a fixed-base wave-defense objective with protected interior production.
mode-info-cavetorio=[font=default-semibold]A REPEATING WARP-OUTPOST TRAIN EXPEDITION[/font]\n\n• CAVETORIO automatically combines Train Interiors with Everything on Nauvis and keeps Shelter Defense disabled.\n• The Main Train is the mission core inside a protected Warp Outpost. When the timer expires, only the Outpost and everything inside it transfer to a fresh cave.\n• Buildings, vehicles and supplies left outside are abandoned. Players caught outside lose their carried expedition equipment and respawn in the next cave empty.\n• Use Manual Warp to leave early; multiplayer requires a majority vote. Research expands the Outpost, extends cave time and increases its safety ring.\n• Enemy pressure grows across warps. Losing the final registered Main Train locomotive starts the expedition restart warning. Train interiors still use Ctrl + Enter and the Garden portal remains automatic.\n\n[font=default-bold]Recommended for:[/font] experienced teams who want timed expeditions, controlled extraction and escalating long-term survival.
mode-info-advancing=[font=default-semibold]KEEP MOVING NORTH OR BE ERASED[/font]\n\n• The world becomes a 510-tile-wide northbound ribbon divided into 1024-tile zones. The south route is sealed by an electric warning line and patrolling guards.\n• A visible two-hour connected-gameplay preparation timer starts before the advancing collapse. After zero, terrain, buildings and vehicles are permanently removed from south to north.\n• Move the complete factory, transport network and stored supplies north/up; anything left behind is unrecoverable. Unsafe respawns are moved at least 40 tiles ahead of the collapse.\n• Guards attack only players who cross the southern line, return to patrol after retreat and do not invade the northern factory.\n• With Space Age, future planet-zone families unlock through their discovery research and are separated by one or two Nauvis recovery zones. No train or external transport mod is required.\n\n[font=default-bold]Recommended for:[/font] players who want continuous relocation, strict deadlines and irreversible map loss. Existing generated zones keep their previous dimensions; the new layout begins in the first fully ungenerated zone.
