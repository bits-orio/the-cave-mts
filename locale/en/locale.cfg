server-title=SERVER INFORMATION
server-welcome=Welcome to The Cave. Dig outward, uncover new rooms, build a secure underground factory and prepare before entering deeper, more dangerous regions.
server-map-title=CURRENT MAP
server-map-body=Running time: __1__h __2__m\nPlayers online: __3__ / __4__\nThe map, research, forces and all Startup settings are shared by the server.
server-profile-title=CURRENT WORLD PROFILE
server-profile-body=Everything on Nauvis: __1__\nGlobal difficulty: __2__\nUnderground lighting: __3__
server-safety-title=IMPORTANT
server-safety-body=Startup settings are locked after Factorio loads the mod prototypes. This menu reports the active configuration but never changes it. Back up important saves before updating mods or changing Startup settings.
category-overview=Overview
category-exploration=Caverns & Exploration
category-resources=Resources & Digging
category-space-age=Space Age Regions
category-missions=Missions & Special Areas
category-combat=Combat & Economy
category-trains=Train Interiors
category-cavetorio=CAVETORIO
category-research=Research & Upgrades
category-machines=Machines & Logistics
category-quality-life=Quality of Life & Multiplayer
overview-core-title=THE CAVE CORE LOOP
overview-core-body=The world begins buried under Solid Rock. Mine it directly to reveal terrain and deterministic discoveries, then turn each opened chamber into a connected underground factory. Exploration, production, research and defence all grow together.
overview-depth-title=FOUR DEPTH ZONES
overview-depth-body=Distance from the centre defines Easy, Medium, Hard and Nightmare zones. Medium begins at 300 tiles, Hard at 700 and Nightmare at 1,000. Deeper zones increase enemy strength and unlock more dangerous rooms and better rewards.
overview-config-title=CONFIGURABLE SCENARIO
overview-config-body=The Cave contains many independent Startup, map and per-player options. It supports Base Game and Space Age, normal planetary travel or Everything on Nauvis, optional Train Interiors, CAVETORIO, challenge modes and many integrated systems.
explore-dig-title=DIGGING AND DISCOVERY
explore-dig-body=Directly mine Solid Rock to open the cave. A dig may reveal normal terrain, a seeded cavern room, an ambush, resources or treasure. Cave Collapses can be disabled completely or enabled with the original structural danger and Support Struts research.
explore-rooms-title=CAVERN ROOMS
explore-rooms-body=Rooms include resource halls, treasure chambers, enemy nests, guarded areas and region-specific discoveries. Enemy Nest Rooms contain one biter nest, one spitter nest and one armoured nest, with danger scaled by depth.
explore-darkness-title=DARKNESS INFESTATION
explore-darkness-body=Outside the 5×5-chunk spawn-safe zone, remain within 12 tiles of a powered Small Lamp or 30 tiles of a powered Lamp Post. After 30 unprotected seconds, cave enemies begin spawning near you. Driving and protected interiors reset the timer.
explore-treasure-title=TREASURE AND GUARANTEED OIL
explore-treasure-body=Treasure scales through depth tiers and can include materials, equipment, ammunition and coins. A starter crude-oil deposit is guaranteed roughly 80–100 tiles from spawn and remains hidden until digging comes within six tiles.
resources-veins-title=MIXED RESOURCE VEINS
resources-veins-body=The Cave can generate continuous mixed ore tendrils rather than isolated vanilla patches. Resource size, richness and stack sizes have dedicated options, while Ore Patch Protection prevents accidental destruction of valuable deposits.
resources-digging-title=DIGGING MODE
resources-digging-body=Optional Digging Mode removes normal ore patches and makes mined cave rock the main resource source. Hardcore gives 0.5× rewards; Digging I–IV give 1×, 2×, 3× or 4×. Oil and small progression-safe starter deposits remain available.
resources-missing-title=ORE PATCH MISSING
resources-missing-body=This optional challenge secretly removes one basic ore type from natural patches for the map. That missing resource is instead recovered through digging, changing logistics without announcing the answer directly.
resources-tools-title=RESOURCE TOOLS
resources-tools-body=Filter Mining Drills lets players select drills and restrict them to one resource. Resource Eraser, when permitted, permanently removes selected resources with a 10,000-entity safety limit and optional admin-only access.
space-mode-title=EVERYTHING ON NAUVIS
space-mode-body=When enabled with Space Age, all four Planet Discoveries are completed and planetary progression is folded into one cave: north/up leads to Aquilo, south/down to Gleba, east/right to Fulgora and west/left to Vulcanus. Space Science is researched with the three planetary packs plus Chemical Science and crafted on the cave surface. When disabled, official discoveries, Space Science, planets and normal interplanetary travel remain intact.
space-mode-advancing-body=Advancing Collapse replaces the normal radial planet layout. Every playable zone is ahead to the north/up; the south/down route is permanently sealed. Because all four Planet Discoveries are completed at game start, every Space Age zone family is available for future unassigned northbound zones. One or two Nauvis recovery zones always separate consecutive planet-family zones.
space-vulcanus-title=VULCANUS REGION — WEST / LEFT
space-vulcanus-advancing-title=VULCANUS ZONE FAMILY — NORTHBOUND
space-vulcanus-body=Volcanic caves provide lava, calcite, tungsten, coal, sulphuric-acid geysers, volcanic rocks and progression rooms. Resources directly beneath a moving Demolisher are preserved. Eligible Uranium, Iron, Copper and Coal extraction entrances may open alone in safe side chambers, while ordinary, enemy, treasure and progression rooms remain suppressed for Demolisher carving. A local sealed frontier envelope prevents nearby Demolisher body segments from disappearing into out-of-map terrain. Train Interiors stock and unclaimed train parts ignore Demolisher damage only; all other damage remains normal.
space-gleba-title=GLEBA REGION — SOUTH / DOWN
space-gleba-advancing-title=GLEBA ZONE FAMILY — NORTHBOUND
space-gleba-body=Organic caves contain stromatolites, yumako and jellynut plants, marshes, water, egg rafts and pentapod threats. Region rooms support the biological production chain needed for Gleba progression.
space-fulgora-title=FULGORA REGION — EAST / RIGHT
space-fulgora-advancing-title=FULGORA ZONE FAMILY — NORTHBOUND
space-fulgora-body=Fulgoran caves contain scrap, oil ocean, ruins, vault ruins, fulgorite and active lightning. Lightning protection and electromagnetic progression remain important even inside the shared cave surface.
space-aquilo-title=AQUILO REGION — NORTH / UP
space-aquilo-advancing-title=AQUILO ZONE FAMILY — NORTHBOUND
space-aquilo-body=Frozen caves provide crude oil, lithium brine, fluorine vents, icebergs and ammoniacal ocean. Progression rooms provide the resources needed for cryogenic development without scripted machine-freezing behaviour.
mission-uranium-title=URANIUM SALVAGE CAVERNS
mission-uranium-body=From Medium depth, eligible rooms can open a lower-cave expedition. Normally, the 30-minute cave has continuous thin tendrils containing roughly 50% Uranium Ore and 50% The Cave Scrap. With Bob's Ores active, new expeditions last 60 minutes and reveal broad beds with 10x per-tile richness, including enabled thorium. Scrap can be mined from the start without research or acid. Uranium still requires Uranium mining research and sulphuric acid; Bob's thorium keeps its own mining rules. Started expeditions keep their original deadline. The lower cave has no fixed distance or total-resource cap.
mission-mineral-title=IRON, COPPER AND COAL CAVES
mission-mineral-body=From Medium depth onward, 20% of eligible ordinary empty rooms in every main-surface region can become a single-resource Mineral Cave without replacing Uranium or special-room rolls. After five opened empty-room misses, the next location legal for at least one enabled resource is guaranteed. Iron, Copper and Coal can each be enabled independently; enabled types retain their relative weights from the deterministic 5 Iron / 3 Copper / 2 Coal cycle. The 192-tile rule applies only to the same resource, so different Mineral types and Uranium may be adjacent. Entrances may be discovered in advance, but only one Iron/Copper/Coal expedition can run per Force; first entry starts its 30-minute timer. The dry pitch-black cave generates at most ten large rooms while manually dug tunnels and extremely rich veins continue without a distance cap.
mission-vault-title=FORTIFIED VAULT RAIDS
mission-vault-body=FORTIFIED ROOMS\n18 equal rooms, each 250 x 35 tiles.\nEASY 1–6: green floors, 8 blue caches, 300 mixed easy enemies, 10 easy worms and 6 gun turrets per room — 10 minutes.\nMEDIUM 7–12: yellow floors, 6 yellow caches, 250 mixed medium enemies, 10 medium worms, 4 gun and 4 laser turrets per room — 12 minutes.\nHARD 13–18: red floors, 4 red caches, 200 mixed Big/Behemoth enemies, 10 Big/Behemoth worms, 4 gun, 4 laser and 4 flame turrets per room — 15 minutes.\nEnemy families: Biter, Spitter, Arachnid and Snapper, in equal shares (rounded per room). Each room has 12 nests: 4 Arachnid, 4 Snapper, 2 Biter and 2 Spitter. Nest spawn intervals are 2.5 / 4.25 / 6 seconds, subject to normal population and space limits. Nest offspring are additional enemies.\nPressure increases towards the far end. Nests are at least 20 tiles apart; turrets are at least 15 tiles apart. Enemy flame turrets do not damage their allies; player flames still damage enemies.\nEach additional simultaneous player adds 50% to the initial mobile enemy population. Nests, worms and turrets stay fixed. Leaving does not reduce the highest reached scaling.\nClear every enemy, nest, worm and turret to build the next room and reset its timer. Rewards are near the far end and may be collected later. Caches are indestructible and never summon alarms. Cleared rooms stay clear.\nThe blue hall is 35 x 595 tiles and is open from the start. Enemy units cannot enter it. Rows are separated by 35 tiles of out-of-map. Rooms open in order.\nThere are only TWO interior portals: the top arrival/return portal and one EXIT ONLY portal at the bottom of the blue hall. Both can be used immediately. Re-entry always returns to the top.\nThe shared timer keeps running outside; unused time does not carry over. After clearing room 18, its remaining time keeps counting down. Leave before 00:00. Anyone still inside dies, the cave seals permanently, and all items left inside are lost.
mission-special-title=SPECIAL CAVERN SYSTEMS
mission-special-body=Depth, biome and settings can introduce guarded resource rooms, progression rooms, enemy halls, treasure chambers and mission entrances. Discoveries are generated from stable map data so multiplayer peers receive the same result.
combat-enemies-title=ENEMIES AND AMBUSHES
combat-enemies-body=Direct digging can trigger controlled ambushes with cooldown and nearby-unit safety limits. Enemy types, room populations and Darkness waves scale with evolution, global difficulty and depth, including integrated Armoured Biters.
combat-blood-title=ORE IS BLOOD
combat-blood-body=Optional Ore Is Blood turns selected combat rewards into resources and coins, including rewards from armoured enemy tiers. It provides an aggressive alternative economy without replacing normal cave production.
combat-rockets-title=CHEMICAL AND INCENDIARY ROCKETS
combat-rockets-body=Integrated Chemical Rockets combine poison and slowdown, while Incendiary Rockets create a wide burning area. They extend late combat options without requiring the original standalone mod.
combat-market-title=COINS AND MARKET
combat-market-body=Combat and exploration can award coins used through The Cave market systems. Portable emergency power interfaces and other specialised rewards provide recovery options without replacing the normal technology tree.
train-interior-title=PORTABLE TRAIN INTERIORS
train-interior-body=Supported locomotives and wagons can contain persistent private factory surfaces that travel with the rolling stock. Enter the nearest part with Ctrl+Enter or the shortcut; normal Enter on a locomotive remains available for driving.
train-expansion-title=TRAIN GROWTH AND PARTS
train-expansion-body=The Main Train starts with three registered parts and can expand to ten. Interiors start at 40×40 and six research levels expand them through 60×60, 80×80, 92×100, 92×160, 92×220 and 92×280. The central connector matches each room's height through 40, 60, 80, 100, 160, 220 and 280 tiles while retaining ten blue utility rows on each side. Wagon-room centres are reserved 96 tiles apart; the maximum 92-tile room width leaves a four-tile connector between adjacent rooms. Newly generated Nauvis cave chunks guarantee another abandoned train part at least 200 tiles from every previous find, with no depth-zone or global find cap. Found parts can be merged into the expedition only while Main Train capacity remains.
train-power-title=BATTERY AND SHIELD RESEARCH
train-power-body=Twenty battery tiers provide 2,000–250,000 MJ capacity with 50–1,000 MW charge rates. Ten shield tiers raise protection from 5,000 to 35,000 and regeneration to 50 health per second.
train-garden-title=GARDEN, MAP AND CO-OP
train-garden-body=Train systems include a garden area, camera/map tools, shared access and multiplayer voting where needed. Interior surfaces are exempt from Darkness Infestation and use stable, fully lit conditions.
cavetorio-core-title=CAVETORIO EXPEDITION
cavetorio-core-body=CAVETORIO turns The Cave into a repeating Warp Outpost expedition. The Main Train is the mission core, and only the Outpost and everything inside it transfer to the next fresh cave when the warp occurs.
cavetorio-outpost-title=OUTPOST PROGRESSION
cavetorio-outpost-body=Research expands the protected Outpost from 25×25 up to 200×200, extends cave time from 30 to 160 minutes and grows the safety ring from 10 to 80 tiles. Manual Warp can leave early and uses majority voting in multiplayer.
cavetorio-waves-title=WAVES AND LOSS RULES
cavetorio-waves-body=Enemy waves intensify across warps, with bosses every tenth wave, recovery breaks every fiftieth and Nightmare pressure from warp 60. Anything outside the Outpost is abandoned; players caught outside lose their carried expedition equipment.
research-character-title=CHARACTER PROGRESSION
research-character-body=Thirty-five Dig Speed technologies accelerate manual excavation. Ten Character Reach levels add +20 total reach to five interaction distances while manual F-key item pickup stays at vanilla range. Ten Toolbelt levels add 100 inventory slots, and research also improves running and crafting.
research-logistics-title=LOGISTICS PROGRESSION
research-logistics-body=Eighteen Belt Capacity levels raise supported belt stacks to 20. Seven Underground Belt Reach levels add nine tiles, seven Underground Pipe Reach levels reach 45 tiles, and ten Support Struts levels extend wall/reactor ceiling support from 4 to 14 tiles when collapses are active.
research-combat-title=COMBAT AND EQUIPMENT
research-combat-body=Ten Turret Range levels add +15 range to supported non-artillery turrets. Three Equipment Grid upgrades add +2, +4 and +6 dimensions to supported armour, tanks and Spidertrons while preserving items, blueprints and quality.
research-inserter-title=INSERTER CONFIGURATION
research-inserter-body=Four research levels unlock longer, diagonal and off-axis inserter pickup/drop positions plus precise drop offsets. The GUI and hotkeys preserve existing inserters and require the appropriate research before locked positions can be used.
machines-heat-title=FURNACES, BOILER AND SUPERHEATING
machines-heat-body=Optional integrated electric stone/steel furnaces, advanced electric furnaces and an electric boiler expand cave production. Superheating adds configurable fuel-value upgrades without requiring separate standalone mods.
machines-storage-title=STORAGE SYSTEMS
machines-storage-body=Four Extra Storage Tanks provide fixed 2,000, 8,000, 40,000 and 70,000-fluid capacities. Twenty-eight Industrial Containers cover 1×1, 2×2, 4×4 and 6×6 footprints, with dedicated research and configurable inventories.
machines-logistics-title=LOADERS AND STATUS INDICATORS
machines-logistics-body=Integrated industrial loaders support compact high-throughput logistics. Production Status Indicators provide clear visual machine feedback, while filter-drill variants and specialised selection tools improve mixed-resource handling.
machines-early-title=EARLY CAVE MACHINES
machines-early-body=The Cave includes a long-range iron pole, Lamp Post and optional starter systems. These provide practical early underground power, lighting and construction routes.
quality-start-title=FASTER START AND STARTER PACK
quality-start-body=Optional starting systems can grant carefully defined early items. Faster Start provides compact modular armour, a 250 kW reactor, roboport, batteries, a faster exoskeleton and construction robots without Night Vision.
quality-teleport-title=INTEGRATED WAYPOINT TELEPORTER
quality-teleport-body=Open the Teleporter from Factorio's shortcut bar or press Ctrl+T. Teleporter I is still required before its window can be used. Its three force-wide research levels unlock 2, 3 and 4 personal destination slots without deleting saved points. Saving costs 200 Electronic Circuits; each Teleport or Back trip costs 10 Advanced Circuits and starts one shared two-minute cooldown.
quality-feedback-title=DAMAGE, REPAIR AND CLEANUP
quality-feedback-body=Integrated Damage Indicator offers per-player visual combat feedback. Automatic inventory repair, corpse cleanup radius/fade controls and production indicators reduce repetitive maintenance while remaining configurable.
quality-tools-title=BUILDING AND MOVEMENT TOOLS
quality-tools-body=Squeak Through compatibility, resource selection tools, configurable chests and stack sizes, extra tanks, loader integration and blueprint-safe research upgrades support large underground factories without changing their core identity.
quality-multiplayer-title=MULTIPLAYER AND TEAMS
quality-multiplayer-body=Multi-Team Support can give each team its own force and cave surface. Offline Player Body protection, force-aware progression, deterministic discoveries and shared mission ownership keep multiplayer state stable and visible in the Caves table.
settings-title=CURRENT SETTINGS
settings-read-only=This page lists the values currently loaded by Factorio. It is read-only. Startup values require changing Mod Settings and restarting; map settings are server-wide; per-player settings affect only you.
