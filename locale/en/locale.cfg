controls-title=CONTROLS
controls-intro=These are the main The Cave actions. Key bindings can be changed in Settings > Controls. Features whose Startup setting is disabled will not respond.
control-train-title=Enter Train Interior
control-train-body=Enter or leave the nearest supported locomotive or wagon interior. The shortcut-bar button performs the same action.
control-teleporter-title=Open Teleporter
control-teleporter-body=Open or close the existing Teleporter waypoint window. The shortcut-bar button performs the same action.
control-automatic=AUTOMATIC
control-garden-title=Locomotive Garden Portal
control-garden-body=Walk onto the 2x2 portal to travel automatically. You arrive at the centre of the separate grey landing pad on the opposite floor; no key is required.
control-corpses-title=Clean Nearby Corpses
control-corpses-body=Remove temporary enemy corpses around your character using the configured cleanup radius. The shortcut-bar button performs the same action.
control-drills-title=Filter Mining Drills
control-drills-body=Take the selection tool, drag over mining drills and choose the one resource they should mine.
control-eraser-title=Resource Eraser
control-eraser-body=Permanently delete selected resource entities when the server's access setting permits it. Use carefully; this cannot be undone.
control-inserter-rotate-title=Rotate Inserter Pickup / Reload Gun Turrets
control-inserter-rotate-body=Ctrl+R rotates a selected configurable Inserter; otherwise it reloads friendly Gun Turrets in the nearby 20x20 area. The shortcut-bar button always runs Gun Turret reload directly. Ctrl+Shift+R rotates the pickup anti-clockwise.
control-inserter-distance-title=Adjust Inserter Distance
control-inserter-distance-body=Adjust drop distance with F and pickup distance with Ctrl+F. Additional unbound offset controls can be assigned in Settings > Controls.
