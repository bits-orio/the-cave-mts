[the-cave-welcome]
title=THE CAVE
subtitle=Dig. Explore. Build. Survive.
begin-title=HOW TO BEGIN
begin-body=Mine Solid Rock by hand to open the cave. Direct digging can uncover rooms, resources, treasure and enemies, and it may trigger an ambush. Establish power, lighting and defences before pushing far from the starting area. Deeper zones are more dangerous, but their discoveries and rewards are stronger.
darkness-on-title=DARKNESS INFESTATION — ACTIVE
darkness-on-body=The 5×5-chunk area around your force's spawn is safe. Outside it, remain within 12 tiles of a powered Small Lamp or 30 tiles of a powered Lamp Post. When the darkness warning appears, you have 30 seconds to find light. If you remain unprotected, cave creatures begin spawning nearby and attack you. Driving a vehicle resets the darkness timer.
darkness-off-title=DARKNESS INFESTATION — DISABLED
darkness-off-body=The 30-second Darkness Infestation attack is disabled in this save. Lighting is still important for visibility, but being away from a powered lamp will not activate this particular enemy-spawning system.
nauvis-on-title=EVERYTHING ON NAUVIS — ENABLED
nauvis-on-body=Space Age progression is integrated into the shared cave world. Dig north / up for Aquilo, south / down for Gleba, east / right for Fulgora, and west / left for Vulcanus. These regions begin beyond the central Nauvis cave and become more dangerous as you travel farther from the centre.
nauvis-off-title=EVERYTHING ON NAUVIS — DISABLED
nauvis-off-body=The directional Space Age cave regions are not used. Space Age planets remain separate and you travel to Aquilo, Gleba, Fulgora and Vulcanus through normal interplanetary progression. The Cave itself remains on Nauvis.
advancing-collapse-title=ADVANCING COLLAPSE — ACTIVE
advancing-collapse-body=The south is sealed by an electric warning line and a guarded enemy strip. The guards patrol continuously, engage trespassers and return south when the player retreats; they never attack the factory to the north. You have two hours of connected gameplay to prepare; then the cave begins disappearing from south to north. Move your factory and supplies north / up. Terrain, buildings and vehicles left behind are permanently erased. The ribbon is 510 tiles wide, each zone is 1024 tiles long, and future Space Age zone families unlock through their planet-discovery research with one or two Nauvis zones between them. Existing generated zones keep their previous dimensions; the new layout begins in the first fully ungenerated zone.
cavetorio-title=CAVETORIO — ACTIVE
cavetorio-body=Your Main Train and Warp Outpost are the heart of the expedition. At warp, only the Outpost and everything inside it move to the next cave; everything outside is left behind. If you are outside when the warp happens, your character equipment, vehicles and inventory are lost. Protect every registered Main Train part and return before the timer expires.
features-title=WHAT YOU MAY DISCOVER
features-body=Depending on this save's settings and installed DLC, The Cave can include mixed resource veins, depth zones, special caverns, treasure rooms, enemy nests, Fortified Vault raids, Uranium Salvage Caverns, Space Age regions, portable Train Interiors, CAVETORIO expeditions, research upgrades, market rewards and many integrated machines and quality-of-life systems.
confirm=I Understand

[the-cave-info]
overview-evolution-title=Enemy progression
overview-evolution-body=On the Advancing Collapse main surface, distance does not assign Easy, Medium, Hard or Nightmare tiers. Enemy evolution determines enemy tiers; wave numbers and online players determine wave size. Planet-specific rules and other cave modes retain their own progression.
