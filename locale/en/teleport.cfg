[technology-description]
the-cave-teleporter-1=Unlocks the waypoint Teleporter and two total destination slots. Saving a destination costs 200 Electronic Circuits; every Teleport or Back trip costs 10 Advanced Circuits and starts a two-minute cooldown.
the-cave-teleporter-2=Preserves the first two saved destinations and unlocks a third total destination slot.
the-cave-teleporter-3=Preserves the first three saved destinations and unlocks the fourth and final destination slot.
