[mod-setting-name]
the-cave-nearby-ammo-display-mode=Nearby ammo count

[mod-setting-description]
the-cave-nearby-ammo-display-mode=Shows the number of loaded magazines above friendly ammo turrets within 100 tiles while ALT mode is enabled. Empty turrets display a red 0. This includes every researched The Cave Gun Turret range variant.

[string-mod-setting]
the-cave-nearby-ammo-display-mode-magazine=Magazine count
the-cave-nearby-ammo-display-mode-disabled=Disabled
