[technology-name]
the-cave-inserter-configuration=Inserter Configuration __1__

[technology-description]
the-cave-inserter-configuration-1=Unlocks straight pickup and drop positions up to two tiles away, plus precise drop-offset selection inside the destination tile. Standard inserters can now be configured for long reach.
the-cave-inserter-configuration-2=Unlocks the four outer diagonal pickup and drop positions.
the-cave-inserter-configuration-3=Unlocks the complete pickup and drop grid, including off-axis positions and supported longer-reach modded inserters.
the-cave-inserter-configuration-4=Completes the Inserter Configuration research path. Precise drop-offset selection is already available from level 1.

[technology-effect]
the-cave-inserter-configuration-1=Two-tile straight positions and drop-offset configuration
the-cave-inserter-configuration-2=Two-tile diagonal positions
the-cave-inserter-configuration-3=Complete pickup/drop grid
the-cave-inserter-configuration-4=Final configuration tier

[mod-setting-name]
the-cave-inserter-configurable=Inserter Configurable

[mod-setting-description]
the-cave-inserter-configurable=Enable or disable The Cave's Inserter Configuration system, including its research progression, pickup/drop controls, drop-offset controls and hotkeys. Do not enable it at the same time as Bob's Adjustable Inserters, Inserter Config, Side Inserters or another inserter-control mod. When using one of those mods, set this option to Disable.

[string-mod-setting]
the-cave-inserter-configurable-enabled=Enable
the-cave-inserter-configurable-disabled=Disable
