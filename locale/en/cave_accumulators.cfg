[entity-description]
the-cave-accumulator-3x3=Stores surplus electricity and supplies it when production is insufficient. Normal quality: 50 MJ capacity, 3 MW charging and discharging. Uses a 3x3 footprint.
the-cave-accumulator-6x6=Stores surplus electricity and supplies it when production is insufficient. Normal quality: 250 MJ capacity, 6 MW charging and discharging. Uses a 6x6 footprint.
the-cave-accumulator-10x10=Stores surplus electricity and supplies it when production is insufficient. Normal quality: 1 GJ capacity, 60 MW charging and discharging. Uses a 10x10 footprint. The front meter displays actual charge from red through yellow to green.
the-cave-accumulator-20x20=Stores surplus electricity and supplies it when production is insufficient. Normal quality: 5 GJ capacity, 300 MW charging and discharging. Uses a 20x20 footprint. Includes animated cooling fans and a front meter displaying actual charge from red through yellow to green.

[cave-portable-accumulators]
charged-name=__1__ (Charged)
item-description=Retains its stored electricity when picked up and placed again. Charged accumulators occupy one inventory slot each. Place it and connect it to an electric network to charge or use its stored energy.
stored-charge=Stored energy: __1__ / __2__ (__3__%)\nCharge is preserved in inventories and containers. Place the accumulator and connect it to an electric network to use or recharge it.
invalid-charge=This accumulator has invalid charge data. Placement was cancelled and the item was returned.
capacity-changed=This accumulator now has less capacity than its stored charge. Placement was cancelled and the charged item was returned.
restore-failed=The stored charge could not be restored. Placement was cancelled and the charged item was returned.
